<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Nunito', sans-serif;
        }

        body {
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Mobile Container Wrapper */
        .mobile-container {
            width: 100%;
            max-width: 414px; 
            background-color: #ffffff;
            min-height: 100vh;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Soft Orange/Peach Background Pattern Decoration (Top Right) */
        .mobile-container::before {
            content: '';
            position: absolute;
            top: -100px;
            right: -80px;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(255, 230, 218, 1) 0%, rgba(255, 255, 255, 0) 60%);
            z-index: 1;
        }

        /* Top Header Area for Back Button */
        header {
            display: flex;
            justify-content: flex-start;
            padding: 25px 20px;
            position: relative;
            z-index: 2;
        }

        /* Styled Back Button matching the reference image */
        .back-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background-color: #ffffff;
            color: #ff7854; /* Orange accent */
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            text-decoration: none;
            cursor: pointer;
            transition: transform 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .back-btn:hover, .back-btn:active {
            transform: scale(0.95);
        }

        /* Center Content Area */
        .content-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 2;
            padding-bottom: 100px; /* Offset to visually center it above the fold */
        }

        /* Icon Styling */
        .coming-soon-icon {
            font-size: 60px;
            background: linear-gradient(135deg, #ff5e62, #ff9966);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        /* Gradient Text Styling */
        .coming-soon-text {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(90deg, #ff5e62, #ff9966); /* Pinkish-red to Orange */
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
        }

        .sub-text {
            color: #888;
            font-size: 14px;
            font-weight: 600;
            margin-top: 10px;
        }

        /* Floating animation for the icon */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        /* Desktop scaling adjustments */
        @media (min-width: 415px) {
            .mobile-container {
                height: 850px;
                min-height: auto;
                border-radius: 30px;
                margin: 20px 0;
            }
        }
    </style>
</head>
<body>

    <div class="mobile-container">
        
        <!-- Header with Back Button (Navigates to specified URL) -->
        <header>
            <a href="https://exambridge.github.io/ExamHub/" class="back-btn" aria-label="Go Back">
                <i class="fas fa-arrow-left"></i>
            </a>
        </header>

        <!-- Centered Coming Soon Content -->
        <main class="content-area">
            <div class="coming-soon-icon">
                <i class="fas fa-hourglass-half"></i>
            </div>
            <h1 class="coming-soon-text">Coming soon...</h1>
            <p class="sub-text">We are working on this section.</p>
        </main>

    </div>

</body>
</html>
