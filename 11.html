    }
 
    if
(CONFIG.timerType === 'global') timeRemaining = CONFIG.timerValue * 60;
    if
(CONFIG.timerType === 'question') timeRemaining = CONFIG.timerValue;
 
    function
startTimer() {
        if
(CONFIG.timerType === 'none') return;
       clearInterval(timerInterval);
        timerInterval
= setInterval(() => {
           timeRemaining--; updateTimerDisplay();
            if
(timeRemaining <= 0) { clearInterval(timerInterval); handleTimeOut(); }
        }, 1000);
    }
    
    function
updateTimerDisplay() {
        const timerEl
= document.getElementById('clock'); if(!timerEl) return;
        const m =
Math.floor(timeRemaining / 60).toString().padStart(2, '0'), s = (timeRemaining
% 60).toString().padStart(2, '0');
       timerEl.innerText = `${m}:${s}`;
        if
(timeRemaining <= 10) timerEl.classList.add('warning'); else
timerEl.classList.remove('warning');
    }
    
    function
handleTimeOut() {
        if
(CONFIG.timerType === 'global') { currentIndex = quizData.length; render(); } 
        else if
(CONFIG.timerType === 'question' && !answered[currentIndex]) {
quizData[currentIndex].userSelected = "TIMED OUT";
answered[currentIndex] = true; render(); }
    }

{

(currentIndex >= quizData.length) { clearInterval(timerInterval);
renderResults(); return; }

quizData[currentIndex], isAnswered = answered[currentIndex];

        if (q.qText)
html += `<div class="question-text">${q.qText}</div>`;
        
        html +=
`<div class="options-grid">`;
       q.options.forEach((opt, index) => {
            let
cssClass = 'option';
            if
(isAnswered) {
               cssClass += ' disabled';
                if
(opt === q.correct) cssClass += ' correct';
                else
if (q.userSelected === opt) cssClass += ' wrong';
            }
            html +=
`<div class="${cssClass}"
onclick="selectAnswer(${index})">${opt}</div>`;
        });
        html +=
`</div>`;
 
        if (q.expImage
|| q.expText) {
            html +=
`<div class="explanation-box" style="display: ${isAnswered ?
'block' : 'none'}"><strong style="color: var(--primary);
text-transform: uppercase; font-size: 0.9rem; letter-spacing:
1px;">Explanation:</strong><br><br>`;
            if
(q.expImage) html += `<img src="${q.expImage}"
class="exp-img">`;
            if
(q.expText) html += `<div>${q.expText}</div>`;
            html +=
`</div>`;
        }
 
        html +=
`<div class="controls"><button onclick="prev()"
${currentIndex === 0 ? 'disabled' : ''}>Back</button><button
onclick="next()">${currentIndex === quizData.length - 1 ? 'Finish'
: 'Next'}</button></div></div>`;
        app.innerHTML
= html;
       if(CONFIG.timerType !== 'none' && !isAnswered)
updateTimerDisplay();
       triggerMathJax();
    }
 
    function
renderResults() {
        let html = `
        <div
class="results-screen">
            <div
class="bg-blob-results"></div>
            <div
class="results-content">
                <h2
class="results-title">Exam Completed</h2>
                <p
class="results-desc">Your final score assessment is securely
recorded.</p>
               <div class="student-badge-new">
                   <span class="badge-label">Candidate Name</span>
                   <strong class="badge-name">${studentName}</strong>
               </div>
               <div class="score-box">
                   <span class="score-value">${score}</span>
                   <span class="score-total">/
${quizData.length}</span>
               </div>
           </div>
            <div
class="bottom-bar-results">
               <button class="action-btn-results"
onclick="exitHome()">Exit to Home</button>
           </div>
        </div>`;
        app.innerHTML
= html;
    }
 
    function
exitHome() {
        let breakdown
= "";
       quizData.forEach((q, index) => {
            let status
= "";
            let qNum =
index + 1;
            if
(q.userSelected === "TIMED OUT") { status = "⏳
(Timed Out)"; } 
            else if
(q.userSelected === q.correct) { status = "✅"; } 
            else {
status = `❌ (Ans: ${q.userSelected || 'None'})`; }
            breakdown
+= `Q${qNum}: ${status}\n`;
        });
 
        const message
= `*CANDIDATE NAME* : ${studentName}\n*SCORE*:
${score}/${quizData.length}\n\n*Detailed Report:*\n${breakdown}`;
        const
phoneNumber = "919497333886"; 
        const
whatsappUrl =
`https://wa.me/${phoneNumber}?text=${encodeURIComponent(message)}`;
        
       window.location.href = whatsappUrl;
        setTimeout(()
=> { if(CONFIG.exitUrl) window.location.href = CONFIG.exitUrl; }, 2000);
    }
 
    function
selectAnswer(optIndex) {
        if
(answered[currentIndex]) return;
        const q =
quizData[currentIndex];
        q.userSelected
= q.options[optIndex]; answered[currentIndex] = true;
        if
(q.userSelected === q.correct) score++;
       if(CONFIG.timerType === 'question') clearInterval(timerInterval); 
        render(); 
    }
    
    function next() {
currentIndex++; if(CONFIG.timerType === 'question' && currentIndex <
quizData.length && !answered[currentIndex]) { timeRemaining =
CONFIG.timerValue; startTimer(); } render(); }
    function prev() {
if(currentIndex > 0) currentIndex--; if(CONFIG.timerType === 'question')
clearInterval(timerInterval); render(); }
    function
triggerMathJax() { if (window.MathJax)
MathJax.typesetPromise([document.getElementById('app')]).catch(e =>
console.log(e)); }
    
   if(CONFIG.timerType === 'global' || CONFIG.timerType === 'question')
startTimer();
    render();
</script>
</body>
</html>
