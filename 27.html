<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>portal.html</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            box-sizing: border-box;
        }
        .portal-container {
            width: 100vw;
            height: 100vh;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }
        .portal-blob {
            position: absolute;
            top: -40px;
            right: -40px;
            width: 250px;
            height: 250px;
            background: linear-gradient(135deg, #82d39026, #82d39040);
            border-radius: 50%;
            z-index: 1;
            pointer-events: none;
        }
        .portal-body-content {
            padding: 60px 80px;
            flex: 1;
            position: relative;
            z-index: 2;
            overflow-y: auto;
        }
        .portal-body-content img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 10px 0;
        }
        .portal-body-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 10px 0;
        }
        .portal-body-content th, .portal-body-content td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        .portal-body-content th {
            background-color: #f9f9f9;
        }
        .portal-footer {
            background: linear-gradient(to right, #82d390, #aafbb8);
            height: 80px;
            width: 100%;
            position: relative;
            z-index: 2;
        }
        @media (max-width: 768px) {
            .portal-body-content {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="portal-container">
        <div class="portal-blob"></div>
        <div class="portal-body-content">
            
                <p style="color:#ff7043; font-weight:600; margin-bottom:6px; font-size:14px;">Full Name</p>
                <div style="background:#f8f9fa; border:1px solid #e9ecef; padding:12px 16px; border-radius:8px; color:#adb5bd; margin-bottom:20px; font-size:14px;">Enter your registered name</div>
                
                <p style="color:#ff7043; font-weight:600; margin-bottom:6px; font-size:14px;">Exam Code (File Name)</p>

        </div>
        <div class="portal-footer"></div>
    </div>
</body>
</html>
