.question-text, .option-label, .explanation-box {
    word-wrap: break-word !important;
    overflow-wrap: break-word !important;
    white-space: normal !important;
    max-width: 100%;
}</style>
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exam Application</title>
<script>window.MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] } };</script>
<script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
    :root {
        --bg-color: #f0f2f5; --card-bg: #ffffff; --card-border: 1px solid #e1e4e8; --card-shadow: 0 10px 25px rgba(0,0,0,0.05);
        --text-main: #1f2937; --text-dim: #6b7280; --primary: #2563eb; --primary-glow: transparent;
        --correct: #10b981; --wrong: #ef4444; --btn-bg: #ffffff; --btn-border: 1px solid #d1d5da; --btn-shadow: 0 2px 4px rgba(0,0,0,0.02);
        --btn-hover-bg: #f8fafc; --backdrop-filter: none;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg-color); color: var(--text-main); margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow-y: auto; transition: background 0.3s ease; }
    #app { width: 100%; max-width: 750px; margin: auto; padding: 20px 0; }
    
    .card { background: var(--card-bg); border: var(--card-border); border-radius: 16px; padding: 35px; box-shadow: var(--card-shadow); backdrop-filter: var(--backdrop-filter); -webkit-backdrop-filter: var(--backdrop-filter); }
    .status-bar { display: flex; justify-content: space-between; font-size: 0.95rem; color: var(--text-dim); margin-bottom: 25px; border-bottom: var(--card-border); padding-bottom: 15px; font-weight: 600; }
    .timer { color: var(--primary); font-weight: 700; background: rgba(37, 99, 235, 0.1); padding: 4px 10px; border-radius: 8px; }
    .timer.warning { color: #fff; background: var(--wrong); animation: pulse 1s infinite; }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    
    .question-text { font-size: 1.25rem; margin-top: 0; margin-bottom: 20px; line-height: 1.6; font-weight: 600; color: var(--text-main); }
    .question-img { max-width: 100%; max-height: 400px; border-radius: 12px; margin-bottom: 25px; border: var(--card-border); display: block; margin-left: auto; margin-right: auto; }
    
    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    @media (max-width: 600px) { .options-grid { grid-template-columns: 1fr; } }
    
    .option { background: var(--btn-bg); border: var(--btn-border); box-shadow: var(--btn-shadow); color: var(--text-main); padding: 18px 20px; border-radius: 12px; cursor: pointer; transition: all 0.2s; font-size: 1.1rem; text-align: center; font-weight: 600; display: flex; align-items: center; justify-content: center; }
    .option:hover { border-color: var(--primary); background: var(--btn-hover-bg); transform: translateY(-2px); box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .option.correct { background: rgba(16, 185, 129, 0.1); color: var(--correct); border-color: var(--correct); pointer-events: none; transform: none; box-shadow: none; }
    .option.wrong { background: rgba(239, 68, 68, 0.1); color: var(--wrong); border-color: var(--wrong); pointer-events: none; transform: none; box-shadow: none; }
    .option.disabled { pointer-events: none; opacity: 0.6; }
    .option.correct.disabled { opacity: 1; }
    
    .explanation-box { margin-top: 25px; padding: 20px; background: var(--btn-bg); border: var(--card-border); border-left: 4px solid var(--primary); color: var(--text-main); border-radius: 8px; font-size: 1rem; line-height: 1.6; display: none; animation: slideDown 0.3s ease; box-shadow: var(--btn-shadow); }
    .exp-img { max-width: 100%; border-radius: 8px; margin-bottom: 15px; display: block; border: var(--card-border); }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

    .controls { display: flex; justify-content: space-between; gap: 15px; margin-top: 35px; }
    .controls button { flex: 1; background: var(--btn-bg); color: var(--text-dim); border: var(--card-border); padding: 16px; border-radius: 10px; cursor: pointer; text-transform: uppercase; font-weight: 700; transition: 0.2s; letter-spacing: 0.5px; }
    .controls button:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); background: var(--btn-hover-bg); }
    .controls button:disabled { opacity: 0.3; cursor: not-allowed; }
    
    .results { text-align: center; padding: 40px 20px; }
    .results h2 { color: var(--text-main); font-size: 2.2rem; margin-bottom: 5px; margin-top: 0; font-weight: 800; }
    .results p { color: var(--text-dim); font-size: 1.1rem; margin-bottom: 20px; }
    .student-badge { display: inline-block; background: rgba(37, 99, 235, 0.1); color: var(--primary); padding: 8px 16px; border-radius: 20px; font-weight: 700; margin-bottom: 15px; }
    .score-display { font-size: 5rem; color: var(--primary); display: block; margin: 10px 0 30px 0; font-weight: 800; }
    
    @media print {
        body * { visibility: hidden; }
        #printArea, #printArea * { visibility: visible; }
        #printArea { position: absolute; left: 0; top: 0; width: 100%; color: #000; background: #fff; font-family: sans-serif; padding: 20px; }
        .print-q { margin-bottom: 25px; border-bottom: 1px solid #ddd; padding-bottom: 15px; page-break-inside: avoid; }
        .print-img { max-height: 250px; display: block; margin: 10px 0; border: 1px solid #eee; }
        .print-ans { font-weight: bold; color: #10b981; margin: 10px 0; }
        .print-exp { background: #f9fafb; padding: 15px; border-left: 4px solid #2563eb; font-size: 0.95rem; }
    }
</style>
</head>
<body>
<div id="app"></div>
<div id="printArea" style="display:none;"></div>

<script>
    const CONFIG = {"theme":"flat","timerType":"none","timerValue":10,"shuffle":false,"fullPdfDownload":true,"exitUrl":"https://exambridge.github.io/ExamHub/"}; 
    const quizData = [{"id":1785262860514,"qNum":1,"qText":"5yh5yhy5hythrythythtyjhtyjhtyjtyjtyjtyrjhtyjhtyhjtryhjt","qImage":null,"options":["A","B","C","D"],"correct":"A","expText":"","expImage":null},{"id":1785262867274,"qNum":2,"qText":"rghnhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhh","qImage":null,"options":["A","B","C","D"],"correct":"A","expText":"","expImage":null},{"id":1785262876770,"qNum":3,"qText":"hhhhhhhhhhhhrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrjuiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiii","qImage":null,"options":["A","B","C","D"],"correct":"A","expText":"","expImage":null}];
    
    // Pull student name safely from Login Portal Memory
    const studentName = localStorage.getItem('exam_student_name') || 'Guest Student';

    // Theme Application
    const root = document.documentElement;
    if(CONFIG.theme === 'flat') { root.style.setProperty('--bg-color', '#f8fafc'); root.style.setProperty('--card-bg', '#ffffff'); root.style.setProperty('--primary', '#2563eb'); root.style.setProperty('--text-main', '#0f172a'); }
    else if(CONFIG.theme === 'ocean') { root.style.setProperty('--bg-color', '#0f172a'); root.style.setProperty('--card-bg', '#1e293b'); root.style.setProperty('--card-border', '1px solid #334155'); root.style.setProperty('--primary', '#38bdf8'); root.style.setProperty('--text-main', '#f8fafc'); root.style.setProperty('--btn-bg', '#1e293b'); root.style.setProperty('--btn-border', '1px solid #475569'); root.style.setProperty('--btn-hover-bg', '#334155'); }
    else if(CONFIG.theme === 'sunset') { root.style.setProperty('--bg-color', 'linear-gradient(135deg, #f43f5e, #fb923c)'); root.style.setProperty('--card-bg', '#ffffff'); root.style.setProperty('--primary', '#e11d48'); root.style.setProperty('--text-main', '#1c1917'); root.style.setProperty('--btn-border', '1px solid #fecdd3'); root.style.setProperty('--btn-hover-bg', '#fff1f2'); }
    else if(CONFIG.theme === 'nord') { root.style.setProperty('--bg-color', '#2e3440'); root.style.setProperty('--card-bg', '#3b4252'); root.style.setProperty('--card-border', '1px solid #4c566a'); root.style.setProperty('--primary', '#88c0d0'); root.style.setProperty('--text-main', '#eceff4'); root.style.setProperty('--text-dim', '#d8dee9'); root.style.setProperty('--btn-bg', '#434c5e'); root.style.setProperty('--btn-border', '1px solid #4c566a'); root.style.setProperty('--btn-hover-bg', '#4c566a'); }
    else if(CONFIG.theme === 'glassmorphism') { root.style.setProperty('--bg-color', 'linear-gradient(45deg, #4158D0, #C850C0, #FFCC70)'); root.style.setProperty('--card-bg', 'rgba(255, 255, 255, 0.9)'); root.style.setProperty('--backdrop-filter', 'blur(10px)'); root.style.setProperty('--primary', '#9333ea'); root.style.setProperty('--text-main', '#1e1b4b'); }
    else if(CONFIG.theme === 'neumorphism') { root.style.setProperty('--bg-color', '#e0e5ec'); root.style.setProperty('--card-bg', '#e0e5ec'); root.style.setProperty('--card-border', 'none'); root.style.setProperty('--card-shadow', '9px 9px 16px rgb(163,177,198,0.6), -9px -9px 16px rgba(255,255,255, 0.5)'); root.style.setProperty('--btn-bg', '#e0e5ec'); root.style.setProperty('--btn-border', 'none'); root.style.setProperty('--btn-shadow', '5px 5px 10px #b8c1cf, -5px -5px 10px #ffffff'); root.style.setProperty('--btn-hover-bg', '#e0e5ec'); root.style.setProperty('--primary', '#4f46e5'); root.style.setProperty('--text-main', '#334155'); }

    let currentIndex = 0, score = 0, answered = new Array(quizData.length).fill(false);
    const app = document.getElementById('app');
    let timerInterval, timeRemaining;
    
    if (CONFIG.shuffle) {
        quizData.sort(() => Math.random() - 0.5);
        quizData.forEach(q => q.options.sort(() => Math.random() - 0.5));
    }

    if (CONFIG.timerType === 'global') timeRemaining = CONFIG.timerValue * 60;
    if (CONFIG.timerType === 'question') timeRemaining = CONFIG.timerValue;

    function startTimer() {
        if (CONFIG.timerType === 'none') return;
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeRemaining--; updateTimerDisplay();
            if (timeRemaining <= 0) { clearInterval(timerInterval); handleTimeOut(); }
        }, 1000);
    }
    
    function updateTimerDisplay() {
        const timerEl = document.getElementById('clock'); if(!timerEl) return;
        const m = Math.floor(timeRemaining / 60).toString().padStart(2, '0'), s = (timeRemaining % 60).toString().padStart(2, '0');
        timerEl.innerText = `${m}:${s}`;
        if (timeRemaining <= 10) timerEl.classList.add('warning'); else timerEl.classList.remove('warning');
    }
    
    function handleTimeOut() {
        if (CONFIG.timerType === 'global') { currentIndex = quizData.length; render(); } 
        else if (CONFIG.timerType === 'question' && !answered[currentIndex]) { quizData[currentIndex].userSelected = "TIMED OUT"; answered[currentIndex] = true; render(); }
    }

    function render() {
        if (currentIndex >= quizData.length) { clearInterval(timerInterval); renderResults(); return; }
        const q = quizData[currentIndex], isAnswered = answered[currentIndex];
        
        if (CONFIG.timerType === 'question' && !isAnswered && timeRemaining <= 0) { timeRemaining = CONFIG.timerValue; startTimer(); } 
        else if (CONFIG.timerType === 'global' && !timerInterval && timeRemaining > 0) { startTimer(); }

        let html = `<div class="card"><div class="status-bar"><span>Question ${currentIndex + 1} of ${quizData.length}</span><span class="timer" id="clock">${CONFIG.timerType !== 'none' ? '--:--' : 'UNTIMED'}</span></div>`;
        
        if (q.qImage) html += `<img src="${q.qImage}" class="question-img">`;
        if (q.qText) html += `<div class="question-text">${q.qText}</div>`;
        
        html += `<div class="options-grid">`;
        q.options.forEach((opt, index) => {
            let cssClass = 'option';
            if (isAnswered) {
                cssClass += ' disabled';
                if (opt === q.correct) cssClass += ' correct';
                else if (q.userSelected === opt) cssClass += ' wrong';
            }
            html += `<div class="${cssClass}" onclick="selectAnswer(${index})">${opt}</div>`;
        });
        html += `</div>`;

        if (q.expImage || q.expText) {
            html += `<div class="explanation-box" style="display: ${isAnswered ? 'block' : 'none'}">
                <strong style="color: var(--primary); text-transform: uppercase; font-size: 0.9rem; letter-spacing: 1px;">Explanation:</strong><br><br>`;
            if (q.expImage) html += `<img src="${q.expImage}" class="exp-img">`;
            if (q.expText) html += `<div>${q.expText}</div>`;
            html += `</div>`;
        }

        html += `<div class="controls"><button onclick="prev()" ${currentIndex === 0 ? 'disabled' : ''}>Back</button><button onclick="next()">${currentIndex === quizData.length - 1 ? 'Finish' : 'Next'}</button></div></div>`;
        
        app.innerHTML = html;
        if(CONFIG.timerType !== 'none' && !isAnswered) updateTimerDisplay();
        triggerMathJax();
    }

    function renderResults() {
        const btnText = CONFIG.fullPdfDownload ? 'Download Exam Review PDF' : 'Download Scorecard Image';
        
        let html = `<div class="card results" id="resultCardNode">
            <h2>EXAM COMPLETED</h2>
            <div class="student-badge">Candidate: ${studentName}</div>
            <p>Your final score assessment is below.</p>
            <span class="score-display">${score} <span style="font-size:2.5rem; color:var(--text-dim);">/ ${quizData.length}</span></span>
            
            <div class="controls" style="margin-top:40px;" data-html2canvas-ignore="true">
                <button onclick="handleDownload()" style="border-color:var(--primary); color:var(--primary);">${btnText}</button>
                <button onclick="exitHome()" style="background:var(--primary); color:#fff; border:none;">Exit to Home</button>
            </div>
        </div>`;
        app.innerHTML = html;
    }

    function exitHome() {
        if(CONFIG.exitUrl) window.location.href = CONFIG.exitUrl;
        else alert("No exit URL was configured for this exam.");
    }

    // New Router Function for Download
    function handleDownload() {
        if (CONFIG.fullPdfDownload) {
            downloadPDF();
        } else {
            downloadImage();
        }
    }

    // Option A: Download Full PDF Review (Using native window.print)
    function downloadPDF() {
        const printArea = document.getElementById('printArea');
        let html = `<div style="max-width:800px; margin:0 auto;">
            <h1 style="text-align:center; border-bottom:2px solid #000; padding-bottom:10px;">Official Exam Review</h1>
            <p style="text-align:center; font-size:1.1rem; color:#555;">Candidate: <strong>${studentName}</strong></p>
            <p style="text-align:center; font-size:1.2rem; margin-bottom:40px;">Final Score: <strong>${score} / ${quizData.length}</strong></p>`;
        
        quizData.forEach((q, i) => {
            html += `<div class="print-q"><h3>Question ${i+1}</h3>`;
            if (q.qImage) html += `<img src="${q.qImage}" class="print-img">`;
            if (q.qText) html += `<p>${q.qText}</p>`;
            
            html += `<div style="margin:15px 0;">`;
            q.options.forEach(opt => {
                let marker = (opt === q.correct) ? "✓" : "○";
                let style = (opt === q.correct) ? "font-weight:bold; color:#10b981;" : "color:#555;";
                html += `<div style="${style} margin-bottom:5px;">${marker} ${opt}</div>`;
            });
            html += `</div>`;

            if (q.expImage || q.expText) {
                html += `<div class="print-exp"><strong>Explanation:</strong><br>`;
                if (q.expImage) html += `<img src="${q.expImage}" class="print-img">`;
                if (q.expText) html += `<p style="margin-top:5px;">${q.expText}</p>`;
                html += `</div>`;
            }
            html += `</div>`;
        });
        
        html += `</div>`;
        printArea.innerHTML = html;
        printArea.style.display = 'block';

        if (window.MathJax) {
            MathJax.typesetPromise([printArea]).then(() => {
                window.print();
                printArea.style.display = 'none';
            });
        } else {
            window.print();
            printArea.style.display = 'none';
        }
    }

    // Option B: Download Screenshot of the Result Card only
    function downloadImage() {
        const resultCard = document.getElementById('resultCardNode');
        
        // Use html2canvas to capture the DOM element as an image
        html2canvas(resultCard, { 
            scale: 2, // High resolution
            backgroundColor: '#ffffff'
        }).then(canvas => {
            const safeName = studentName.replace(/[^a-z0-9]/gi, '_').toLowerCase();
            const link = document.createElement('a');
            link.download = `${safeName}_scorecard.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    }

    function selectAnswer(optIndex) {
        if (answered[currentIndex]) return;
        const q = quizData[currentIndex];
        q.userSelected = q.options[optIndex]; answered[currentIndex] = true;
        if (q.userSelected === q.correct) score++;
        if(CONFIG.timerType === 'question') clearInterval(timerInterval); 
        render(); 
    }
    
    function next() { currentIndex++; if(CONFIG.timerType === 'question' && currentIndex < quizData.length && !answered[currentIndex]) { timeRemaining = CONFIG.timerValue; startTimer(); } render(); }
    function prev() { if(currentIndex > 0) currentIndex--; if(CONFIG.timerType === 'question') clearInterval(timerInterval); render(); }
    function triggerMathJax() { if (window.MathJax) MathJax.typesetPromise([document.getElementById('app')]).catch(e => console.log(e)); }
    
    if(CONFIG.timerType === 'global' || CONFIG.timerType === 'question') startTimer();
    render();
</script>
</body>
</html>
