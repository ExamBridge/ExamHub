              ` : `
                <div class="overflow-x-auto scroll-touch">
                  <table class="w-full text-left border-collapse min-w-[720px]">
                    <thead>
                      <tr class="bg-slate-50 border-b border-slate-200 text-[11px] font-extrabold uppercase tracking-wider text-slate-500">
                        <th class="px-4 py-3.5">Student</th>
                        <th class="px-4 py-3.5">Class</th>
                        <th class="px-4 py-3.5">Exam</th>
                        <th class="px-4 py-3.5">Score (+4/-1)</th>
                        <th class="px-4 py-3.5">C / W / U</th>
                        <th class="px-4 py-3.5">Accuracy</th>
                        <th class="px-4 py-3.5">Date</th>
                        <th class="px-4 py-3.5 text-right">Action</th>
                      </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100 text-xs sm:text-sm">
                      ${filtered.map(r => {
                        const scoreVal = r.score !== undefined ? r.score : (r.totalScore || 0);
                        const cVal = r.correct !== undefined ? r.correct : (r.correctCount || 0);
                        const wVal = r.wrong !== undefined ? r.wrong : (r.wrongCount || 0);
                        const uVal = r.unattempted !== undefined ? r.unattempted : (r.unansweredCount || 0);
                        return `
                          <tr class="hover:bg-slate-50/70">
                            <td class="px-4 py-3.5 font-bold text-slate-900">${escapeHtml(r.studentName)}</td>
                            <td class="px-4 py-3.5"><span class="px-2 py-0.5 rounded-md text-xs font-bold bg-indigo-50 text-indigo-700">${escapeHtml(r.className)}</span></td>
                            <td class="px-4 py-3.5 text-slate-700 font-medium">${escapeHtml(r.examTitle)}</td>
                            <td class="px-4 py-3.5 font-extrabold font-mono-num text-slate-900">${scoreVal} / ${r.maxMarks}</td>
                            <td class="px-4 py-3.5 font-mono-num text-xs">
                              <span class="text-emerald-700 font-bold">${cVal}</span> /
                              <span class="text-rose-600 font-bold">${wVal}</span> /
                              <span class="text-slate-500">${uVal}</span>
                            </td>
                            <td class="px-4 py-3.5 font-mono-num font-bold text-indigo-700">${r.accuracy || 0}%</td>
                            <td class="px-4 py-3.5 text-xs text-slate-500">${formatDate(r.submittedAt)}</td>
                            <td class="px-4 py-3.5 text-right">
                              <button onclick="window.app.confirmDeleteResult('${r.id}')" class="text-xs font-bold text-rose-600 hover:underline">Remove</button>
                            </td>
                          </tr>
                        `;
                      }).join("")}
                    </tbody>
                  </table>
                </div>
              `}
            </div>
          </section>
        `;
      }

      // =========================================================================
      // 15. EXPOSED PUBLIC HANDLERS
      // =========================================================================
      window.app = {
        closeModal,
        openMasterLogin: openMasterLoginModal,

        syncCloudNow() {
          fetchFromCloud(true);
        },

        handleStudentLogin(e) {
          e.preventDefault();
          const nameInput = document.getElementById("login-student-name").value.trim();
          const classSelect = document.getElementById("login-student-class").value;
          if (!nameInput || !classSelect) {
            showToast("Please enter your name and select a class.", "warning");
            return;
          }
          state.studentSession = {
            name: nameInput,
            className: classSelect,
            loggedInAt: Date.now()
          };
          writeLocalJson(SESSION_STORAGE_KEY, state.studentSession);
          state.studentTab = "chapters";
          state.studentSubjectFilter = "All";
          state.studentSearch = "";
          state.view = "student-home";
          ensureHomeGuard();
          renderApp(true);
          showToast("Welcome, " + nameInput + "!", "success");
        },

        handleStudentLogout() {
          showConfirmModal({
            title: "Logout / Switch Student?",
            message: "You will be returned to the Login screen where you can sign in with a different name or class.",
            confirmText: "Logout",
            confirmStyle: "danger",
            onConfirm: () => {
              clearExamTimer();
              state.examSession = null;
              state.studentSession = null;
              writeLocalJson(SESSION_STORAGE_KEY, null);
              state.view = "login";
              renderApp(true);
            }
          });
        },

        exitMasterMode() {
          state.view = state.studentSession ? "student-home" : "login";
          if (state.view === "student-home") ensureHomeGuard();
          renderApp(true);
        },

        setStudentTab(tab) {
          state.studentTab = tab;
          renderApp(false);
        },

        setStudentSubjectFilter(sub) {
          state.studentSubjectFilter = sub;
          renderApp(false);
        },

        setStudentSearch(val) {
          state.studentSearch = val;
          renderApp(false);
          const el = document.getElementById("student-ch-search");
          if (el) {
            el.focus();
            el.setSelectionRange(val.length, val.length);
          }
        },

        openChapterReader(chapterId) {
          state.activeChapterId = chapterId;
          state.view = "chapter-reader";
          pushNavState("chapter-reader");
          renderApp(true);
        },

        backToStudentHome() {
          state.activeChapterId = null;
          state.lastResultView = null;
          state.view = state.studentSession ? "student-home" : "login";
          if (state.view === "student-home") ensureHomeGuard();
          renderApp(true);
        },

        toggleChapterComplete(chapterId) {
          if (state.completedChapterIds.has(chapterId)) {
            state.completedChapterIds.delete(chapterId);
          } else {
            state.completedChapterIds.add(chapterId);
          }
          writeLocalJson(COMPLETED_STORAGE_KEY, Array.from(state.completedChapterIds));
          renderApp(false);
        },

        startOrResumeExam,
        pauseAndReturnHome,

        selectExamOption(qIdx, optIdx) {
          if (!state.examSession || state.examSession.submittedResult) return;
          state.examSession.answers[qIdx] = optIdx;
          saveCurrentExamProgressNow();
          renderApp(false);
        },

        clearExamOption(qIdx) {
          if (!state.examSession || state.examSession.submittedResult) return;
          delete state.examSession.answers[qIdx];
          saveCurrentExamProgressNow();
          renderApp(false);
        },

        toggleFlagQuestion(qIdx) {
          if (!state.examSession || state.examSession.submittedResult) return;
          if (state.examSession.flagged.has(qIdx)) state.examSession.flagged.delete(qIdx);
          else state.examSession.flagged.add(qIdx);
          saveCurrentExamProgressNow();
          renderApp(false);
        },

        jumpToExamQuestion(idx) {
          if (!state.examSession) return;
          const max = state.examSession.exam.questions.length - 1;
          state.examSession.currentIndex = Math.max(0, Math.min(max, idx));
          state.mobilePaletteOpen = false;
          saveCurrentExamProgressNow();
          renderApp(true);
        },

        toggleMobilePalette(open) {
          state.mobilePaletteOpen = Boolean(open);
          renderApp(false);
        },

        promptSubmitExam() {
          const sess = state.examSession;
          if (!sess) return;
          const total = sess.exam.questions.length;
          const ans = Object.keys(sess.answers).length;
          showConfirmModal({
            title: "Submit Timed Exam?",
            message: "You have answered " + ans + " of " + total + " questions (" + (total - ans) + " unanswered). Marking: +4 Correct, -1 Wrong, 0 Unattempted.",
            confirmText: "Submit Exam",
            confirmStyle: "primary",
            onConfirm: () => finalizeExamSubmission()
          });
        },

        setMasterTab(tab) {
          state.masterTab = tab;
          renderApp(false);
        },

        async handleAddClass(e) {
          e.preventDefault();
          const name = document.getElementById("new-class-name").value.trim();
          const mcqEnabled = document.getElementById("new-class-mcq").checked;
          if (!name) return;
          if (state.classes.some(c => c.name.toLowerCase() === name.toLowerCase())) {
            showToast("A class with that name already exists.", "warning");
            return;
          }
          state.classes.push({
            id: "cls-" + Date.now(),
            name: name,
            mcqEnabled: mcqEnabled,
            createdAt: Date.now()
          });
          renderApp(false);
          await pushAllToCloud(false);
        },

        async toggleClassMcq(classId, newVal) {
          const c = state.classes.find(x => x.id === classId);
          if (c) c.mcqEnabled = Boolean(newVal);
          renderApp(false);
          await pushAllToCloud(false);
        },

        confirmDeleteClass(classId, className) {
          showConfirmModal({
            title: "Delete " + className + "?",
            message: "Students will no longer see this class in the login dropdown.",
            confirmText: "Delete Class",
            confirmStyle: "danger",
            onConfirm: async () => {
              state.classes = state.classes.filter(c => c.id !== classId);
              renderApp(false);
              await pushAllToCloud(false);
            }
          });
        },

        setMasterChapterClassFilter(val) {
          state.masterChapterClassFilter = val;
          renderApp(false);
        },

        openChapterFormModal,

        confirmDeleteChapter(chapterId) {
          showConfirmModal({
            title: "Delete Chapter?",
            message: "This chapter will be permanently removed from Google Drive Cloud.",
            confirmText: "Delete",
            confirmStyle: "danger",
            onConfirm: async () => {
              state.chapters = state.chapters.filter(c => c.id !== chapterId);
              renderApp(false);
              await pushAllToCloud(false);
            }
          });
        },

        setMasterExamClassFilter(val) {
          state.masterExamClassFilter = val;
          renderApp(false);
        },

        openExamFormModal,
        openQuestionManagerModal,

        confirmDeleteExam(examId) {
          showConfirmModal({
            title: "Delete MCQ Exam?",
            message: "This exam and all its questions will be permanently removed from Google Drive Cloud.",
            confirmText: "Delete Exam",
            confirmStyle: "danger",
            onConfirm: async () => {
              state.exams = state.exams.filter(e => e.id !== examId);
              renderApp(false);
              await pushAllToCloud(false);
            }
          });
        },

        async deleteQuestionFromExam(examId, qIdx) {
          const exam = state.exams.find(e => e.id === examId);
          if (!exam) return;
          exam.questions = exam.questions.filter((_, i) => i !== qIdx);
          await pushAllToCloud(false);
          openQuestionManagerModal(examId);
        },

        setMasterResultClassFilter(val) {
          state.masterResultClassFilter = val;
          renderApp(false);
        },

        setMasterResultExamFilter(val) {
          state.masterResultExamFilter = val;
          renderApp(false);
        },

        confirmDeleteResult(resultId) {
          showConfirmModal({
            title: "Remove Result?",
            message: "Delete this student's exam attempt from the dashboard?",
            confirmText: "Remove",
            confirmStyle: "danger",
            onConfirm: async () => {
              state.results = state.results.filter(r => r.id !== resultId);
              renderApp(false);
              await pushAllToCloud(false);
            }
          });
        },

        exportResultsCsv() {
          const filtered = state.results.filter(r => {
            const clsOk = state.masterResultClassFilter === "All" || r.className === state.masterResultClassFilter;
            const exOk = state.masterResultExamFilter === "All" || r.examTitle === state.masterResultExamFilter;
            return clsOk && exOk;
          });
          if (filtered.length === 0) {
            showToast("No results to export.", "warning");
            return;
          }
          const headers = ["Student Name", "Class", "Exam Title", "Subject", "Score", "Max Marks", "Correct (+4)", "Wrong (-1)", "Unanswered (0)", "Accuracy (%)", "Date"];
          const rows = filtered.map(r => [
            '"' + (r.studentName || "").replace(/"/g, '""') + '"',
            '"' + (r.className || "").replace(/"/g, '""') + '"',
            '"' + (r.examTitle || "").replace(/"/g, '""') + '"',
            '"' + (r.subject || "").replace(/"/g, '""') + '"',
            r.score !== undefined ? r.score : (r.totalScore || 0),
            r.maxMarks || 0,
            r.correct !== undefined ? r.correct : (r.correctCount || 0),
            r.wrong !== undefined ? r.wrong : (r.wrongCount || 0),
            r.unattempted !== undefined ? r.unattempted : (r.unansweredCount || 0),
            r.accuracy || 0,
            '"' + formatDate(r.submittedAt) + '"'
          ]);
          const csv = [headers.join(","), ...rows.map(r => r.join(","))].join("\n");
          downloadTextFile("EduMaster_Results_" + new Date().toISOString().slice(0, 10) + ".csv", csv, "text/csv;charset=utf-8");
          showToast("Results exported to CSV!", "success");
        }
      };

      // =========================================================================
      // 16. BOOT APPLICATION
      // =========================================================================
      if (state.view === "student-home") {
        ensureHomeGuard();
      } else {
        pushNavState(state.view);
      }
      renderApp(true);
      fetchFromCloud(false);
    })();
  </script>
</body>
</html>
