<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#4f46e5" />
  <title>EduMaster — Academic &amp; Timed MCQ Exam Portal</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
        },
      },
    };
  </script>

  <style>
    /* Critical Android WebView & Mobile Touch Scrolling Rules */
    html, body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
      -webkit-tap-highlight-color: transparent;
      height: auto;
      min-height: 100%;
    }
    .font-mono-num {
      font-family: 'JetBrains Mono', monospace;
      font-variant-numeric: tabular-nums;
    }
    .scroll-touch {
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
    }
    /* Opacity-only fade so parent containers never get a transform that breaks sticky/scroll */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .animate-fade-in {
      animation: fadeIn 0.2s ease-out forwards;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .animate-slide-up {
      animation: slideUp 0.24s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes pulseDanger {
      0%, 100% { box-shadow: 0 0 0 0 rgba(225, 29, 72, 0.45); }
      50% { box-shadow: 0 0 0 7px rgba(225, 29, 72, 0); }
    }
    .timer-critical {
      animation: pulseDanger 1.1s infinite;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-[100dvh] flex flex-col">

  <!-- ==================== APP SHELL ROOT ==================== -->
  <div id="app-root" class="flex-1 flex flex-col min-h-[100dvh]">
    <div id="loading-screen" class="flex-1 flex flex-col items-center justify-center px-6 py-24 text-center">
      <div class="w-14 h-14 rounded-2xl bg-indigo-600 text-white flex items-center justify-center shadow-lg shadow-indigo-200 mb-5">
        <svg class="w-7 h-7 animate-spin" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
        </svg>
      </div>
      <h1 class="text-xl font-extrabold text-slate-900 tracking-tight">EduMaster Portal</h1>
      <p class="text-sm text-slate-500 mt-1.5">Connecting to Google Drive Cloud...</p>
    </div>
  </div>

  <!-- ==================== TOAST CONTAINER ==================== -->
  <div id="toast-container" class="fixed bottom-4 left-4 right-4 sm:left-auto sm:right-5 sm:bottom-5 z-[70] flex flex-col gap-2 sm:max-w-sm pointer-events-none"></div>

  <!-- ==================== MODAL & DRAWER ROOT ==================== -->
  <div id="modal-root"></div>

  <!-- ==================== APPLICATION SCRIPT ==================== -->
  <script>
    (function () {
      "use strict";

      // =========================================================================
      // 1. CLOUD DATABASE & MASTER PIN CONFIGURATION
      // =========================================================================
      const CLOUD_API_URL = "https://script.google.com/macros/s/AKfycbxToVwIQd2XfDVLdeJ9yhukMdPGLvW85nn4HKa0P7S39QRNRv-59ZVoaBjVYgP-ijw6/exec";
      const MASTER_PIN = "1243";

      const MARKS_CORRECT = 4;
      const MARKS_WRONG = -1;

      const CLOUD_CACHE_KEY = "edumaster_cloud_cache_v3";
      const SESSION_STORAGE_KEY = "edumaster_student_session_v2";
      const PROGRESS_STORAGE_KEY = "edumaster_paused_exam_v2";
      const COMPLETED_STORAGE_KEY = "edumaster_completed_chapters_v2";

      const SUBJECTS = [
        "Physics",
        "Chemistry",
        "Mathematics",
        "Biology",
        "Science",
        "English",
        "Computer Science"
      ];

      const DEFAULT_CLASSES = [
        { id: "cls-10", name: "Class 10", mcqEnabled: false, createdAt: 1700000000100 },
        { id: "cls-11", name: "Class 11", mcqEnabled: true,  createdAt: 1700000000200 },
        { id: "cls-12", name: "Class 12", mcqEnabled: true,  createdAt: 1700000000300 }
      ];

      // =========================================================================
      // 2. SYNCHRONOUS LOCAL STORAGE & SCROLL RESET HELPERS
      // =========================================================================
      function readLocalJson(key, fallback) {
        try {
          const raw = window.localStorage.getItem(key);
          if (!raw) return fallback;
          return JSON.parse(raw);
        } catch (e) {
          return fallback;
        }
      }

      function writeLocalJson(key, val) {
        try {
          if (val === null || val === undefined) {
            window.localStorage.removeItem(key);
          } else {
            window.localStorage.setItem(key, JSON.stringify(val));
          }
        } catch (e) {
          // Ignore storage quota / private mode errors
        }
      }

      /**
       * Always restores natural document vertical scrolling on html & body.
       * Prevents Android WebView from getting stuck in a non-scrollable state
       * after closing a modal/drawer or switching between views.
       */
      function resetDocumentScroll(scrollToTop) {
        document.documentElement.style.overflow = "";
        document.documentElement.style.overflowY = "auto";
        document.documentElement.style.height = "";
        document.body.style.overflow = "";
        document.body.style.overflowY = "auto";
        document.body.style.position = "";
        document.body.style.height = "";
        if (scrollToTop) {
          try {
            window.scrollTo(0, 0);
            document.documentElement.scrollTop = 0;
            document.body.scrollTop = 0;
          } catch (e) {
            // Ignore
          }
        }
      }

      function normalizeClasses(rawList) {
        if (!Array.isArray(rawList)) return [];
        return rawList.map((c, idx) => ({
          id: c.id || "cls-" + idx,
          name: c.name || "Class",
          mcqEnabled: typeof c.mcqEnabled === "boolean" ? c.mcqEnabled : Boolean(c.allowMcq),
          createdAt: c.createdAt || Date.now()
        }));
      }

      // Migrate any legacy paused exam progress if present
      const legacyProgress = readLocalJson("edumaster_exam_progress_v2", null);
      const restoredProgress = readLocalJson(PROGRESS_STORAGE_KEY, legacyProgress || {});
      const restoredSession = readLocalJson(SESSION_STORAGE_KEY, null);
      const restoredCompleted = readLocalJson(COMPLETED_STORAGE_KEY, []);
      const cachedCloud = readLocalJson(CLOUD_CACHE_KEY, null);

      // =========================================================================
      // 3. APPLICATION STATE
      // =========================================================================
      const state = {
        view: restoredSession && restoredSession.name && restoredSession.className ? "student-home" : "login",
        isMasterAuth: false,
        studentSession: restoredSession && restoredSession.name && restoredSession.className ? restoredSession : null,

        cloudStatus: "syncing", // 'syncing' | 'synced' | 'offline'
        isSavingCloud: false,
        initialized: Boolean(cachedCloud && cachedCloud.initialized),

        studentTab: "chapters",
        studentSubjectFilter: "All",
        studentSearch: "",
        activeChapterId: null,

        masterTab: "classes",
        masterChapterClassFilter: "All",
        masterExamClassFilter: "All",
        masterResultClassFilter: "All",
        masterResultExamFilter: "All",

        classes: cachedCloud && Array.isArray(cachedCloud.classes) && cachedCloud.classes.length > 0
          ? normalizeClasses(cachedCloud.classes)
          : DEFAULT_CLASSES.slice(),
        chapters: cachedCloud && Array.isArray(cachedCloud.chapters) ? cachedCloud.chapters : [],
        exams: cachedCloud && Array.isArray(cachedCloud.exams) ? cachedCloud.exams : [],
        results: cachedCloud && Array.isArray(cachedCloud.results) ? cachedCloud.results : [],

        completedChapterIds: new Set(Array.isArray(restoredCompleted) ? restoredCompleted : []),
        savedProgressMap: restoredProgress && typeof restoredProgress === "object" ? restoredProgress : {},

        examSession: null,
        timerInterval: null,
        mobilePaletteOpen: false,
        lastResultView: null
      };

      // Active iframe resize observer/timer registry so we clean up cleanly on re-render
      const iframeCleanupFns = [];
      function cleanupIframeWatchers() {
        while (iframeCleanupFns.length > 0) {
          const fn = iframeCleanupFns.pop();
          try { fn(); } catch (e) {}
        }
      }

      // =========================================================================
      // 4. GOOGLE APPS SCRIPT CLOUD SYNC (doGet & doPost)
      // =========================================================================
      function saveCloudCacheLocally() {
        writeLocalJson(CLOUD_CACHE_KEY, {
          initialized: state.initialized,
          classes: state.classes,
          chapters: state.chapters,
          exams: state.exams,
          results: state.results,
          cachedAt: Date.now()
        });
      }

      async function fetchFromCloud(manualTrigger) {
        state.cloudStatus = "syncing";
        updateCloudBadgeDOM();

        try {
          const resp = await fetch(CLOUD_API_URL + "?t=" + Date.now(), {
            method: "GET",
            redirect: "follow"
          });
          if (!resp.ok) throw new Error("HTTP " + resp.status);
          const data = await resp.json();

          const cloudClasses = normalizeClasses(data && data.classes ? data.classes : []);
          const cloudChapters = Array.isArray(data && data.chapters) ? data.chapters : [];
          const cloudExams = Array.isArray(data && data.exams) ? data.exams : [];
          const cloudResults = Array.isArray(data && data.results) ? data.results : [];
          const isCloudInit = Boolean(data && data.initialized);

          // Only seed default classes if cloud DB is completely uninitialized
          if (cloudClasses.length === 0 && !isCloudInit && cloudChapters.length === 0 && cloudExams.length === 0) {
            state.classes = DEFAULT_CLASSES.slice();
            state.chapters = [];
            state.exams = [];
            state.results = cloudResults;
            state.initialized = true;
            saveCloudCacheLocally();
            pushAllToCloud(true);
          } else {
            state.classes = cloudClasses;
            state.chapters = cloudChapters;
            state.exams = cloudExams;
            state.results = cloudResults;
            state.initialized = true;
            saveCloudCacheLocally();
          }

          state.cloudStatus = "synced";
          if (manualTrigger) {
            showToast("Synced latest data from Google Drive Cloud!", "success");
          }
        } catch (err) {
          console.warn("Cloud sync failed, using offline cache:", err);
          state.cloudStatus = "offline";
          if (manualTrigger) {
            showToast("Could not reach cloud. Showing offline cache.", "warning");
          }
        }

        const modalOpen = document.getElementById("modal-root") && document.getElementById("modal-root").innerHTML.trim() !== "";
        if (!modalOpen && state.view !== "exam-runner" && state.view !== "chapter-reader" && state.view !== "exam-result") {
          renderApp();
        } else {
          updateCloudBadgeDOM();
        }
      }

      async function pushAllToCloud(silent) {
        state.initialized = true;
        saveCloudCacheLocally();
        state.isSavingCloud = true;
        state.cloudStatus = "syncing";
        updateCloudBadgeDOM();

        try {
          const resp = await fetch(CLOUD_API_URL, {
            method: "POST",
            redirect: "follow",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({
              action: "saveAll",
              data: {
                initialized: true,
                classes: state.classes,
                chapters: state.chapters,
                exams: state.exams,
                results: state.results
              }
            })
          });
          if (!resp.ok) throw new Error("HTTP " + resp.status);
          state.cloudStatus = "synced";
          if (!silent) {
            showToast("Saved to Google Drive Cloud!", "success");
          }
        } catch (err) {
          console.error("Cloud save failed:", err);
          state.cloudStatus = "offline";
          if (!silent) {
            showToast("Saved locally, but cloud sync failed. Check internet.", "warning");
          }
        } finally {
          state.isSavingCloud = false;
          updateCloudBadgeDOM();
        }
      }

      async function postStudentResultToCloud(resultRecord) {
        state.results.unshift(resultRecord);
        saveCloudCacheLocally();
        state.cloudStatus = "syncing";
        updateCloudBadgeDOM();

        try {
          const resp = await fetch(CLOUD_API_URL, {
            method: "POST",
            redirect: "follow",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({
              action: "addResult",
              result: resultRecord
            })
          });
          if (!resp.ok) throw new Error("HTTP " + resp.status);
          state.cloudStatus = "synced";
          showToast("Exam submitted & saved to Google Sheet!", "success");
        } catch (err) {
          console.error("Result cloud post failed:", err);
          state.cloudStatus = "offline";
          showToast("Exam graded, but cloud upload failed.", "warning");
        } finally {
          updateCloudBadgeDOM();
        }
      }

      function renderCloudStatusBadge(darkBg) {
        const s = state.cloudStatus;
        if (s === "syncing") {
          return `<span data-cloud-badge="1" class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-bold ${darkBg ? "bg-amber-500/20 text-amber-300" : "bg-amber-50 text-amber-700 border border-amber-200"}">
            <span class="w-1.5 h-1.5 rounded-full bg-amber-500 animate-ping"></span>Syncing...
          </span>`;
        }
        if (s === "synced") {
          return `<span data-cloud-badge="1" class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-bold ${darkBg ? "bg-emerald-500/20 text-emerald-300" : "bg-emerald-50 text-emerald-700 border border-emerald-200"}">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>Cloud Synced
          </span>`;
        }
        return `<span data-cloud-badge="1" class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-bold ${darkBg ? "bg-slate-700 text-slate-300" : "bg-slate-100 text-slate-600 border border-slate-200"}">
          <span class="w-1.5 h-1.5 rounded-full bg-slate-400"></span>Offline Cache
        </span>`;
      }

      function updateCloudBadgeDOM() {
        const badges = document.querySelectorAll("[data-cloud-badge]");
        const isMaster = state.view === "master";
        badges.forEach((el) => {
          const wrapper = document.createElement("div");
          wrapper.innerHTML = renderCloudStatusBadge(isMaster);
          if (wrapper.firstElementChild) {
            el.replaceWith(wrapper.firstElementChild);
          }
        });
      }

      // =========================================================================
      // 5. HTML IFRAME SAFE WRAPPER & AUTO-HEIGHT RESIZER (TOUCH-SCROLL FIX)
      // =========================================================================
      /**
       * Injects responsive wrap/scroll CSS into uploaded HTML notes or papers so
       * wide formulas/tables never break layout, and ensures the iframe expands
       * to its full document height so the parent page scrolls smoothly on Android.
       */
      function prepareResponsiveSrcdoc(rawHtml) {
        const safeCss = `
          <style data-edumaster-inject="1">
            html, body {
              margin: 0 !important;
              padding: 14px !important;
              height: auto !important;
              min-height: 0 !important;
              overflow-y: visible !important;
              overflow-x: auto !important;
              word-wrap: break-word !important;
              overflow-wrap: anywhere !important;
              box-sizing: border-box !important;
              -webkit-text-size-adjust: 100%;
            }
            img, svg, video, canvas, iframe { max-width: 100% !important; height: auto !important; }
            pre, code, table { max-width: 100% !important; overflow-x: auto !important; }
          </style>
        `;
        const str = String(rawHtml || "");
        if (/<\/head>/i.test(str)) {
          return str.replace(/<\/head>/i, safeCss + "</head>");
        }
        if (/<body[^>]*>/i.test(str)) {
          return str.replace(/<body[^>]*>/i, (m) => safeCss + m);
        }
        return "<!DOCTYPE html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'>" + safeCss + "</head><body>" + str + "</body></html>";
      }

      /**
       * Attaches automatic full-height resizing to a sandboxed iframe:
       * - Immediately on load
       * - Whenever images inside finish loading
       * - Via ResizeObserver on iframe body/documentElement
       * - Via a short stabilization interval (first 4 seconds) for web fonts / math / scripts
       */
      function attachAutoResizeIframe(iframeId, minHeightPx) {
        const iframe = document.getElementById(iframeId);
        if (!iframe) return;
        const minH = minHeightPx || 420;

        const resizeNow = () => {
          try {
            const doc = iframe.contentDocument || (iframe.contentWindow && iframe.contentWindow.document);
            if (!doc || !doc.body) return;
            const bodyH = doc.body.scrollHeight || 0;
            const docElH = doc.documentElement ? doc.documentElement.scrollHeight : 0;
            const targetH = Math.max(minH, bodyH, docElH) + 32;
            if (Math.abs((parseInt(iframe.style.height, 10) || 0) - targetH) > 4) {
              iframe.style.height = targetH + "px";
            }
          } catch (e) {
            // Fallback height if sandboxed cross-origin
            iframe.style.height = Math.max(minH, 700) + "px";
          }
        };

        let ro = null;
        let pollTimer = null;

        const onLoadHandler = () => {
          resizeNow();
          try {
            const doc = iframe.contentDocument || (iframe.contentWindow && iframe.contentWindow.document);
            if (doc && doc.body) {
              // Listen for all image loads inside the HTML note/paper
              const imgs = doc.querySelectorAll("img");
              imgs.forEach((img) => {
                if (!img.complete) {
                  img.addEventListener("load", resizeNow, { once: true });
                  img.addEventListener("error", resizeNow, { once: true });
                }
              });

              if (typeof ResizeObserver !== "undefined") {
                if (ro) ro.disconnect();
                ro = new ResizeObserver(() => resizeNow());
                ro.observe(doc.body);
                if (doc.documentElement) ro.observe(doc.documentElement);
              }
            }
          } catch (e) {}

          // Short stabilization polling for async fonts / dynamic layouts
          let ticks = 0;
          if (pollTimer) clearInterval(pollTimer);
          pollTimer = setInterval(() => {
            resizeNow();
            ticks++;
            if (ticks >= 10) {
              clearInterval(pollTimer);
              pollTimer = null;
            }
          }, 400);
        };

        iframe.addEventListener("load", onLoadHandler);
        // Trigger once in case already loaded synchronously
        setTimeout(resizeNow, 120);

        iframeCleanupFns.push(() => {
          iframe.removeEventListener("load", onLoadHandler);
          if (ro) ro.disconnect();
          if (pollTimer) clearInterval(pollTimer);
        });
      }

      // =========================================================================
      // 6. UTILITIES & UI HELPERS
      // =========================================================================
      function escapeHtml(str) {
        if (str === null || str === undefined) return "";
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function formatTime(totalSeconds) {
        const s = Math.max(0, Math.floor(totalSeconds));
        const m = Math.floor(s / 60);
        const sec = s % 60;
        return String(m).padStart(2, "0") + ":" + String(sec).padStart(2, "0");
      }

      function formatDate(ts) {
        if (!ts) return "Just now";
        return new Date(ts).toLocaleDateString("en-IN", {
          day: "2-digit",
          month: "short",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        });
      }

      function makeProgressKey(studentName, className, examId) {
        const raw = (studentName || "").trim().toLowerCase() + "__" + (className || "").trim().toLowerCase() + "__" + examId;
        return raw.replace(/[^a-z0-9_-]/g, "_").slice(0, 120);
      }

      function getStudentClassObj() {
        if (!state.studentSession) return null;
        return state.classes.find(c => c.name === state.studentSession.className) || null;
      }

      function showToast(message, type) {
        const container = document.getElementById("toast-container");
        if (!container) return;
        const palette = {
          success: "bg-emerald-600 text-white border-emerald-700",
          error: "bg-rose-600 text-white border-rose-700",
          warning: "bg-amber-500 text-slate-950 border-amber-600",
          info: "bg-slate-900 text-white border-slate-800"
        };
        const el = document.createElement("div");
        el.className = "pointer-events-auto px-4 py-3 rounded-2xl shadow-xl border text-sm font-semibold animate-fade-in " + (palette[type] || palette.info);
        el.textContent = message;
        container.appendChild(el);
        setTimeout(() => {
          el.style.opacity = "0";
          el.style.transition = "opacity 0.25s ease";
          setTimeout(() => el.remove(), 260);
        }, 3200);
      }

      function closeModal() {
        const root = document.getElementById("modal-root");
        if (root) root.innerHTML = "";
        resetDocumentScroll(false);
      }

      function showConfirmModal(opts) {
        const btnStyle = opts.confirmStyle === "danger"
          ? "bg-rose-600 hover:bg-rose-700 text-white"
          : "bg-indigo-600 hover:bg-indigo-700 text-white";
        document.getElementById("modal-root").innerHTML = `
          <div class="fixed inset-0 z-[60] flex items-end sm:items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in">
            <div class="bg-white rounded-3xl shadow-2xl border border-slate-200 max-w-md w-full max-h-[90dvh] flex flex-col overflow-hidden">
              <div class="min-h-0 flex-1 overflow-y-auto overscroll-contain scroll-touch p-6">
                <h3 class="text-lg font-bold text-slate-900">${escapeHtml(opts.title)}</h3>
                <p class="text-sm text-slate-600 mt-2 leading-relaxed">${escapeHtml(opts.message)}</p>
              </div>
              <div class="px-6 py-4 bg-slate-50 border-t border-slate-100 flex items-center justify-end gap-2.5 shrink-0">
                <button id="cfm-cancel" class="px-4 py-2.5 rounded-xl text-sm font-semibold text-slate-700 bg-slate-200/70 hover:bg-slate-200 transition">Cancel</button>
                <button id="cfm-ok" class="px-5 py-2.5 rounded-xl text-sm font-bold transition ${btnStyle}">${escapeHtml(opts.confirmText || "Confirm")}</button>
              </div>
            </div>
          </div>
        `;
        document.getElementById("cfm-cancel").onclick = closeModal;
        document.getElementById("cfm-ok").onclick = () => {
          closeModal();
          if (opts.onConfirm) opts.onConfirm();
        };
      }

      function downloadTextFile(filename, content, mime) {
        const blob = new Blob([content], { type: mime || "text/csv;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      }

      // =========================================================================
      // 7. BULLETPROOF BACK-BUTTON & ANDROID WEBVIEW GUARD
      // =========================================================================
      function pushNavState(viewName, extra) {
        try {
          window.history.pushState(Object.assign({ view: viewName, ts: Date.now() }, extra || {}), "", "");
        } catch (e) {
          // Ignore in restricted iframe origins
        }
      }

      function ensureHomeGuard() {
        pushNavState("home", { guard: true });
      }

      function handleBackNavigation() {
        const modalRoot = document.getElementById("modal-root");
        if (modalRoot && modalRoot.innerHTML.trim() !== "") {
          closeModal();
          pushNavState(state.view);
          return true;
        }

        if (state.mobilePaletteOpen) {
          state.mobilePaletteOpen = false;
          resetDocumentScroll(false);
          renderApp();
          pushNavState("exam-runner");
          return true;
        }

        if (state.view === "exam-runner" && state.examSession) {
          pauseAndReturnHome(true);
          return true;
        }

        if (state.view === "chapter-reader" || state.view === "exam-result") {
          state.activeChapterId = null;
          state.lastResultView = null;
          state.view = state.studentSession ? "student-home" : "login";
          resetDocumentScroll(true);
          renderApp();
          if (state.view === "student-home") ensureHomeGuard();
          return true;
        }

        if (state.view === "master") {
          state.view = state.studentSession ? "student-home" : "login";
          resetDocumentScroll(true);
          renderApp();
          if (state.view === "student-home") ensureHomeGuard();
          return true;
        }

        if (state.view === "student-home") {
          ensureHomeGuard();
          showToast("You are on the Home screen. Tap Logout to switch student.", "info");
          return true;
        }

        return false;
      }

      window.handleAndroidBack = () => handleBackNavigation();

      window.addEventListener("popstate", () => {
        handleBackNavigation();
      });

      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "hidden" && state.examSession && !state.examSession.submittedResult) {
          saveCurrentExamProgressNow();
        }
      });

      window.addEventListener("pagehide", () => {
        if (state.examSession && !state.examSession.submittedResult) {
          saveCurrentExamProgressNow();
        }
      });

      // =========================================================================
      // 8. MASTER RENDER DISPATCHER
      // =========================================================================
      function renderApp(scrollTop) {
        cleanupIframeWatchers();
        resetDocumentScroll(Boolean(scrollTop));

        const root = document.getElementById("app-root");
        if (!root) return;

        switch (state.view) {
          case "login":
            root.innerHTML = renderLoginView();
            break;
          case "student-home":
            root.innerHTML = renderStudentHomeView();
            break;
          case "chapter-reader":
            root.innerHTML = renderChapterReaderView();
            attachAutoResizeIframe("chapter-html-iframe", 480);
            break;
          case "exam-runner":
            root.innerHTML = renderExamRunnerView();
            attachAutoResizeIframe("exam-html-paper-iframe", 480);
            break;
          case "exam-result":
            root.innerHTML = renderExamResultView();
            break;
          case "master":
            root.innerHTML = renderMasterView();
            break;
          default:
            root.innerHTML = renderLoginView();
        }
      }

      // =========================================================================

              <!-- Prominent Resume Exam Where You Stopped Card -->

                  </svg>
                  Study Chapters
                  <span class="px-2 py-0.5 rounded-full text-xs ${state.studentTab === "chapters" ? "bg-white/20 text-white" : "bg-slate-100 text-slate-600"}">${myChapters.length}</span>
                </button>

                ${mcqEnabled ? `
                  <button onclick="window.app.setStudentTab('exams')"

                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />

                    Timed MCQ Exams

                    <span class="text-[11px] px-2 py-0.5 rounded-full bg-slate-200 text-slate-500">Locked</span>

      function renderStudentChaptersSection(myChapters) {
        const subjects = ["All", ...new Set(myChapters.map(c => c.subject))];
        if (!subjects.includes(state.studentSubjectFilter)) state.studentSubjectFilter = "All";

        const filtered = myChapters.filter(ch => {
          const subOk = state.studentSubjectFilter === "All" || ch.subject === state.studentSubjectFilter;
          const q = state.studentSearch.trim().toLowerCase();
          const qOk = !q || ch.title.toLowerCase().includes(q) || ch.subject.toLowerCase().includes(q);
          return subOk && qOk;
        });

        return `
          <section class="space-y-4">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">

                  <button onclick="window.app.setStudentSubjectFilter('${escapeHtml(sub)}')"

                      state.studentSubjectFilter === sub
                        ? "bg-indigo-600 text-white shadow-sm"
                        : "bg-white text-slate-600 border border-slate-200 hover:bg-slate-100"
                    }">
                    ${escapeHtml(sub)}
                  </button>
                `).join("")}
              </div>

              <div class="relative w-full sm:w-64">
                <input id="student-ch-search" type="text" value="${escapeHtml(state.studentSearch)}"

                <svg class="w-4 h-4 text-slate-400 absolute left-3 top-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>

            ${filtered.length === 0 ? `
              <div class="bg-white rounded-3xl border border-dashed border-slate-300 p-12 text-center">
                <p class="text-slate-700 font-bold">No chapters available yet</p>
                <p class="text-sm text-slate-400 mt-1">Chapters uploaded in the Master Panel for ${escapeHtml(state.studentSession.className)} will appear here.</p>
              </div>
            ` : `
              <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-5">
                ${filtered.map(ch => {
                  const done = state.completedChapterIds.has(ch.id);
                  const isHtml = ch.contentType === "html" && ch.htmlContent;
                  return `
                    <article class="bg-white rounded-2xl border ${done ? "border-emerald-200" : "border-slate-200"} shadow-sm hover:shadow-md transition p-5 flex flex-col justify-between">
                      <div>

      // =========================================================================
      // 12. INTERACTIVE EXAM RUNNER (+4 / -1, RESUME, MOBILE DRAWER, HTML-OMR)
      // =========================================================================
      function clearExamTimer() {
        if (state.timerInterval) {
          clearInterval(state.timerInterval);
          state.timerInterval = null;
        }
      }

      function saveCurrentExamProgressNow() {
        const sess = state.examSession;
        if (!sess || sess.submittedResult) return;
        state.savedProgressMap[sess.progressKey] = {
          examId: sess.exam.id,
          currentIndex: sess.currentIndex,
          answers: sess.answers,
          flaggedArr: Array.from(sess.flagged),
          remainingSeconds: sess.remainingSeconds,
          updatedAt: Date.now()
        };
        writeLocalJson(PROGRESS_STORAGE_KEY, state.savedProgressMap);
      }

      function pauseAndReturnHome(fromBackBtn) {
        if (state.examSession && !state.examSession.submittedResult) {
          clearExamTimer();
          saveCurrentExamProgressNow();
          state.examSession = null;
          state.mobilePaletteOpen = false;
          state.view = "student-home";
          ensureHomeGuard();
          renderApp(true);
          showToast(
            fromBackBtn
              ? "Exam paused & progress saved. You can resume anytime."
              : "Progress saved! Timer paused where you stopped.",
            "info"
          );
        } else {
          state.view = "student-home";
          ensureHomeGuard();
          renderApp(true);
        }
      }

      function startOrResumeExam(examId) {
        if (!state.studentSession) return;
        const clsObj = getStudentClassObj();
        if (clsObj && !clsObj.mcqEnabled) {
          showToast("MCQ Exams are not enabled for your class.", "warning");
          return;
        }
        const exam = state.exams.find(e => e.id === examId);
        if (!exam || !exam.questions || exam.questions.length === 0) {
          showToast("This exam has no questions yet.", "error");
          return;
        }

        clearExamTimer();
        closeModal();
        const { name, className } = state.studentSession;
        const progressKey = makeProgressKey(name, className, exam.id);
        const saved = state.savedProgressMap[progressKey];
        const totalSeconds = Math.max(1, Number(exam.durationMinutes) || 10) * 60;

        state.examSession = {
          exam: JSON.parse(JSON.stringify(exam)),
          progressKey,
          currentIndex: saved ? Math.min(saved.currentIndex || 0, exam.questions.length - 1) : 0,
          answers: saved && saved.answers ? Object.assign({}, saved.answers) : {},
          flagged: new Set(saved && Array.isArray(saved.flaggedArr) ? saved.flaggedArr : []),
          remainingSeconds: saved && saved.remainingSeconds > 0 ? saved.remainingSeconds : totalSeconds,
          totalSeconds,
          submittedResult: null
        };

        state.mobilePaletteOpen = false;
        state.view = "exam-runner";
        pushNavState("exam-runner");

        if (saved) {
          showToast("Resumed at Question " + (state.examSession.currentIndex + 1) + " (" + formatTime(state.examSession.remainingSeconds) + " left).", "info");
        }

        state.timerInterval = setInterval(() => {
          if (!state.examSession || state.examSession.submittedResult) {
            clearExamTimer();
            return;
          }
          state.examSession.remainingSeconds -= 1;
          updateExamTimerDOM();
          saveCurrentExamProgressNow();

          if (state.examSession.remainingSeconds <= 0) {
            clearExamTimer();
            showToast("Time is up! Submitting your exam automatically.", "warning");
            finalizeExamSubmission();
          }
        }, 1000);

        renderApp(true);
      }

      function updateExamTimerDOM() {
        const pill = document.getElementById("runner-timer-pill");
        const txt = document.getElementById("runner-timer-text");
        if (!pill || !txt || !state.examSession) return;
        const rem = state.examSession.remainingSeconds;
        txt.textContent = formatTime(rem);
        if (rem <= 30) {
          pill.className = "flex items-center gap-1.5 px-3 py-1.5 rounded-xl font-mono-num font-bold text-sm sm:text-base bg-rose-600 text-white timer-critical";
        } else if (rem <= 120) {
          pill.className = "flex items-center gap-1.5 px-3 py-1.5 rounded-xl font-mono-num font-bold text-sm sm:text-base bg-amber-100 text-amber-900 border border-amber-300";
        } else {
          pill.className = "flex items-center gap-1.5 px-3 py-1.5 rounded-xl font-mono-num font-bold text-sm sm:text-base bg-slate-900 text-white";
        }
      }

      async function finalizeExamSubmission() {
        clearExamTimer();
        closeModal();
        const sess = state.examSession;
        if (!sess || sess.submittedResult) return;

        const questions = sess.exam.questions;
        let correct = 0;
        let wrong = 0;
        let unattempted = 0;

        questions.forEach((q, idx) => {
          const picked = sess.answers[idx];
          if (picked === undefined || picked === null) {
            unattempted++;
          } else if (Number(picked) === Number(q.correctIndex)) {
            correct++;
          } else {
            wrong++;
          }
        });

        const totalQuestions = questions.length;
        const maxMarks = totalQuestions * MARKS_CORRECT;
        const score = (correct * MARKS_CORRECT) + (wrong * MARKS_WRONG);
        const attempted = correct + wrong;
        const accuracy = attempted > 0 ? Math.round((correct / attempted) * 100) : 0;
        const timeTakenSeconds = Math.max(1, sess.totalSeconds - Math.max(0, sess.remainingSeconds));
        const clsObj = getStudentClassObj();

        const resultRecord = {
          id: "res-" + Date.now(),
          studentName: state.studentSession.name,
          classId: clsObj ? clsObj.id : "",
          className: state.studentSession.className,
          examId: sess.exam.id,
          examTitle: sess.exam.title,
          subject: sess.exam.subject,
          score: score,
          maxMarks: maxMarks,
          correct: correct,
          wrong: wrong,
          unattempted: unattempted,
          totalQuestions: totalQuestions,
          accuracy: accuracy,
          timeTakenSeconds: timeTakenSeconds,
          submittedAt: Date.now()
        };

        sess.submittedResult = resultRecord;
        state.lastResultView = {
          exam: sess.exam,
          answers: Object.assign({}, sess.answers),
          result: resultRecord
        };

        delete state.savedProgressMap[sess.progressKey];
        writeLocalJson(PROGRESS_STORAGE_KEY, state.savedProgressMap);

        state.examSession = null;
        state.mobilePaletteOpen = false;
        state.view = "exam-result";
        pushNavState("exam-result");
        // Explicitly unlock scroll & scroll to top for the Results & Review page
        renderApp(true);

        await postStudentResultToCloud(resultRecord);
      }

      function renderExamResultView() {
        const data = state.lastResultView;
        if (!data) {
          state.view = "student-home";
          return renderStudentHomeView();
        }
        const { exam, answers, result } = data;
        const letters = ["A", "B", "C", "D"];

        return `
          <div class="min-h-[100dvh] flex flex-col bg-slate-50 pb-24">
            <!-- Sticky Top Results Bar -->
            <header class="sticky top-0 z-40 bg-white/95 backdrop-blur border-b border-slate-200 shadow-sm">
              <div class="max-w-5xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-3">
                <div class="min-w-0">
                  <h1 class="text-base font-extrabold text-slate-900 truncate">Exam Result &amp; Review</h1>
                  <p class="text-[11px] font-semibold text-indigo-600 truncate">${escapeHtml(result.studentName)} &bull; ${escapeHtml(result.className)}</p>
                </div>
                <button onclick="window.app.backToStudentHome()"
                  class="px-4 py-2 rounded-xl text-xs sm:text-sm font-bold bg-indigo-600 hover:bg-indigo-700 text-white shrink-0 transition">
                  &larr; Back to Home
                </button>
              </div>
            </header>

            <!-- Natural Full-Page Scrollable Content -->
            <main class="flex-1 max-w-5xl w-full mx-auto px-4 sm:px-6 py-6 space-y-6">
              <section class="bg-white rounded-3xl border border-slate-200 shadow-sm p-5 sm:p-8">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-6 border-b border-slate-100">
                  <div class="min-w-0">
                    <span class="inline-flex px-3 py-1 rounded-full text-xs font-bold bg-indigo-50 text-indigo-700 mb-2">
                      +4 Correct &bull; -1 Wrong &bull; 0 Unattempted
                    </span>
                    <h2 class="text-xl sm:text-2xl font-extrabold text-slate-900 break-words">${escapeHtml(result.examTitle)}</h2>
                    <p class="text-sm text-slate-500 mt-1">
                      Student: <strong class="text-slate-900">${escapeHtml(result.studentName)}</strong> &bull;
                      <strong class="text-indigo-700">${escapeHtml(result.className)}</strong> &bull;
                      ${escapeHtml(result.subject)}
                    </p>
                  </div>
                  <div class="bg-slate-900 text-white rounded-2xl px-6 py-4 text-center shrink-0">
                    <p class="text-[11px] uppercase tracking-wider text-slate-400 font-bold">Final Score</p>
                    <p class="text-3xl font-extrabold font-mono-num mt-0.5">${result.score} <span class="text-lg text-slate-400">/ ${result.maxMarks}</span></p>
                  </div>
                </div>

                <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 sm:gap-4 mt-6">
                  <div class="rounded-2xl bg-emerald-50 border border-emerald-100 p-4">
                    <p class="text-xs font-bold text-emerald-700">Correct (+4)</p>
                    <p class="text-2xl font-extrabold text-emerald-950 font-mono-num mt-1">${result.correct}</p>
                    <p class="text-[11px] text-emerald-700 font-mono-num">+${result.correct * 4} marks</p>
                  </div>
                  <div class="rounded-2xl bg-rose-50 border border-rose-100 p-4">
                    <p class="text-xs font-bold text-rose-700">Wrong (-1)</p>
                    <p class="text-2xl font-extrabold text-rose-950 font-mono-num mt-1">${result.wrong}</p>
                    <p class="text-[11px] text-rose-700 font-mono-num">-${result.wrong} marks</p>
                  </div>
                  <div class="rounded-2xl bg-slate-100 border border-slate-200 p-4">
                    <p class="text-xs font-bold text-slate-600">Unanswered (0)</p>
                    <p class="text-2xl font-extrabold text-slate-900 font-mono-num mt-1">${result.unattempted}</p>
                    <p class="text-[11px] text-slate-500">Skipped</p>
                  </div>
                  <div class="rounded-2xl bg-indigo-50 border border-indigo-100 p-4">
                    <p class="text-xs font-bold text-indigo-700">Accuracy</p>
                    <p class="text-2xl font-extrabold text-indigo-950 font-mono-num mt-1">${result.accuracy}%</p>
                    <p class="text-[11px] text-indigo-700 font-mono-num">Time: ${formatTime(result.timeTakenSeconds)}</p>
                  </div>
                </div>
              </section>

              <section class="space-y-4">
                <div class="flex items-center justify-between">
                  <h3 class="text-lg font-extrabold text-slate-900">Question-by-Question Review (${exam.questions.length})</h3>
                </div>

                ${exam.questions.map((q, idx) => {
                  const picked = answers[idx];
                  const isSkipped = picked === undefined || picked === null;
                  const isCorrect = !isSkipped && Number(picked) === Number(q.correctIndex);
                  const markBadge = isCorrect
                    ? '<span class="px-2.5 py-1 rounded-full text-xs font-bold bg-emerald-100 text-emerald-800 font-mono-num">+4 Correct</span>'
                    : isSkipped
                      ? '<span class="px-2.5 py-1 rounded-full text-xs font-bold bg-slate-200 text-slate-700 font-mono-num">0 Skipped</span>'
                      : '<span class="px-2.5 py-1 rounded-full text-xs font-bold bg-rose-100 text-rose-800 font-mono-num">-1 Wrong</span>';

                  return `
                    <div class="bg-white rounded-2xl border border-slate-200 p-4 sm:p-5 shadow-sm">
                      <div class="flex items-start justify-between gap-3">
                        <h4 class="text-sm sm:text-base font-bold text-slate-900 leading-snug break-words">Q${idx + 1}. ${escapeHtml(q.text)}</h4>
                        <div class="shrink-0">${markBadge}</div>
                      </div>

                      ${Array.isArray(q.options) && q.options.length > 0 ? `
                        <div class="mt-3.5 grid grid-cols-1 sm:grid-cols-2 gap-2">
                          ${q.options.map((opt, optIdx) => {
                            const rightOpt = optIdx === Number(q.correctIndex);
                            const userPick = !isSkipped && optIdx === Number(picked);
                            let style = "bg-slate-50 border-slate-200 text-slate-700";
                            if (rightOpt) style = "bg-emerald-50 border-emerald-400 text-emerald-950 font-semibold";
                            else if (userPick && !rightOpt) style = "bg-rose-50 border-rose-400 text-rose-950 font-semibold";
                            return `
                              <div class="p-3 rounded-xl border text-xs sm:text-sm flex items-center justify-between gap-2 break-words ${style}">
                                <span><strong>${letters[optIdx]}.</strong> ${escapeHtml(opt)}</span>
                                ${rightOpt ? '<span class="text-[11px] font-bold text-emerald-700 shrink-0">&#10003;</span>' : ""}
                                ${userPick && !rightOpt ? '<span class="text-[11px] font-bold text-rose-700 shrink-0">&#10007;</span>' : ""}
                              </div>
                            `;
                          }).join("")}
                        </div>
                      ` : `
                        <div class="mt-3 text-xs sm:text-sm flex flex-wrap gap-3">
                          <span class="font-semibold text-emerald-700">Correct Answer: Option ${letters[q.correctIndex]}</span>
                          <span class="font-semibold text-slate-600">Your Answer: ${isSkipped ? "Unattempted" : "Option " + letters[picked]}</span>
                        </div>
                      `}

                      ${q.explanation ? `
                        <div class="mt-3.5 p-3.5 rounded-xl bg-indigo-50/70 border border-indigo-100 text-xs sm:text-sm text-indigo-950 break-words">
                          <strong class="text-indigo-800">Explanation:</strong> ${escapeHtml(q.explanation)}
                        </div>
                      ` : ""}
                    </div>
                  `;
                }).join("")}

                <div class="pt-4">
                  <button onclick="window.app.backToStudentHome()"
                    class="w-full py-3.5 rounded-2xl text-sm font-bold bg-indigo-600 hover:bg-indigo-700 text-white shadow-sm transition">
                    &larr; Return to Student Home
                  </button>
                </div>
              </section>
            </main>
          </div>
        `;
      }

          state.view = "master";
          pushNavState("master");
          renderApp(true);
          return;
        }
        document.getElementById("modal-root").innerHTML = `
          <div class="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in">
            <div class="bg-white rounded-3xl shadow-2xl border border-slate-200 max-w-sm w-full max-h-[90dvh] flex flex-col overflow-hidden">
              <div class="min-h-0 flex-1 overflow-y-auto overscroll-contain scroll-touch p-6">
                <div class="flex items-center gap-3 mb-5">
                  <div class="w-11 h-11 rounded-2xl bg-slate-900 text-amber-400 flex items-center justify-center shrink-0">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                    </svg>
                  </div>
                  <div>
                    <h3 class="text-lg font-extrabold text-slate-900">Master Admin</h3>
                    <p class="text-xs text-slate-500">Authorized access only</p>
                  </div>
                </div>

                <form id="master-pin-form" class="space-y-4">
                  <div>
                    <label for="master-pin-field" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Enter Master PIN</label>
                    <input id="master-pin-field" type="password" inputmode="numeric" autocomplete="off" required autofocus
                      placeholder="••••••••"
                      class="w-full px-4 py-3 rounded-2xl border border-slate-300 focus:ring-2 focus:ring-amber-500 focus:border-amber-500 outline-none text-center text-lg font-mono-num tracking-widest" />
                    <p id="master-pin-err" class="text-xs text-rose-600 font-semibold mt-1.5 hidden">Invalid PIN. Please try again.</p>
                  </div>
                  <div class="flex items-center justify-end gap-2 pt-1">
                    <button type="button" onclick="window.app.closeModal()" class="px-4 py-2.5 rounded-xl text-sm font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200">Cancel</button>
                    <button type="submit" class="px-5 py-2.5 rounded-xl text-sm font-bold bg-slate-900 hover:bg-slate-800 text-amber-400 transition">Unlock</button>
                  </div>
                </form>
              </div>
            </div>
          </div>
        `;

        document.getElementById("master-pin-form").onsubmit = (e) => {
          e.preventDefault();
          const val = document.getElementById("master-pin-field").value.trim();
          if (val === MASTER_PIN) {
            state.isMasterAuth = true;
            state.view = "master";
            closeModal();
            pushNavState("master");
            showToast("Master Control Panel unlocked.", "success");
            renderApp(true);
          } else {
            document.getElementById("master-pin-err").classList.remove("hidden");
            document.getElementById("master-pin-field").value = "";
            document.getElementById("master-pin-field").focus();
          }
        };
      }

                  </div>
                </div>

                <div class="flex items-center gap-2 shrink-0">
                  <div class="hidden sm:block">${renderCloudStatusBadge(true)}</div>
                  <button onclick="window.app.syncCloudNow()" title="Refresh from Cloud"
                    class="px-3 py-2 rounded-xl text-xs font-bold bg-white/10 hover:bg-white/20 text-white transition inline-flex items-center gap-1">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                    <span class="hidden sm:inline">Sync</span>
                  </button>
                  <button onclick="window.app.exitMasterMode()"
                    class="px-3.5 py-2 rounded-xl text-xs font-bold bg-amber-500 hover:bg-amber-400 text-slate-950 transition shrink-0">
                    Exit Master &rarr;
                  </button>
                </div>
              </div>
            </header>

            <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-5 space-y-6 animate-fade-in">
              <div class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-1">
                ${[
                  { id: "classes", label: "Manage Classes", count: state.classes.length },
                  { id: "chapters", label: "Chapters & HTML Notes", count: state.chapters.length },
                  { id: "exams", label: "Timed MCQ Exams", count: state.exams.length },
                  { id: "results", label: "Student Results", count: state.results.length }
                ].map(t => `
                  <button onclick="window.app.setMasterTab('${t.id}')"
                    class="px-4 py-2.5 rounded-2xl text-xs sm:text-sm font-bold transition shrink-0 flex items-center gap-2 ${
                      state.masterTab === t.id
                        ? "bg-slate-900 text-amber-400 shadow-md"
                        : "bg-white text-slate-600 border border-slate-200 hover:bg-slate-100"
                    }">
                    <span>${t.label}</span>
                    <span class="px-2 py-0.5 rounded-full text-[11px] ${state.masterTab === t.id ? "bg-white/15 text-white" : "bg-slate-100 text-slate-500"}">${t.count}</span>
                  </button>
                `).join("")}
              </div>

              ${state.masterTab === "classes" ? renderMasterClassesTab() : ""}
              ${state.masterTab === "chapters" ? renderMasterChaptersTab() : ""}
              ${state.masterTab === "exams" ? renderMasterExamsTab() : ""}
              ${state.masterTab === "results" ? renderMasterResultsTab() : ""}
            </main>
          </div>
        `;
      }

      // --- MASTER TAB 1: MANAGE CLASSES ---
      function renderMasterClassesTab() {
        return `
          <section class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
            <div class="lg:col-span-5 bg-white rounded-3xl border border-slate-200 shadow-sm p-5 sm:p-6">
              <h2 class="text-base font-extrabold text-slate-900">+ Add New Class</h2>
              <p class="text-xs text-slate-500 mt-1">New classes sync to Google Drive and appear in the Student Login dropdown.</p>

              <form onsubmit="window.app.handleAddClass(event)" class="mt-5 space-y-4">
                <div>
                  <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Class Name *</label>
                  <input id="new-class-name" type="text" required placeholder="e.g., Class 9, JEE Batch"
                    class="w-full px-4 py-3 rounded-xl border border-slate-300 text-sm font-medium focus:ring-2 focus:ring-amber-500 outline-none" />
                </div>

                <label class="flex items-center justify-between gap-3 p-3.5 rounded-xl bg-slate-50 border border-slate-200 cursor-pointer">
                  <div>
                    <p class="text-sm font-bold text-slate-900">Allow Timed MCQ Exams</p>
                    <p class="text-xs text-slate-500">Enable MCQ test portal for students in this class</p>
                  </div>
                  <input id="new-class-mcq" type="checkbox" checked class="w-5 h-5 accent-indigo-600 rounded" />
                </label>

                <button type="submit" class="w-full py-3 rounded-xl text-sm font-bold bg-slate-900 hover:bg-slate-800 text-amber-400 shadow-sm transition">
                  Add Class
                </button>
              </form>
            </div>

            <div class="lg:col-span-7 bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden">
              <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between">
                <h3 class="text-base font-extrabold text-slate-900">Active Classes (${state.classes.length})</h3>
              </div>
              <div class="divide-y divide-slate-100">
                ${state.classes.map(c => `
                  <div class="p-4 sm:p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                    <div>
                      <h4 class="text-base font-extrabold text-slate-900">${escapeHtml(c.name)}</h4>
                      <p class="text-xs mt-0.5 ${c.mcqEnabled ? "text-emerald-700 font-semibold" : "text-slate-500"}">
                        ${c.mcqEnabled ? "Timed MCQ Exams: Enabled" : "Timed MCQ Exams: Disabled (Study Chapters Only)"}
                      </p>
                    </div>
                    <div class="flex items-center gap-2 shrink-0">
                      <button onclick="window.app.toggleClassMcq('${c.id}', ${!c.mcqEnabled})"
                        class="px-3.5 py-2 rounded-xl text-xs font-bold border transition ${
                          c.mcqEnabled
                            ? "bg-emerald-50 border-emerald-200 text-emerald-800 hover:bg-emerald-100"
                            : "bg-slate-100 border-slate-200 text-slate-700 hover:bg-slate-200"
                        }">
                        ${c.mcqEnabled ? "MCQ: ON" : "MCQ: OFF"}
                      </button>
                      <button onclick="window.app.confirmDeleteClass('${c.id}', '${escapeHtml(c.name)}')"
                        class="px-3 py-2 rounded-xl text-xs font-bold bg-rose-50 hover:bg-rose-100 text-rose-700 transition">
                        Delete
                      </button>
                    </div>
                  </div>
                `).join("")}
              </div>
            </div>
          </section>
        `;
      }

      // --- MASTER TAB 2: CHAPTERS & HTML NOTES ---
      function renderMasterChaptersTab() {
        const filtered = state.chapters.filter(ch => {
          return state.masterChapterClassFilter === "All" || ch.className === state.masterChapterClassFilter;
        });

        return `
          <section class="space-y-4">
            <div class="bg-white rounded-2xl border border-slate-200 p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <select onchange="window.app.setMasterChapterClassFilter(this.value)"
                class="px-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm font-semibold outline-none">
                <option value="All" ${state.masterChapterClassFilter === "All" ? "selected" : ""}>All Classes</option>
                ${state.classes.map(c => `<option value="${escapeHtml(c.name)}" ${state.masterChapterClassFilter === c.name ? "selected" : ""}>${escapeHtml(c.name)}</option>`).join("")}
              </select>

              <button onclick="window.app.openChapterFormModal()"
                class="px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold bg-slate-900 hover:bg-slate-800 text-amber-400 shadow-sm transition">
                + Upload Chapter / HTML Note
              </button>
            </div>

            <div class="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden divide-y divide-slate-100">
              ${filtered.length === 0 ? `
                <div class="p-10 text-center text-sm text-slate-500">No chapters uploaded yet.</div>
              ` : filtered.map(ch => `
                <div class="p-4 sm:p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-3 hover:bg-slate-50/70 transition">
                  <div class="min-w-0">
                    <div class="flex flex-wrap items-center gap-1.5 mb-1">
                      <span class="px-2.5 py-0.5 rounded-md text-xs font-bold bg-slate-900 text-white">${escapeHtml(ch.className)}</span>
                      <span class="px-2.5 py-0.5 rounded-md text-xs font-bold bg-indigo-50 text-indigo-700">${escapeHtml(ch.subject)}</span>
                      ${ch.contentType === "html" ? '<span class="px-2 py-0.5 rounded-md text-[11px] font-bold bg-violet-100 text-violet-800">HTML Note</span>' : '<span class="px-2 py-0.5 rounded-md text-[11px] font-semibold bg-slate-100 text-slate-600">Standard Note</span>'}
                    </div>
                    <h4 class="text-base font-extrabold text-slate-900 truncate">${escapeHtml(ch.title)}</h4>
                  </div>
                  <div class="flex items-center gap-2 shrink-0">
                    <button onclick="window.app.openChapterFormModal('${ch.id}')" class="px-3.5 py-2 rounded-xl text-xs font-bold bg-slate-100 hover:bg-slate-200 text-slate-700">Edit</button>
                    <button onclick="window.app.confirmDeleteChapter('${ch.id}')" class="px-3.5 py-2 rounded-xl text-xs font-bold bg-rose-50 hover:bg-rose-100 text-rose-700">Delete</button>
                  </div>
                </div>
              `).join("")}
            </div>
          </section>
        `;
      }

      function openChapterFormModal(editId) {
        const existing = editId ? state.chapters.find(c => c.id === editId) : null;
        let contentType = existing && existing.contentType ? existing.contentType : "standard";
        let uploadedHtml = existing && existing.htmlContent ? existing.htmlContent : "";

        document.getElementById("modal-root").innerHTML = `
          <div class="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-2.5 sm:p-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in">
            <div class="bg-white rounded-3xl shadow-2xl border border-slate-200 max-w-2xl w-full max-h-[90dvh] flex flex-col overflow-hidden">
              <div class="px-5 py-4 border-b border-slate-200 flex items-center justify-between bg-slate-50 shrink-0">
                <h3 class="text-base sm:text-lg font-extrabold text-slate-900">${existing ? "Edit Chapter" : "Upload Chapter / Note"}</h3>
                <button onclick="window.app.closeModal()" class="p-1.5 rounded-lg text-slate-400 hover:text-slate-700 font-bold">&#10005;</button>
              </div>

              <form id="chapter-modal-form" class="min-h-0 flex-1 flex flex-col overflow-hidden">
                <div class="min-h-0 flex-1 overflow-y-auto overscroll-contain scroll-touch p-5 space-y-4">
                  <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                    <div>
                      <label class="block text-xs font-bold text-slate-700 mb-1">Class *</label>
                      <select id="ch-cls" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm bg-white outline-none">
                        ${state.classes.map(c => `<option value="${escapeHtml(c.name)}" ${existing && existing.className === c.name ? "selected" : ""}>${escapeHtml(c.name)}</option>`).join("")}
                      </select>
                    </div>
                    <div>
                      <label class="block text-xs font-bold text-slate-700 mb-1">Subject *</label>
                      <select id="ch-sub" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm bg-white outline-none">
                        ${SUBJECTS.map(s => `<option value="${s}" ${existing && existing.subject === s ? "selected" : ""}>${s}</option>`).join("")}
                      </select>
                    </div>
                  </div>

                  <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Chapter Title *</label>
                    <input id="ch-title" type="text" required value="${escapeHtml(existing ? existing.title : "")}" placeholder="e.g., Wave Optics"
                      class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm outline-none focus:ring-2 focus:ring-indigo-500" />
                  </div>

                  <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">Note Format</label>
                    <div class="grid grid-cols-2 gap-2 p-1 rounded-xl bg-slate-100 border border-slate-200">
                      <button type="button" id="btn-ch-mode-std" class="py-2 rounded-lg text-xs font-bold transition ${contentType === "standard" ? "bg-white text-indigo-700 shadow-sm" : "text-slate-600"}">Standard Text Editor</button>
                      <button type="button" id="btn-ch-mode-html" class="py-2 rounded-lg text-xs font-bold transition ${contentType === "html" ? "bg-white text-violet-700 shadow-sm" : "text-slate-600"}">HTML File / Paste HTML</button>
                    </div>
                  </div>

                  <div id="ch-std-fields" class="${contentType === "standard" ? "space-y-3.5" : "hidden"}">
                    <div>
                      <label class="block text-xs font-bold text-slate-700 mb-1">Key Takeaways (one per line)</label>
                      <textarea id="ch-takeaways" rows="3" placeholder="Bullet points..."
                        class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm outline-none">${escapeHtml(existing && existing.takeaways ? existing.takeaways.join("\n") : "")}</textarea>
                    </div>
                    <div>
                      <label class="block text-xs font-bold text-slate-700 mb-1">Detailed Notes *</label>
                      <textarea id="ch-content" rows="5" ${contentType === "standard" ? "required" : ""} placeholder="Write chapter notes..."
                        class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm outline-none">${escapeHtml(existing ? existing.content : "")}</textarea>
                    </div>
                  </div>

                  <div id="ch-html-fields" class="${contentType === "html" ? "space-y-3" : "hidden"}">
                    <div class="p-4 rounded-2xl border-2 border-dashed border-violet-300 bg-violet-50/50 space-y-3">
                      <p class="text-xs font-bold text-violet-900 text-center">Upload your prepared HTML Note (.html / .htm)</p>
                      <input id="ch-html-file" type="file" accept="text/html,text/plain,.html,.htm,*/*"
                        class="block w-full text-xs text-slate-600 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-violet-600 file:text-white hover:file:bg-violet-700 cursor-pointer" />
                      <p id="ch-html-status" class="text-xs font-semibold text-center ${uploadedHtml ? "text-emerald-700" : "text-slate-500"}">
                        ${uploadedHtml ? "HTML loaded (" + uploadedHtml.length.toLocaleString() + " characters ready)" : "No HTML file selected yet."}
                      </p>

                      <div class="pt-3 border-t border-violet-200/80 space-y-2">
                        <p class="text-[11px] font-extrabold uppercase tracking-wider text-violet-700 text-center">&mdash; OR Paste HTML Code Directly &mdash;</p>
                        <textarea id="ch-html-paste" rows="5" placeholder="Paste your HTML note code here..."
                          class="w-full px-3 py-2 rounded-xl border border-violet-200 bg-white text-xs font-mono outline-none focus:ring-2 focus:ring-violet-500">${escapeHtml(uploadedHtml)}</textarea>
                        <button type="button" id="btn-load-pasted-ch-html"
                          class="w-full py-2.5 rounded-xl text-xs font-bold bg-violet-600 hover:bg-violet-700 text-white transition">
                          Load Pasted HTML
                        </button>
                      </div>
                    </div>
                  </div>

                  <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Optional Reference / Video URL</label>
                    <input id="ch-video" type="url" value="${escapeHtml(existing ? existing.videoUrl : "")}" placeholder="https://..."
                      class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm outline-none" />
                  </div>
                </div>

                <div class="px-5 py-4 border-t border-slate-100 bg-slate-50 flex items-center justify-end gap-2 shrink-0">
                  <button type="button" onclick="window.app.closeModal()" class="px-4 py-2.5 rounded-xl text-sm font-semibold text-slate-600 bg-slate-200/70">Cancel</button>
                  <button type="submit" class="px-5 py-2.5 rounded-xl text-sm font-bold bg-slate-900 text-amber-400">
                    ${existing ? "Save Changes" : "Publish Chapter"}
                  </button>
                </div>
              </form>
            </div>
          </div>
        `;

        document.getElementById("btn-ch-mode-std").onclick = () => {
          contentType = "standard";
          document.getElementById("ch-std-fields").className = "space-y-3.5";
          document.getElementById("ch-html-fields").className = "hidden";
          document.getElementById("ch-content").setAttribute("required", "required");
          document.getElementById("btn-ch-mode-std").className = "py-2 rounded-lg text-xs font-bold transition bg-white text-indigo-700 shadow-sm";
          document.getElementById("btn-ch-mode-html").className = "py-2 rounded-lg text-xs font-bold transition text-slate-600";
        };

        document.getElementById("btn-ch-mode-html").onclick = () => {
          contentType = "html";
          document.getElementById("ch-std-fields").className = "hidden";
          document.getElementById("ch-html-fields").className = "space-y-3";
          document.getElementById("ch-content").removeAttribute("required");
          document.getElementById("btn-ch-mode-html").className = "py-2 rounded-lg text-xs font-bold transition bg-white text-violet-700 shadow-sm";
          document.getElementById("btn-ch-mode-std").className = "py-2 rounded-lg text-xs font-bold transition text-slate-600";
        };

        document.getElementById("ch-html-file").onchange = (ev) => {
          const file = ev.target.files && ev.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => {
            uploadedHtml = String(reader.result || "");
            const pasteEl = document.getElementById("ch-html-paste");
            if (pasteEl) pasteEl.value = uploadedHtml;
            const st = document.getElementById("ch-html-status");
            if (st) {
              st.className = "text-xs font-bold text-emerald-700 text-center";
              st.textContent = "Loaded \"" + file.name + "\" (" + uploadedHtml.length.toLocaleString() + " chars)";
            }
          };
          reader.readAsText(file);
        };

        const syncPastedChapterHtml = (notify) => {
          const val = document.getElementById("ch-html-paste") ? document.getElementById("ch-html-paste").value : "";
          uploadedHtml = val;
          const st = document.getElementById("ch-html-status");
          if (st) {
            if (val.trim()) {
              st.className = "text-xs font-bold text-emerald-700 text-center";
              st.textContent = "Pasted HTML ready (" + val.length.toLocaleString() + " chars)";
            } else {
              st.className = "text-xs font-semibold text-slate-500 text-center";
              st.textContent = "No HTML file selected yet.";
            }
          }
          if (notify) {
            if (val.trim()) showToast("Pasted HTML note loaded!", "success");
            else showToast("Please paste some HTML code first.", "warning");
          }
        };

        document.getElementById("ch-html-paste").oninput = () => syncPastedChapterHtml(false);
        document.getElementById("btn-load-pasted-ch-html").onclick = () => syncPastedChapterHtml(true);

        document.getElementById("chapter-modal-form").onsubmit = async (e) => {
          e.preventDefault();
          if (contentType === "html" && !uploadedHtml.trim()) {
            showToast("Please upload or paste HTML content first.", "warning");
            return;
          }
          const payload = {
            className: document.getElementById("ch-cls").value,
            subject: document.getElementById("ch-sub").value,
            title: document.getElementById("ch-title").value.trim(),
            contentType: contentType,
            takeaways: document.getElementById("ch-takeaways").value.split("\n").map(s => s.trim()).filter(Boolean),
            content: document.getElementById("ch-content").value.trim(),
            htmlContent: contentType === "html" ? uploadedHtml : "",
            videoUrl: document.getElementById("ch-video").value.trim()
          };

          if (editId) {
            const idx = state.chapters.findIndex(c => c.id === editId);
            if (idx !== -1) state.chapters[idx] = Object.assign({}, state.chapters[idx], payload);
          } else {
            state.chapters.unshift(Object.assign({ id: "ch-" + Date.now(), createdAt: Date.now() }, payload));
          }
          closeModal();
          renderApp();
          await pushAllToCloud(false);
        };
      }

      // --- MASTER TAB 3: TIMED MCQ EXAMS & HTML QUESTION PAPER UPLOAD ---
      function renderMasterExamsTab() {
        const mcqClasses = state.classes.filter(c => c.mcqEnabled);
        const filtered = state.exams.filter(ex => {
          return state.masterExamClassFilter === "All" || ex.className === state.masterExamClassFilter;
        });

        return `
          <section class="space-y-4">
            <div class="bg-white rounded-2xl border border-slate-200 p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <select onchange="window.app.setMasterExamClassFilter(this.value)"
                class="px-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm font-semibold outline-none">
                <option value="All" ${state.masterExamClassFilter === "All" ? "selected" : ""}>All MCQ-Enabled Classes</option>
                ${mcqClasses.map(c => `<option value="${escapeHtml(c.name)}" ${state.masterExamClassFilter === c.name ? "selected" : ""}>${escapeHtml(c.name)}</option>`).join("")}
              </select>

              <button onclick="window.app.openExamFormModal()"
                class="px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold bg-slate-900 hover:bg-slate-800 text-amber-400 shadow-sm transition">
                + Create Timed MCQ Exam
              </button>
            </div>

            <div class="grid grid-cols-1 gap-4">
              ${filtered.length === 0 ? `
                <div class="bg-white rounded-3xl border border-dashed border-slate-300 p-10 text-center text-sm text-slate-500">No exams created yet.</div>
              ` : filtered.map(ex => {
                const qCount = ex.questions ? ex.questions.length : 0;
                return `
                  <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 flex flex-col md:flex-row md:items-center justify-between gap-4">
                    <div>
                      <div class="flex flex-wrap items-center gap-1.5 mb-1.5">
                        <span class="px-2.5 py-0.5 rounded-md text-xs font-bold bg-slate-900 text-white">${escapeHtml(ex.className)}</span>
                        <span class="px-2.5 py-0.5 rounded-md text-xs font-bold bg-indigo-50 text-indigo-700">${escapeHtml(ex.subject)}</span>
                        <span class="px-2.5 py-0.5 rounded-md text-xs font-bold bg-amber-50 text-amber-800 font-mono-num">${ex.durationMinutes} mins</span>
                        <span class="px-2.5 py-0.5 rounded-md text-xs font-bold bg-emerald-50 text-emerald-700 font-mono-num">${qCount} Qs (${qCount * 4} Marks)</span>
                        ${ex.examType === "html-omr" ? '<span class="px-2 py-0.5 rounded-md text-[11px] font-bold bg-violet-100 text-violet-800">HTML Paper + OMR</span>' : ""}
                      </div>
                      <h4 class="text-base sm:text-lg font-extrabold text-slate-900">${escapeHtml(ex.title)}</h4>

      function parseHtmlQuestionPaper(htmlString) {
        const parser = new DOMParser();
        const docObj = parser.parseFromString(htmlString, "text/html");
        const blocks = docObj.querySelectorAll(".mcq-item, .question");
        const parsed = [];
        const letterMap = { A: 0, B: 1, C: 2, D: 3, "0": 0, "1": 1, "2": 2, "3": 3 };

        blocks.forEach((block, i) => {
          const textEl = block.querySelector(".mcq-q, .question-text, .q-text, h3, h4, p");
          const text = textEl ? textEl.textContent.trim() : "";
          const optEls = block.querySelectorAll(".mcq-opt, .option, li");
          const options = Array.from(optEls).slice(0, 4).map(el => el.textContent.replace(/^[A-D][\.\)\s]+/, "").trim());
          const rawAns = (block.getAttribute("data-answer") || "A").trim().toUpperCase();
          const correctIndex = letterMap[rawAns] !== undefined ? letterMap[rawAns] : 0;
          const expEl = block.querySelector(".mcq-exp, .explanation");
          const explanation = expEl ? expEl.textContent.replace(/^Explanation:\s*/i, "").trim() : "";

          if (text && options.length >= 2) {
            while (options.length < 4) options.push("-");
            parsed.push({
              id: "html-q-" + Date.now() + "-" + i,
              text: text,
              options: options,
              correctIndex: correctIndex,
              explanation: explanation
            });
          }
        });
        return parsed;
      }
