<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#4f46e5" />
  <title>EduMaster Academic &amp; MCQ Exam Portal</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
        },
      },
    };
  </script>

  <style>
    /* Rock-Solid Flex Column App Shell for Android WebView, iOS & Desktop */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f8fafc;
      color: #0f172a;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    #app {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .scroll-body {
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
      touch-action: pan-y;
    }

    .font-mono-code {
      font-family: 'JetBrains Mono', monospace;
    }

    .safe-top {
      padding-top: max(14px, env(safe-area-inset-top));
    }

    .safe-bottom {
      padding-bottom: max(20px, env(safe-area-inset-bottom));
    }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 999px; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="modal-root"></div>
  <div id="toast-container" class="fixed top-16 left-4 right-4 sm:left-auto sm:right-5 z-[90] flex flex-col gap-2 sm:max-w-sm pointer-events-none"></div>

  <script>
    (function () {
      "use strict";

      // =======================================================================
      // 1. CLOUD DATABASE & MASTER CONFIG
      // =======================================================================
      const CLOUD_API_URL = "https://script.google.com/macros/s/AKfycbxToVwIQd2XfDVLdeJ9yhukMdPGLvW85nn4HKa0P7S39QRNRv-59ZVoaBjVYgP-ijw6/exec";
      const MASTER_PIN = "1243";

      const CACHE_KEY = "edumaster_cloud_cache_v3";
      const SESSION_KEY = "edumaster_student_session_v2";
      const RESUME_KEY = "edumaster_exam_resume_v2";
      const COMPLETED_KEY = "edumaster_completed_chapters_v2";

      const LETTERS = ["A", "B", "C", "D"];

      // =======================================================================
      // 2. APPLICATION STATE
      // =======================================================================
      const state = {
        db: {
          classes: [],
          chapters: [],
          exams: [],
          results: [],
          retakePermissions: {} // { "examId::normalizedStudentName": timestampMs }
        },
        syncStatus: "syncing", // 'synced' | 'syncing' | 'offline'
        student: null, // { name, classId, className, loggedInAt }
        completedChapters: {}, // { chapterId: true }

        // Navigation & Views
        view: "login", // 'login' | 'home' | 'note' | 'exam' | 'results' | 'master'
        homeTab: "chapters", // 'chapters' | 'exams'
        homeSubjectFilter: "All",
        homeSearch: "",

        // Active Note Reader
        activeChapterId: null,

        // Active Timed Exam
        activeExam: null, // { examId, currentIndex, answers: {}, flagged: {}, timeLeft, totalSeconds, startedAt }
        examTimerId: null,
        paletteOpen: false,

        // Post-Exam Results
        lastResult: null,

        // Master Panel
        masterAuthed: false,
        masterTab: "classes", // 'classes' | 'chapters' | 'exams' | 'results'
        masterClassFilter: "all",
        masterResultClassFilter: "all",
        masterResultExamFilter: "all"
      };

      // =======================================================================
      // 3. UTILITIES
      // =======================================================================
      function escapeHtml(str) {
        if (str === null || str === undefined) return "";
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function uid(prefix) {
        return (prefix || "id") + "_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 7);
      }

      function formatTime(sec) {
        const s = Math.max(0, Math.floor(Number(sec) || 0));
        const m = Math.floor(s / 60);
        const r = s % 60;
        return String(m).padStart(2, "0") + ":" + String(r).padStart(2, "0");
      }

      function showToast(message, type) {
        const container = document.getElementById("toast-container");
        if (!container) return;
        const styles = {
          success: "bg-emerald-600 text-white border-emerald-700",
          error: "bg-rose-600 text-white border-rose-700",
          warning: "bg-amber-500 text-slate-950 border-amber-600",
          info: "bg-slate-900 text-white border-slate-800"
        };
        const el = document.createElement("div");
        el.className = "pointer-events-auto px-4 py-3 rounded-2xl shadow-xl border text-xs sm:text-sm font-semibold " + (styles[type] || styles.info);
        el.textContent = message;
        container.appendChild(el);
        setTimeout(() => {
          el.style.opacity = "0";
          el.style.transition = "opacity 0.25s ease";
          setTimeout(() => el.remove(), 260);
        }, 2800);
      }

      function closeModal() {
        const root = document.getElementById("modal-root");
        if (root) root.innerHTML = "";
      }

      function showConfirmModal(title, message, confirmLabel, onConfirm, isDanger) {
        const root = document.getElementById("modal-root");
        if (!root) return;
        root.innerHTML = `
          <div class="fixed inset-0 z-[80] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
            <div class="bg-white rounded-3xl shadow-2xl border border-slate-200 max-w-sm w-full p-6">
              <h3 class="text-base sm:text-lg font-extrabold text-slate-900">${escapeHtml(title)}</h3>
              <p class="text-sm text-slate-600 mt-2 leading-relaxed">${escapeHtml(message)}</p>
              <div class="mt-6 flex items-center justify-end gap-2.5">
                <button id="cfm-cancel" class="px-4 py-2.5 rounded-xl text-sm font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200">Cancel</button>
                <button id="cfm-ok" class="px-5 py-2.5 rounded-xl text-sm font-bold text-white ${isDanger ? "bg-rose-600 hover:bg-rose-700" : "bg-indigo-600 hover:bg-indigo-700"}">${escapeHtml(confirmLabel)}</button>
              </div>
            </div>
          </div>
        `;
        document.getElementById("cfm-cancel").onclick = closeModal;
        document.getElementById("cfm-ok").onclick = () => {
          closeModal();
          if (onConfirm) onConfirm();
        };
      }

      // =======================================================================
      // 4. LOCAL STORAGE & CLOUD SYNC (GOOGLE DRIVE + SHEETS)
      // =======================================================================
      function loadLocalSession() {
        try {
          const raw = localStorage.getItem(SESSION_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && parsed.name && parsed.classId) {
              state.student = parsed;
            }
          }
          const comp = localStorage.getItem(COMPLETED_KEY);
          if (comp) state.completedChapters = JSON.parse(comp) || {};
        } catch (e) {}
      }

      function saveLocalSession() {
        try {
          if (state.student) {
            localStorage.setItem(SESSION_KEY, JSON.stringify(state.student));
          } else {
            localStorage.removeItem(SESSION_KEY);
          }
        } catch (e) {}
      }

      function saveCompletedChapters() {
        try {
          localStorage.setItem(COMPLETED_KEY, JSON.stringify(state.completedChapters));
        } catch (e) {}
      }

      function getSavedResume() {
        try {
          const raw = localStorage.getItem(RESUME_KEY);
          return raw ? JSON.parse(raw) : null;
        } catch (e) {
          return null;
        }
      }

      function saveExamResume(examSession) {
        try {
          if (examSession) {
            localStorage.setItem(RESUME_KEY, JSON.stringify(examSession));
          } else {
            localStorage.removeItem(RESUME_KEY);
          }
        } catch (e) {}
      }

      function loadCacheDb() {
        try {
          const raw = localStorage.getItem(CACHE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && typeof parsed === "object") {
              state.db.classes = Array.isArray(parsed.classes) ? parsed.classes : [];
              state.db.chapters = Array.isArray(parsed.chapters) ? parsed.chapters : [];
              state.db.exams = Array.isArray(parsed.exams) ? parsed.exams : [];
              state.db.results = Array.isArray(parsed.results) ? parsed.results : [];
              state.db.retakePermissions = (parsed.retakePermissions && typeof parsed.retakePermissions === "object")
                ? parsed.retakePermissions
                : {};
            }
          }
        } catch (e) {}
      }

      function saveCacheDb() {
        try {
          localStorage.setItem(CACHE_KEY, JSON.stringify(state.db));
        } catch (e) {}
      }

      function ensureDefaultClassesIfEmpty() {
        if (!Array.isArray(state.db.classes) || state.db.classes.length === 0) {
          state.db.classes = [
            { id: "class-10", name: "Class 10", mcqEnabled: false },
            { id: "class-11", name: "Class 11", mcqEnabled: true },
            { id: "class-12", name: "Class 12", mcqEnabled: true }
          ];
          saveCacheDb();
          return true;
        }
        return false;
      }

      // Smart Class Matching & Student Session Auto-Reconciliation
      function normalizeClassKey(str) {
        if (str === null || str === undefined) return "";
        let s = String(str).toLowerCase().replace(/[^a-z0-9]+/g, "");
        if (/^cls\d+/.test(s)) {
          s = "class" + s.slice(3);
        }
        return s;
      }

      function classKeysMatch(a, b) {
        const ka = normalizeClassKey(a);
        const kb = normalizeClassKey(b);
        if (!ka || !kb) return false;
        return ka === kb || ka === "class" + kb || kb === "class" + ka;
      }

      function resolveStudentClass(student, classes) {
        if (!student || !Array.isArray(classes) || classes.length === 0) return null;
        // 1. Exact ID match
        let found = classes.find(c => c.id === student.classId);
        if (found) return found;
        // 2. Exact or normalized Name match
        found = classes.find(c => c.name === student.className || classKeysMatch(c.name, student.className));
        if (found) return found;
        // 3. Normalized ID / cross-field match
        found = classes.find(c =>
          classKeysMatch(c.id, student.classId) ||
          classKeysMatch(c.id, student.className) ||
          classKeysMatch(c.name, student.classId)
        );
        return found || null;
      }

      function reconcileStudentSession() {
        if (!state.student) return;
        const matched = resolveStudentClass(state.student, state.db.classes);
        if (matched && (state.student.classId !== matched.id || state.student.className !== matched.name)) {
          state.student = {
            ...state.student,
            classId: matched.id,
            className: matched.name
          };
          saveLocalSession();
        }
      }

      function matchesStudentClass(item, student, classes) {
        if (!item || !student) return false;
        if (item.classId && student.classId && item.classId === student.classId) return true;

        const itemClassObj = Array.isArray(classes) ? classes.find(c => c.id === item.classId) : null;
        const itemClassName = item.className || (itemClassObj ? itemClassObj.name : "");

        if (itemClassName && student.className && classKeysMatch(itemClassName, student.className)) return true;
        if (item.classId && student.classId && classKeysMatch(item.classId, student.classId)) return true;
        if (item.classId && student.className && classKeysMatch(item.classId, student.className)) return true;
        if (itemClassName && student.classId && classKeysMatch(itemClassName, student.classId)) return true;

        return false;
      }

      // Exam Retake Lock & Master Permission Helpers
      function normalizeStudentName(name) {
        return String(name || "").trim().toLowerCase().replace(/\s+/g, " ");
      }

      function getRetakeKey(examId, studentName) {
        return String(examId || "") + "::" + normalizeStudentName(studentName);
      }

      function getExamAttemptStatus(examId, studentName) {
        const normName = normalizeStudentName(studentName);
        if (!examId || !normName) {
          return { locked: false, hasSubmitted: false, retakeAllowed: false, latestResult: null, latestTime: 0, permittedAt: 0 };
        }

        let latestTime = 0;
        let latestResult = null;
        (state.db.results || []).forEach(r => {
          if (r && r.examId === examId && normalizeStudentName(r.studentName) === normName) {
            const t = r.submittedAt ? Date.parse(r.submittedAt) : 1;
            const safeT = Number.isFinite(t) ? t : 1;
            if (!latestResult || safeT >= latestTime) {
              latestTime = safeT;
              latestResult = r;
            }
          }
        });

        const hasSubmitted = !!latestResult;
        const key = getRetakeKey(examId, studentName);
        const permittedAt = Number((state.db.retakePermissions && state.db.retakePermissions[key]) || 0);
        const retakeAllowed = hasSubmitted && permittedAt > latestTime;
        const locked = hasSubmitted && !retakeAllowed;

        return { locked, hasSubmitted, retakeAllowed, latestResult, latestTime, permittedAt };
      }

      async function syncFromCloud(showNotification) {
        state.syncStatus = "syncing";
        updateSyncBadge();
        try {
          const resp = await fetch(CLOUD_API_URL + "?t=" + Date.now(), {
            method: "GET",
            cache: "no-store"
          });
          if (!resp.ok) throw new Error("HTTP " + resp.status);
          const data = await resp.json();
          if (data && typeof data === "object") {
            state.db.classes = Array.isArray(data.classes) ? data.classes : [];
            state.db.chapters = Array.isArray(data.chapters) ? data.chapters : [];
            state.db.exams = Array.isArray(data.exams) ? data.exams : [];
            state.db.results = Array.isArray(data.results) ? data.results : [];
            state.db.retakePermissions = (data.retakePermissions && typeof data.retakePermissions === "object")
              ? data.retakePermissions
              : {};

            const seeded = ensureDefaultClassesIfEmpty();
            saveCacheDb();
            reconcileStudentSession();
            if (seeded) {
              await pushAllToCloud(true);
            }
          }
          state.syncStatus = "synced";
          if (showNotification) showToast("Synced with cloud database.", "success");
        } catch (err) {
          ensureDefaultClassesIfEmpty();
          reconcileStudentSession();
          state.syncStatus = "offline";
          if (showNotification) showToast("Using offline cache. Check internet connection.", "warning");
        }
        render();
      }

      async function pushAllToCloud(silent) {
        saveCacheDb();
        state.syncStatus = "syncing";
        updateSyncBadge();
        try {
          const resp = await fetch(CLOUD_API_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ action: "saveAll", data: state.db })
          });
          if (!resp.ok) throw new Error("HTTP " + resp.status);
          state.syncStatus = "synced";
          updateSyncBadge();
          if (!silent) showToast("Saved to cloud database!", "success");
        } catch (err) {
          state.syncStatus = "offline";
          updateSyncBadge();
          if (!silent) showToast("Saved locally. Cloud sync failed.", "warning");
        }
      }

      async function pushResultToCloud(resultObj) {
        state.db.results.unshift(resultObj);
        saveCacheDb();
        try {
          await fetch(CLOUD_API_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ action: "addResult", result: resultObj })
          });
          state.syncStatus = "synced";
          updateSyncBadge();
        } catch (err) {
          state.syncStatus = "offline";
          updateSyncBadge();
        }
      }

      function updateSyncBadge() {
        const badge = document.getElementById("sync-status-badge");
        if (!badge) return;
        if (state.syncStatus === "synced") {
          badge.className = "inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-50 text-emerald-700 border border-emerald-200";
          badge.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>Synced';
        } else if (state.syncStatus === "syncing") {
          badge.className = "inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-50 text-amber-700 border border-amber-200";
          badge.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-amber-500 animate-pulse"></span>Syncing';
        } else {
          badge.className = "inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-bold bg-slate-100 text-slate-600 border border-slate-200";
          badge.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-slate-400"></span>Offline';
        }
      }

      // =======================================================================
      // 5. HASH ROUTING & ANDROID BACK-BUTTON HANDLING
      // =======================================================================
      function navigateToHash(hash) {
        const normalized = hash.startsWith("#") ? hash : "#" + hash;
        if (window.location.hash !== normalized) {
          window.location.hash = normalized;
        } else {
          applyRouteFromHash();
        }
      }

      function pauseAndSaveActiveExam(silent) {
        if (!state.activeExam) return;
        stopExamTimer();
        saveExamResume({
          ...state.activeExam,
          studentName: state.student ? state.student.name : "",
          classId: state.student ? state.student.classId : "",
          savedAt: Date.now()
        });
        state.activeExam = null;
        state.paletteOpen = false;
        if (!silent) showToast("Exam paused & saved. You can resume anytime.", "info");
      }

      function applyRouteFromHash() {
        const rawHash = (window.location.hash || "").replace(/^#/, "");
        const parts = rawHash.split("/");
        const route = parts[0] || "";
        const param = parts.slice(1).join("/");

        // If user navigated away from an active exam via Back button, pause & save it
        if (state.view === "exam" && route !== "exam" && state.activeExam) {
          pauseAndSaveActiveExam(false);
        }

        closeModal();
        state.paletteOpen = false;

        if (route === "master") {
          if (state.masterAuthed) {
            state.view = "master";
            render();
            return;
          } else {
            // Redirect back to home or login if not authenticated
            state.view = state.student ? "home" : "login";
            if (state.student) window.location.replace("#home");
            else window.location.replace("#login");
            render();
            return;
          }
        }

        if (!state.student) {
          state.view = "login";
          render();
          return;
        }

        if (route === "note" && param) {
          const ch = state.db.chapters.find(c => c.id === param);
          if (ch) {
            state.activeChapterId = ch.id;
            state.view = "note";
            render();
            return;
          }
        }

        if (route === "exam" && param) {
          const exam = state.db.exams.find(e => e.id === param);
          if (exam) {
            const attemptStatus = getExamAttemptStatus(exam.id, state.student.name);
            if (attemptStatus.locked) {
              const saved = getSavedResume();
              if (saved && saved.examId === exam.id) saveExamResume(null);
              showToast("You have already submitted this exam. Ask Master for retake permission.", "warning");
              state.view = "home";
              try { history.replaceState(null, "", "#home"); } catch (e) {}
              render();
              return;
            }
            if (!state.activeExam || state.activeExam.examId !== exam.id) {
              initExamSession(exam);
            }
            state.view = "exam";
            render();
            startExamTimer();
            return;
          }
        }

        if (route === "results" && state.lastResult) {
          state.view = "results";
          render();
          return;
        }

        // Default to Home when logged in
        state.view = "home";
        if (window.location.hash !== "#home") {
          try {
            history.replaceState(null, "", "#home");
          } catch (e) {}
        }
        render();
      }

      window.addEventListener("hashchange", applyRouteFromHash);

      // Expose global hook for native Android Studio WebView wrappers
      window.handleAndroidBack = function () {
        if (document.getElementById("modal-root") && document.getElementById("modal-root").innerHTML.trim() !== "") {
          closeModal();
          return true;
        }
        if (state.paletteOpen) {
          state.paletteOpen = false;
          render();
          return true;
        }
        if (state.view === "note" || state.view === "exam" || state.view === "results" || state.view === "master") {
          if (state.view === "exam") {
            pauseAndSaveActiveExam(false);
          }
          if (state.view === "master") {
            state.masterAuthed = false;
          }
          navigateToHash(state.student ? "#home" : "#login");
          return true;
        }
        return false;
      };

      // Auto-save active exam if app goes to background or page hides
      function autoSaveExamOnBackground() {
        if (state.view === "exam" && state.activeExam) {
          saveExamResume({
            ...state.activeExam,
            studentName: state.student ? state.student.name : "",
            classId: state.student ? state.student.classId : "",
            savedAt: Date.now()
          });
        }
      }

      document.addEventListener("visibilitychange", () => {
        if (document.hidden) autoSaveExamOnBackground();
      });
      window.addEventListener("pagehide", autoSaveExamOnBackground);

      // =======================================================================
      // 6. EXAM ENGINE (+4 / -1 / 0 MARKING, TIMER, RESUME)
      // =======================================================================
      function stopExamTimer() {
        if (state.examTimerId) {
          clearInterval(state.examTimerId);
          state.examTimerId = null;
        }
      }

      function initExamSession(exam) {
        const saved = getSavedResume();
        if (saved && saved.examId === exam.id && state.student && saved.classId === state.student.classId) {
          state.activeExam = {
            examId: exam.id,
            currentIndex: Math.min(saved.currentIndex || 0, Math.max(0, (exam.questions || []).length - 1)),
            answers: saved.answers || {},
            flagged: saved.flagged || {},
            timeLeft: typeof saved.timeLeft === "number" ? saved.timeLeft : (Number(exam.durationMins) || 15) * 60,
            totalSeconds: (Number(exam.durationMins) || 15) * 60,
            startedAt: saved.startedAt || Date.now()
          };
        } else {
          const totalSec = (Number(exam.durationMins) || 15) * 60;
          state.activeExam = {
            examId: exam.id,
            currentIndex: 0,
            answers: {},
            flagged: {},
            timeLeft: totalSec,
            totalSeconds: totalSec,
            startedAt: Date.now()
          };
        }
      }

      function startExamTimer() {
        stopExamTimer();
        state.examTimerId = setInterval(() => {
          if (!state.activeExam || state.view !== "exam") {
            stopExamTimer();
            return;
          }
          state.activeExam.timeLeft = Math.max(0, state.activeExam.timeLeft - 1);
          const timerEl = document.getElementById("exam-timer-display");
          if (timerEl) {
            timerEl.textContent = formatTime(state.activeExam.timeLeft);
            if (state.activeExam.timeLeft <= 60) {
              timerEl.classList.add("text-rose-300", "animate-pulse");
            }
          }
          if (state.activeExam.timeLeft <= 0) {
            stopExamTimer();
            showToast("Time is up! Auto-submitting your exam...", "warning");
            submitActiveExam();
          }
        }, 1000);

      async function submitActiveExam() {
        if (!state.activeExam) return;
        stopExamTimer();
        const exam = state.db.exams.find(e => e.id === state.activeExam.examId);
        if (!exam) return;

        const questions = Array.isArray(exam.questions) ? exam.questions : [];
        let correct = 0;
        let wrong = 0;
        let unattempted = 0;

        const breakdown = questions.map((q, idx) => {
          const selected = state.activeExam.answers[idx];
          const isAttempted = selected !== undefined && selected !== null;
          const isCorrect = isAttempted && Number(selected) === Number(q.correctIndex);
          if (!isAttempted) unattempted++;
          else if (isCorrect) correct++;
          else wrong++;
          return {
            index: idx,
            text: q.text,
            options: q.options || ["", "", "", ""],
            correctIndex: Number(q.correctIndex) || 0,
            selectedIndex: isAttempted ? Number(selected) : null,
            explanation: q.explanation || "",
            status: !isAttempted ? "skipped" : (isCorrect ? "correct" : "wrong")
          };
        });

        const score = (correct * 4) - (wrong * 1);
        const maxMarks = questions.length * 4;
        const attempted = correct + wrong;
        const accuracy = attempted > 0 ? Math.round((correct / attempted) * 100) : 0;

        const stuName = state.student ? state.student.name : "Student";
        const retakeKey = getRetakeKey(exam.id, stuName);
        const prevPermittedAt = Number((state.db.retakePermissions && state.db.retakePermissions[retakeKey]) || 0);
        const submittedAtMs = Math.max(Date.now(), prevPermittedAt + 1000);

        const resultObj = {
          id: uid("res"),
          studentName: stuName,
          classId: state.student ? state.student.classId : exam.classId,
          className: state.student ? state.student.className : "",
          examId: exam.id,
          examTitle: exam.title,
          subject: exam.subject || "",
          score,
          maxMarks,
          correct,
          wrong,
          unattempted,
          accuracy,
          submittedAt: new Date(submittedAtMs).toISOString(),
          breakdown
        };

        state.lastResult = resultObj;
        state.activeExam = null;
        state.paletteOpen = false;
        saveExamResume(null);

        // Push result to Google Sheet + Drive
        pushResultToCloud(resultObj);

        navigateToHash("#results");
      }

      // =======================================================================
      // 7. AUTO-RESIZING SANDBOXED IFRAME FOR UPLOADED HTML NOTES / PAPERS
      // =======================================================================
      function buildResponsiveHtmlDoc(rawHtml) {
        const cleanCss = `
          <style>
            html, body {
              margin: 0 !important;
              padding: 0 !important;
              overflow: hidden !important;
              background: transparent !important;
              max-width: 100% !important;
              word-wrap: break-word !important;
              overflow-wrap: break-word !important;
            }
            img, table, pre, svg, iframe {
              max-width: 100% !important;
              height: auto !important;
            }
            table { display: block; overflow-x: auto; }
          </style>
        `;
        if (/<\/head>/i.test(rawHtml)) {
          return rawHtml.replace(/<\/head>/i, cleanCss + "</head>");
        }
        return "<!DOCTYPE html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1.0'>" + cleanCss + "</head><body>" + rawHtml + "</body></html>";
      }

      function attachAutoResizeIframe(iframeId) {
        const iframe = document.getElementById(iframeId);
        if (!iframe) return;

        const resize = () => {
          try {
            const doc = iframe.contentDocument || (iframe.contentWindow && iframe.contentWindow.document);
            if (!doc || !doc.body) return;
            const h = Math.max(
              doc.body.scrollHeight || 0,
              doc.documentElement ? doc.documentElement.scrollHeight : 0,
              240
            );
            iframe.style.height = (h + 24) + "px";
          } catch (e) {}
        };

        iframe.addEventListener("load", () => {
          resize();
          try {
            const doc = iframe.contentDocument;
            if (doc) {
              doc.querySelectorAll("img").forEach(img => {
                if (!img.complete) img.addEventListener("load", resize);
              });
              if (window.ResizeObserver && doc.body) {
                const ro = new ResizeObserver(resize);
                ro.observe(doc.body);
              }
            }
          } catch (e) {}
          setTimeout(resize, 250);
          setTimeout(resize, 800);
        });
      }

      // =======================================================================
      // 8. HTML QUESTION PAPER PARSER (.mcq-item)
      // =======================================================================
      function parseMcqHtmlDocument(htmlString) {
        const parser = new DOMParser();
        const doc = parser.parseFromString(htmlString, "text/html");
        const blocks = doc.querySelectorAll(".mcq-item, .question");
        const letterMap = { A: 0, B: 1, C: 2, D: 3, "0": 0, "1": 1, "2": 2, "3": 3 };
        const parsed = [];

        blocks.forEach((b, idx) => {
          const qEl = b.querySelector(".mcq-q, .question-text, h3, h4, p");
          const optEls = b.querySelectorAll(".mcq-opt, .option, li");
          const expEl = b.querySelector(".mcq-exp, .explanation");
          const rawAns = (b.getAttribute("data-answer") || "0").trim().toUpperCase();
          const qText = qEl ? qEl.textContent.trim() : "";
          const opts = Array.from(optEls).slice(0, 4).map(el =>
            el.textContent.replace(/^[A-D][\.\)\s]+/, "").trim()
          );
          if (qText && opts.length >= 2) {
            while (opts.length < 4) opts.push("");
            parsed.push({
              id: uid("q" + idx),
              text: qText,
              options: opts,
              correctIndex: letterMap[rawAns] !== undefined ? letterMap[rawAns] : 0,
              explanation: expEl ? expEl.textContent.replace(/^Explanation:\s*/i, "").trim() : ""
            });
          }
        });
        return parsed;
      }

                                  ? "Submitted (Master Permission Needed)"
                                  : isRetake
                                    ? "Retake Timed Exam &rarr;"
                                    : "Start Timed Exam &rarr;"}
                            </button>
                          </div>
                        `;
                      }).join("")}
                    </div>
                  `}
                `}

              </div>
            </main>
          </div>
        `;
      }

      // -----------------------------------------------------------------------

          return "";

        return `

      // -----------------------------------------------------------------------
      // VIEW D: TIMED MCQ EXAM RUNNER (FIXED BOTTOM BAR FOR PREV / PALETTE / NEXT)
      // -----------------------------------------------------------------------
      function renderExamRunnerView() {
        const session = state.activeExam;
        if (!session) return "";
        const exam = state.db.exams.find(e => e.id === session.examId);
        if (!exam) return "";

        const questions = exam.questions || [];
        const total = questions.length;
        const idx = Math.min(session.currentIndex, Math.max(0, total - 1));
        const q = questions[idx];
        const selected = session.answers[idx];
        const isFlagged = !!session.flagged[idx];
        const answeredCount = Object.keys(session.answers).length;

        return `
          <div class="h-full flex flex-col overflow-hidden bg-slate-50">
            <!-- Fixed Top Header -->
            <header class="flex-shrink-0 safe-top bg-white border-b border-slate-200 px-3 sm:px-4 pb-2.5 shadow-sm">
              <div class="max-w-4xl mx-auto flex items-center justify-between gap-2">
                <button onclick="window.portal.pauseAndGoHome()"
                  class="px-3 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-bold shrink-0">
                  &larr; Home
                </button>

                <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-slate-900 text-white font-mono-code text-sm font-bold shadow-sm">
                  <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                  </svg>
                  <span id="exam-timer-display">${formatTime(session.timeLeft)}</span>
                </div>

                <button onclick="window.portal.confirmSubmitExam()"
                  class="px-3.5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-extrabold shadow-sm shrink-0">
                  Submit
                </button>
              </div>

              <div class="max-w-4xl mx-auto mt-2 pt-1.5 border-t border-slate-100 flex items-center justify-between text-[11px] font-bold">
                <span class="text-slate-600 truncate">${escapeHtml(state.student.name)} (${escapeHtml(state.student.className)})</span>
                <span class="shrink-0"><span class="text-emerald-600">+4</span> / <span class="text-rose-600">-1</span></span>
              </div>
            </header>

            <!-- Scrollable Middle Body (Long questions scroll freely above the fixed bottom bar) -->
            <main class="flex-1 min-h-0 overflow-y-auto overflow-x-hidden scroll-body px-4 py-4 pb-10">
              <div class="max-w-3xl mx-auto space-y-4">
                ${exam.htmlPaper && exam.htmlPaper.trim() ? `
                  <div class="bg-white rounded-3xl border border-slate-200 p-3 shadow-sm">
                    <iframe id="exam-paper-iframe" sandbox="allow-same-origin" scrolling="no"
                      srcdoc="${escapeHtml(buildResponsiveHtmlDoc(exam.htmlPaper))}"
                      class="w-full border-0 block" style="min-height: 240px;"></iframe>
                  </div>
                ` : ""}

                ${q ? `
                  <div class="bg-white rounded-3xl border border-slate-200 p-5 sm:p-6 shadow-sm space-y-5">
                    <div class="flex items-center justify-between gap-2">
                      <span class="text-xs font-extrabold uppercase tracking-wider text-indigo-600 font-mono-code">Question ${idx + 1} / ${total}</span>
                      <button onclick="window.portal.toggleFlag(${idx})"
                        class="px-3 py-1.5 rounded-xl text-xs font-bold border transition ${isFlagged ? "bg-amber-100 border-amber-300 text-amber-900" : "bg-white border-slate-200 text-slate-600"}">
                        ${isFlagged ? "Flagged ★" : "Flag"}
                      </button>
                    </div>

                    <h2 class="text-base sm:text-lg font-bold text-slate-900 leading-relaxed whitespace-pre-line">${escapeHtml(q.text)}</h2>

                    <div class="space-y-2.5">
                      ${(q.options || ["", "", "", ""]).slice(0, 4).map((opt, oIdx) => {
                        const isSel = selected === oIdx;
                        return `
                          <button onclick="window.portal.selectOption(${idx}, ${oIdx})"
                            class="w-full text-left p-3.5 sm:p-4 rounded-2xl border-2 transition flex items-start gap-3 ${isSel ? "border-indigo-600 bg-indigo-50/70" : "border-slate-200 bg-white hover:border-slate-300"}">
                            <span class="w-7 h-7 rounded-lg flex items-center justify-center text-xs font-extrabold shrink-0 ${isSel ? "bg-indigo-600 text-white" : "bg-slate-100 text-slate-700"}">${LETTERS[oIdx]}</span>
                            <span class="text-sm sm:text-base font-medium text-slate-800 leading-snug pt-0.5">${escapeHtml(opt || "Option " + LETTERS[oIdx])}</span>
                          </button>
                        `;
                      }).join("")}
                    </div>

                    ${selected !== undefined ? `
                      <div class="pt-1 flex justify-end">
                        <button onclick="window.portal.clearOption(${idx})" class="text-xs font-bold text-slate-500 hover:text-rose-600">
                          Clear Response
                        </button>
                      </div>
                    ` : ""}
                  </div>
                ` : ""}
              </div>
            </main>

            <!-- Fixed Bottom Navigation Bar (ALWAYS visible above Android nav bar) -->
            <footer class="flex-shrink-0 safe-bottom bg-white border-t border-slate-200 px-3 sm:px-4 pt-3 shadow-[0_-4px_16px_rgba(15,23,42,0.06)]">
              <div class="max-w-3xl mx-auto grid grid-cols-3 gap-2 items-center">
                <button onclick="window.portal.goToQuestion(${idx - 1})" ${idx === 0 ? "disabled" : ""}
                  class="py-3 px-3 rounded-xl text-xs sm:text-sm font-bold border transition ${idx === 0 ? "bg-slate-50 border-slate-200 text-slate-300 cursor-not-allowed" : "bg-white border-slate-300 text-slate-800 hover:bg-slate-50"}">
                  &larr; Prev
                </button>

                <button onclick="window.portal.togglePalette()"
                  class="py-3 px-2 rounded-xl text-xs sm:text-sm font-extrabold bg-slate-900 hover:bg-slate-800 text-white text-center truncate shadow-sm">
                  Palette (${answeredCount}/${total})
                </button>

                ${idx < total - 1 ? `
                  <button onclick="window.portal.goToQuestion(${idx + 1})"
                    class="py-3 px-3 rounded-xl text-xs sm:text-sm font-bold bg-indigo-600 hover:bg-indigo-700 text-white shadow-sm">
                    Next &rarr;
                  </button>
                ` : `
                  <button onclick="window.portal.confirmSubmitExam()"
                    class="py-3 px-3 rounded-xl text-xs sm:text-sm font-extrabold bg-emerald-600 hover:bg-emerald-700 text-white shadow-sm">
                    Finish &rarr;
                  </button>
                `}
              </div>
            </footer>

            <!-- Slide-Up Question Palette Drawer -->
            ${state.paletteOpen ? `
              <div class="fixed inset-0 z-[70] bg-slate-900/50 backdrop-blur-xs flex flex-col justify-end" onclick="window.portal.togglePalette()">
                <div class="bg-white rounded-t-3xl p-5 safe-bottom max-h-[75vh] flex flex-col" onclick="event.stopPropagation()">
                  <div class="flex items-center justify-between pb-3 border-b border-slate-100">
                    <div>
                      <h3 class="text-sm font-extrabold text-slate-900">Question Palette</h3>
                      <p class="text-[11px] text-slate-500">${answeredCount} of ${total} Answered</p>
                    </div>
                    <button onclick="window.portal.togglePalette()" class="px-3 py-1.5 rounded-xl bg-slate-100 text-xs font-bold text-slate-700">Close</button>
                  </div>
                  <div class="flex-1 min-h-0 overflow-y-auto scroll-body py-4">
                    <div class="grid grid-cols-5 sm:grid-cols-8 gap-2">
                      ${questions.map((_, qIdx) => {
                        const ans = session.answers[qIdx] !== undefined;
                        const flg = !!session.flagged[qIdx];
                        const cur = qIdx === idx;
                        let cls = "bg-slate-100 text-slate-700 border-slate-200";
                        if (flg) cls = "bg-amber-100 text-amber-900 border-amber-400";
                        else if (ans) cls = "bg-emerald-600 text-white border-emerald-600";
                        return `
                          <button onclick="window.portal.jumpToQuestion(${qIdx})"
                            class="h-11 rounded-xl border-2 text-xs font-extrabold transition ${cls} ${cur ? "ring-2 ring-indigo-500 ring-offset-1" : ""}">
                            ${qIdx + 1}
                          </button>
                        `;
                      }).join("")}
                    </div>
                  </div>
                </div>
              </div>
            ` : ""}
          </div>
        `;
      }

      // -----------------------------------------------------------------------
      // VIEW E: POST-EXAM RESULTS & QUESTION-BY-QUESTION REVIEW
      // -----------------------------------------------------------------------
      function renderResultsView() {
        const res = state.lastResult;
        if (!res) {
          navigateToHash("#home");
          return "";
        }
        return `
          <div class="h-full flex flex-col overflow-hidden bg-slate-50">
            <!-- Fixed Top Header -->
            <header class="flex-shrink-0 safe-top bg-white border-b border-slate-200 px-4 pb-3 flex items-center justify-between gap-2 shadow-sm">
              <h1 class="text-sm sm:text-base font-extrabold text-slate-900 truncate">Exam Result</h1>
              <button onclick="window.portal.goHome()"
                class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold shrink-0">

            </header>

            <!-- Scrollable Middle Body -->
            <main class="flex-1 min-h-0 overflow-y-auto overflow-x-hidden scroll-body px-4 py-5 pb-24">
              <div class="max-w-3xl mx-auto space-y-5">
                <!-- Score Summary Card -->
                <div class="bg-slate-900 text-white rounded-3xl p-6 shadow-lg">
                  <p class="text-xs font-bold text-indigo-300 uppercase tracking-wider">${escapeHtml(res.studentName)} &bull; ${escapeHtml(res.className)}</p>
                  <h2 class="text-lg sm:text-xl font-extrabold mt-1">${escapeHtml(res.examTitle)}</h2>

                  <div class="mt-5 grid grid-cols-2 sm:grid-cols-4 gap-3">
                    <div class="bg-white/10 rounded-2xl p-3.5 text-center">
                      <div class="text-2xl font-extrabold font-mono-code">${res.score}<span class="text-sm text-slate-300">/${res.maxMarks}</span></div>
                      <div class="text-[11px] font-semibold text-slate-300 mt-0.5">Total Score</div>
                    </div>
                    <div class="bg-emerald-500/20 rounded-2xl p-3.5 text-center">
                      <div class="text-2xl font-extrabold font-mono-code text-emerald-300">${res.correct}</div>
                      <div class="text-[11px] font-semibold text-emerald-200 mt-0.5">Correct (+4)</div>
                    </div>
                    <div class="bg-rose-500/20 rounded-2xl p-3.5 text-center">
                      <div class="text-2xl font-extrabold font-mono-code text-rose-300">${res.wrong}</div>
                      <div class="text-[11px] font-semibold text-rose-200 mt-0.5">Wrong (-1)</div>
                    </div>
                    <div class="bg-white/10 rounded-2xl p-3.5 text-center">
                      <div class="text-2xl font-extrabold font-mono-code">${res.accuracy}%</div>
                      <div class="text-[11px] font-semibold text-slate-300 mt-0.5">Accuracy</div>
                    </div>
                  </div>
                </div>

                <!-- Question-by-Question Review -->
                <div class="space-y-3">
                  <h3 class="text-sm font-extrabold text-slate-900">Detailed Review (${res.breakdown.length} Questions)</h3>
                  ${res.breakdown.map(item => {
                    const badge = item.status === "correct"
                      ? '<span class="px-2 py-0.5 rounded-md text-[10px] font-extrabold bg-emerald-100 text-emerald-800">+4 Correct</span>'
                      : item.status === "wrong"
                      ? '<span class="px-2 py-0.5 rounded-md text-[10px] font-extrabold bg-rose-100 text-rose-800">-1 Wrong</span>'
                      : '<span class="px-2 py-0.5 rounded-md text-[10px] font-extrabold bg-slate-100 text-slate-600">0 Skipped</span>';
                    return `
                      <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm space-y-2.5">
                        <div class="flex items-center justify-between gap-2">
                          <span class="text-xs font-extrabold text-indigo-600">Q${item.index + 1}</span>
                          ${badge}
                        </div>
                        <p class="text-sm font-bold text-slate-900 leading-snug">${escapeHtml(item.text)}</p>
                        <div class="text-xs space-y-1">
                          <p class="text-emerald-700 font-bold">Correct Answer: ${LETTERS[item.correctIndex]}. ${escapeHtml(item.options[item.correctIndex] || "")}</p>
                          ${item.selectedIndex !== null && item.selectedIndex !== item.correctIndex ? `
                            <p class="text-rose-600 font-bold">Your Answer: ${LETTERS[item.selectedIndex]}. ${escapeHtml(item.options[item.selectedIndex] || "")}</p>
                          ` : ""}
                        </div>
                        ${item.explanation ? `
                          <div class="p-3 rounded-xl bg-indigo-50/70 text-xs text-indigo-950 leading-relaxed">
                            <strong>Explanation:</strong> ${escapeHtml(item.explanation)}
                          </div>
                        ` : ""}
                      </div>
                    `;
                  }).join("")}
                </div>
              </div>
            </main>
          </div>
        `;
      }

        return `

                    <label class="block text-xs font-bold text-slate-600 mb-1">Key Takeaways (one per line)</label>

                  </div>
                </div>

                <div id="ch-html-wrap" class="${mode === "html" ? "space-y-3" : "hidden"}">
                  <div class="p-4 rounded-2xl border-2 border-dashed border-indigo-200 bg-indigo-50/40 space-y-2.5">
                    <p class="text-xs font-bold text-slate-700">Upload prepared HTML Note (.html / .htm)</p>

        const switchMode = (m) => {
          mode = m;
          document.getElementById("ch-text-wrap").className = m === "text" ? "space-y-3" : "hidden";
          document.getElementById("ch-html-wrap").className = m === "html" ? "space-y-3" : "hidden";
          document.getElementById("ch-mode-text").className = "py-2 rounded-lg text-xs font-bold " + (m === "text" ? "bg-white text-indigo-700 shadow-sm" : "text-slate-600");
          document.getElementById("ch-mode-html").className = "py-2 rounded-lg text-xs font-bold " + (m === "html" ? "bg-white text-indigo-700 shadow-sm" : "text-slate-600");
        };
        document.getElementById("ch-mode-text").onclick = () => switchMode("text");
        document.getElementById("ch-mode-html").onclick = () => switchMode("html");

        document.getElementById("ch-html-file").onchange = (ev) => {
          const file = ev.target.files && ev.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => {
            uploadedHtml = String(reader.result || "");
            document.getElementById("ch-html-paste").value = uploadedHtml;
            const st = document.getElementById("ch-html-status");
            st.className = "text-xs font-bold text-emerald-700";
            st.textContent = 'Loaded "' + file.name + '" (' + uploadedHtml.length.toLocaleString() + " chars)";
          };
          reader.readAsText(file);
        };

        const syncPaste = (notify) => {
          const val = document.getElementById("ch-html-paste").value || "";
          uploadedHtml = val;
          const st = document.getElementById("ch-html-status");
          if (val.trim()) {
            st.className = "text-xs font-bold text-emerald-700";
            st.textContent = "Pasted HTML ready (" + val.length.toLocaleString() + " chars)";
            if (notify) showToast("Pasted HTML note loaded!", "success");
          } else {
            st.className = "text-xs font-semibold text-slate-500";
            st.textContent = "No HTML file selected yet.";
            if (notify) showToast("Please paste HTML code first.", "warning");
          }
        };
        document.getElementById("ch-html-paste").oninput = () => syncPaste(false);
        document.getElementById("btn-load-pasted-ch").onclick = () => syncPaste(true);

        document.getElementById("chapter-modal-form").onsubmit = async (e) => {
          e.preventDefault();
          const selectedClassId = document.getElementById("ch-class").value;

          const payload = {
            id: existing ? existing.id : uid("ch"),
            classId: selectedClassId,
            className: selectedClassObj ? selectedClassObj.name : "",
            subject: document.getElementById("ch-subject").value.trim() || "General",
            title: document.getElementById("ch-title").value.trim(),
            takeaways: mode === "text" ? document.getElementById("ch-takeaways").value.split(/\r?\n/).map(s => s.trim()).filter(Boolean) : [],
            content: mode === "text" ? document.getElementById("ch-content").value.trim() : "",
            htmlContent: mode === "html" ? uploadedHtml.trim() : "",
            refUrl: document.getElementById("ch-ref").value.trim()
          };
          if (mode === "html" && !payload.htmlContent) {
            showToast("Please upload or paste HTML code.", "warning");
            return;
          }
          if (existing) {
            const i = state.db.chapters.findIndex(c => c.id === existing.id);
            if (i >= 0) state.db.chapters[i] = payload;
          } else {
            state.db.chapters.unshift(payload);

          closeModal();
          render();
          await pushAllToCloud(false);
        };

                  <div class="min-w-0">
                    <h3 class="text-sm sm:text-base font-extrabold text-slate-900 truncate">${escapeHtml(exam.title)}</h3>
                    <p class="text-xs text-slate-500">${qs.length} Questions (${qs.length * 4} Marks)</p>
                  </div>
                  <button id="qm-close" class="px-3 py-1.5 rounded-xl bg-slate-100 text-xs font-bold text-slate-700">Done</button>
                </div>

                <div class="flex-1 min-h-0 overflow-y-auto overscroll-contain scroll-body p-5 space-y-5">
                  <!-- HTML Question Paper Upload + Direct Paste -->
                  <div class="p-4 rounded-2xl border-2 border-dashed border-indigo-200 bg-indigo-50/40 space-y-3">
                    <div>
                      <h4 class="text-xs font-extrabold text-slate-900">Upload HTML Question Paper (.html / .htm)</h4>
                      <p class="text-[11px] text-slate-600 mt-0.5">Auto-parses .mcq-item questions, or attaches custom HTML with OMR answer key.</p>
                    </div>
                    <input id="qm-html-file" type="file" accept="text/html,text/plain,.html,.htm,*/*"
                      class="block w-full text-xs text-slate-600 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-indigo-600 file:text-white cursor-pointer" />
                    <label class="block text-[11px] font-bold text-slate-500 text-center">&mdash; OR Paste HTML Code Directly &mdash;</label>
                    <textarea id="qm-html-paste" rows="3" placeholder="Paste MCQ HTML paper code here..."
                      class="w-full px-3 py-2 rounded-xl border border-slate-300 font-mono-code text-xs bg-white"></textarea>
                    <button type="button" id="qm-load-paste" class="w-full py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold">
                      Load &amp; Parse Pasted HTML
                    </button>
                  </div>

                  <!-- Add Single Question Manually -->
                  <form id="qm-add-form" class="p-4 rounded-2xl border border-slate-200 bg-slate-50 space-y-3">
                    <h4 class="text-xs font-extrabold text-slate-900">Add Question Manually</h4>
                    <textarea id="qm-text" rows="2" required placeholder="Question statement..."
                      class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm bg-white"></textarea>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                      <input id="qm-o0" type="text" required placeholder="Option A" class="px-3 py-2 rounded-xl border border-slate-300 text-xs bg-white" />
                      <input id="qm-o1" type="text" required placeholder="Option B" class="px-3 py-2 rounded-xl border border-slate-300 text-xs bg-white" />
                      <input id="qm-o2" type="text" required placeholder="Option C" class="px-3 py-2 rounded-xl border border-slate-300 text-xs bg-white" />
                      <input id="qm-o3" type="text" required placeholder="Option D" class="px-3 py-2 rounded-xl border border-slate-300 text-xs bg-white" />
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                      <select id="qm-ans" class="px-3 py-2 rounded-xl border border-slate-300 text-xs font-bold bg-white">
                        <option value="0">Correct: Option A</option>
                        <option value="1">Correct: Option B</option>
                        <option value="2">Correct: Option C</option>
                        <option value="3">Correct: Option D</option>
                      </select>
                      <input id="qm-exp" type="text" placeholder="Explanation (optional)" class="px-3 py-2 rounded-xl border border-slate-300 text-xs bg-white" />
                    </div>
                    <button type="submit" class="w-full py-2.5 rounded-xl bg-slate-900 text-white text-xs font-bold">+ Add Question</button>
                  </form>

                  <!-- Existing Questions List -->
                  <div class="space-y-2">
                    <h4 class="text-xs font-extrabold text-slate-900">Questions (${qs.length})</h4>
                    ${qs.map((q, i) => `
                      <div class="p-3 rounded-xl border border-slate-200 bg-white flex items-start justify-between gap-2">
                        <div class="min-w-0">
                          <p class="text-xs font-bold text-slate-900">Q${i + 1}. ${escapeHtml(q.text)}</p>
                          <p class="text-[11px] font-semibold text-emerald-700 mt-0.5">Ans: ${LETTERS[q.correctIndex]}. ${escapeHtml((q.options || [])[q.correctIndex] || "")}</p>
                        </div>
                        <button type="button" data-del-q="${i}" class="px-2.5 py-1 rounded-lg bg-rose-50 text-rose-600 text-[11px] font-bold shrink-0">Del</button>
                      </div>
                    `).join("")}
                  </div>
                </div>
              </div>
            </div>
          `;

          document.getElementById("qm-close").onclick = () => {
            closeModal();
            render();
          };

          const handleHtmlInput = async (rawHtml) => {
            if (!rawHtml.trim()) {
              showToast("Please provide HTML code.", "warning");
              return;
            }
            const parsed = parseMcqHtmlDocument(rawHtml);
            if (parsed.length > 0) {
              exam.questions = (exam.questions || []).concat(parsed);
              await pushAllToCloud(true);
              showToast("Imported " + parsed.length + " MCQ(s) from HTML!", "success");
              renderInner();
            } else {
              exam.htmlPaper = rawHtml;
              if (!exam.questions || exam.questions.length === 0) {
                exam.questions = [
                  { id: uid("q"), text: "Question 1 (Refer to HTML Paper above)", options: ["A", "B", "C", "D"], correctIndex: 0, explanation: "" }
                ];
              }
              await pushAllToCloud(true);
              showToast("Attached custom HTML paper with OMR fallback.", "info");
              renderInner();
            }
          };

          document.getElementById("qm-html-file").onchange = (ev) => {
            const file = ev.target.files && ev.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => handleHtmlInput(String(reader.result || ""));
            reader.readAsText(file);
          };

          document.getElementById("qm-load-paste").onclick = () => {
            handleHtmlInput(document.getElementById("qm-html-paste").value || "");
          };

          document.getElementById("qm-add-form").onsubmit = async (e) => {
            e.preventDefault();
            exam.questions = exam.questions || [];
            exam.questions.push({
              id: uid("q"),
              text: document.getElementById("qm-text").value.trim(),
              options: [
                document.getElementById("qm-o0").value.trim(),
                document.getElementById("qm-o1").value.trim(),
                document.getElementById("qm-o2").value.trim(),
                document.getElementById("qm-o3").value.trim()
              ],
              correctIndex: parseInt(document.getElementById("qm-ans").value, 10) || 0,
              explanation: document.getElementById("qm-exp").value.trim()
            });
            await pushAllToCloud(true);
            showToast("Question added!", "success");
            renderInner();
          };

          root.querySelectorAll("[data-del-q]").forEach(btn => {
            btn.onclick = async () => {
              const idx = parseInt(btn.getAttribute("data-del-q"), 10);
              exam.questions.splice(idx, 1);
              await pushAllToCloud(true);
              renderInner();
            };
          });
        };

        renderInner();
      }

      // =======================================================================
      // 11. PUBLIC PORTAL ACTIONS
      // =======================================================================
      window.portal = {
        manualSync() { syncFromCloud(true); },
        openMasterPinModal,
        goHome() { navigateToHash("#home"); },

        setHomeTab(tab) {
          state.homeTab = tab;
          render();
        },

        setHomeSearch(val) {
          state.homeSearch = val;
          render();
        },

        setHomeSubject(sub) {
          state.homeSubjectFilter = sub;
          render();
        },

        openChapter(id) {
          navigateToHash("#note/" + id);
        },

        toggleChapterDone(id) {
          state.completedChapters[id] = !state.completedChapters[id];
          saveCompletedChapters();
          render();
        },

        startExam(examId) {
          if (state.student && getExamAttemptStatus(examId, state.student.name).locked) {
            showToast("You have already submitted this exam. Ask Master for retake permission.", "warning");
            return;
          }
          navigateToHash("#exam/" + examId);
        },

        pauseAndGoHome() {
          pauseAndSaveActiveExam(false);
          navigateToHash("#home");
        },

        selectOption(qIdx, oIdx) {
          if (!state.activeExam) return;
          state.activeExam.answers[qIdx] = oIdx;
          render();
        },

        clearOption(qIdx) {
          if (!state.activeExam) return;
          delete state.activeExam.answers[qIdx];
          render();
        },

        toggleFlag(qIdx) {
          if (!state.activeExam) return;
          state.activeExam.flagged[qIdx] = !state.activeExam.flagged[qIdx];
          render();
        },

        goToQuestion(newIdx) {
          if (!state.activeExam) return;
          const exam = state.db.exams.find(e => e.id === state.activeExam.examId);
          const total = exam && exam.questions ? exam.questions.length : 0;
          if (newIdx >= 0 && newIdx < total) {
            state.activeExam.currentIndex = newIdx;
            render();
          }
        },

        togglePalette() {
          state.paletteOpen = !state.paletteOpen;
          render();
        },

        jumpToQuestion(qIdx) {
          if (!state.activeExam) return;
          state.activeExam.currentIndex = qIdx;
          state.paletteOpen = false;
          render();
        },

        confirmSubmitExam() {
          if (!state.activeExam) return;
          const exam = state.db.exams.find(e => e.id === state.activeExam.examId);
          const total = exam && exam.questions ? exam.questions.length : 0;
          const ans = Object.keys(state.activeExam.answers).length;
          showConfirmModal(
            "Submit Exam?",
            "You have answered " + ans + " of " + total + " questions. Once submitted, you cannot change your answers.",
            "Submit Now",
            submitActiveExam,
            false
          );
        },

        confirmLogout() {
          showConfirmModal(
            "Switch Student / Logout?",
            "You will be returned to the Student Login screen.",
            "Logout",
            () => {
              state.student = null;
              saveLocalSession();
              navigateToHash("#login");
            },
            true
          );
        },

        // --- Master Actions ---
        exitMaster() {
          state.masterAuthed = false;
          reconcileStudentSession();
          state.homeSubjectFilter = "All";
          state.homeSearch = "";
          navigateToHash(state.student ? "#home" : "#login");
        },

        setMasterTab(tab) {
          state.masterTab = tab;
          render();
        },

        setMasterClassFilter(val) {
          state.masterClassFilter = val;
          render();
        },

        setMasterResultClass(val) {
          state.masterResultClassFilter = val;
          render();
        },

        setMasterResultExam(val) {
          state.masterResultExamFilter = val;
          render();
        },

        async addClass() {
          const name = (document.getElementById("new-class-name").value || "").trim();
          const mcq = document.getElementById("new-class-mcq").checked;
          if (!name) {
            showToast("Enter a class name.", "warning");
            return;
          }
          state.db.classes.push({ id: uid("cls"), name, mcqEnabled: mcq });
          render();
          await pushAllToCloud(false);
        },

        async toggleClassMcq(id) {
          const c = state.db.classes.find(x => x.id === id);
          if (!c) return;
          c.mcqEnabled = !c.mcqEnabled;
          render();
          await pushAllToCloud(false);
        },

        deleteClass(id) {
          showConfirmModal("Delete Class?", "Remove this class from the portal?", "Delete", async () => {
            state.db.classes = state.db.classes.filter(c => c.id !== id);
            render();
            await pushAllToCloud(false);
          }, true);
        },

        openChapterModal,

        deleteChapter(id) {
          showConfirmModal("Delete Chapter?", "This chapter will be removed for all students.", "Delete", async () => {
            state.db.chapters = state.db.chapters.filter(c => c.id !== id);
            render();
            await pushAllToCloud(false);
          }, true);
        },

        openExamModal,
        openQuestionsModal,

        deleteExam(id) {
          showConfirmModal("Delete Exam?", "This exam and its questions will be removed.", "Delete", async () => {
            state.db.exams = state.db.exams.filter(e => e.id !== id);
            render();
            await pushAllToCloud(false);
          }, true);
        },

        async grantExamRetakeByResult(resultId) {
          const r = state.db.results.find(x => x.id === resultId);
          if (!r) return;
          const status = getExamAttemptStatus(r.examId, r.studentName);
          const key = getRetakeKey(r.examId, r.studentName);
          state.db.retakePermissions = state.db.retakePermissions || {};
          state.db.retakePermissions[key] = Math.max(Date.now(), status.latestTime + 1000);
          render();
          await pushAllToCloud(true);
          showToast("Retake permission granted to " + r.studentName + ".", "success");
        },

        async revokeExamRetakeByResult(resultId) {
          const r = state.db.results.find(x => x.id === resultId);
          if (!r) return;
          const key = getRetakeKey(r.examId, r.studentName);
          if (state.db.retakePermissions && state.db.retakePermissions[key]) {
            delete state.db.retakePermissions[key];
          }
          render();
          await pushAllToCloud(true);
          showToast("Exam locked again for " + r.studentName + ".", "info");
        },

        exportResultsCsv() {
          const rows = [["Date", "Student Name", "Class", "Exam", "Score", "Max Marks", "Correct", "Wrong", "Skipped"]];
          state.db.results.forEach(r => {
            rows.push([
              r.submittedAt ? new Date(r.submittedAt).toLocaleString() : "",
              r.studentName || "",
              r.className || "",
              r.examTitle || "",
              r.score,
              r.maxMarks,
              r.correct,
              r.wrong,
              r.unattempted
            ]);
          });
          const csv = rows.map(row => row.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(",")).join("\n");
          const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = "edumaster-results.csv";
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
          showToast("Exported CSV!", "success");
        }
      };

      // =======================================================================
      // 12. BOOTSTRAP
      // =======================================================================
      loadLocalSession();
      loadCacheDb();
      ensureDefaultClassesIfEmpty();
      reconcileStudentSession();

      if (state.student && (!window.location.hash || window.location.hash === "#login")) {
        try { history.replaceState(null, "", "#home"); } catch (e) {}
      }
      applyRouteFromHash();
      syncFromCloud(false);
    })();
  </script>
</body>
</html>
