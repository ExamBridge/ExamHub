    .font-mono-num {
      font-family: 'JetBrains Mono', monospace;
      font-variant-numeric: tabular-nums;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-up {
      animation: fadeUp 0.24s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .animate-slide-up {
      animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes pulseDanger {
      0%, 100% { box-shadow: 0 0 0 0 rgba(225, 29, 72, 0.45); }

    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 999px; }

    // =========================================================================
    // 3. UTILITIES & HELPERS
    // =========================================================================
    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatTime(totalSeconds) {
      const s = Math.max(0, Math.floor(totalSeconds));
      const m = Math.floor(s / 60);
      const sec = s % 60;
      return `${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
    }

    function formatDate(ts) {
      if (!ts) return 'Just now';
      return new Date(ts).toLocaleDateString('en-IN', {
        day: '2-digit',
        month: 'short',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    function makeProgressKey(studentName, className, examId) {
      const raw = `${(studentName || '').trim().toLowerCase()}__${(className || '').trim().toLowerCase()}__${examId}`;
      return raw.replace(/[^a-z0-9_-]/g, '_').slice(0, 120);
    }

    function getStudentClassObj() {
      if (!state.studentSession) return null;
      return state.classes.find(c => c.name === state.studentSession.className) || null;
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const palette = {
        success: 'bg-emerald-600 text-white border-emerald-700',
        error: 'bg-rose-600 text-white border-rose-700',
        warning: 'bg-amber-500 text-slate-950 border-amber-600',
        info: 'bg-slate-900 text-white border-slate-800'
      };
      const el = document.createElement('div');
      el.className = `pointer-events-auto px-4 py-3 rounded-2xl shadow-xl border text-sm font-semibold animate-fade-up ${palette[type] || palette.info}`;
      el.textContent = message;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transition = 'opacity 0.25s ease';
        setTimeout(() => el.remove(), 260);
      }, 3200);
    }

    function closeModal() {
      document.getElementById('modal-root').innerHTML = '';
    }

    function showConfirmModal({ title, message, confirmText = 'Confirm', confirmStyle = 'danger', onConfirm }) {
      const btnStyle = confirmStyle === 'danger'
        ? 'bg-rose-600 hover:bg-rose-700 text-white'
        : 'bg-indigo-600 hover:bg-indigo-700 text-white';
      document.getElementById('modal-root').innerHTML = `
        <div class="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fade-up">
          <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 max-w-md w-full p-6">
            <h3 class="text-lg font-bold text-slate-900">${escapeHtml(title)}</h3>
            <p class="text-sm text-slate-600 mt-2 leading-relaxed">${escapeHtml(message)}</p>
            <div class="mt-6 flex items-center justify-end gap-2.5">
              <button id="cfm-cancel" class="px-4 py-2.5 rounded-xl text-sm font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 transition">Cancel</button>
              <button id="cfm-ok" class="px-5 py-2.5 rounded-xl text-sm font-bold transition ${btnStyle}">${escapeHtml(confirmText)}</button>
            </div>
          </div>
        </div>
      `;
      document.getElementById('cfm-cancel').onclick = closeModal;
      document.getElementById('cfm-ok').onclick = () => {
        closeModal();
        if (onConfirm) onConfirm();
      };
    }

    function downloadTextFile(filename, content, mime = 'text/html;charset=utf-8') {
      const blob = new Blob([content], { type: mime });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    // =========================================================================
    // 4. HISTORY API — BROWSER BACK BUTTON INTERCEPTION
    // =========================================================================
    function pushNavState(viewName) {
      try {
        window.history.pushState({ view: viewName, ts: Date.now() }, '', '');
      } catch (e) {
        // Ignore in restricted iframe origins if pushState throws
      }
    }

    window.addEventListener('popstate', () => {
      // If a modal is open, just close it
      const modalRoot = document.getElementById('modal-root');
      if (modalRoot && modalRoot.innerHTML.trim() !== '') {
        closeModal();
        pushNavState(state.view);
        return;
      }

      // If student is inside an active exam, pause & save progress and return to Home Page
      if (state.view === 'exam-runner' && state.examSession) {
        pauseAndReturnHome(true);
        return;
      }

      // If student is in Chapter Reader or Exam Results, return cleanly to Home Page
      if (state.view === 'chapter-reader' || state.view === 'exam-result') {
        state.activeChapterId = null;
        state.lastResultView = null;
        state.view = state.studentSession ? 'student-home' : 'login';
        renderApp();
        return;
      }

      // If on Student Home, prevent accidental site exit by re-pushing home state
      if (state.view === 'student-home') {
        pushNavState('student-home');
        showToast("Use the Logout button to switch student or exit.", "info");
      }
    });

    // =========================================================================
    // 5. FIREBASE INITIALIZATION, AUTH & REAL-TIME LISTENERS
    // =========================================================================
    async function initFirebase() {
      try {
        const configStr = typeof __firebase_config !== 'undefined' ? __firebase_config : null;
        if (!configStr) throw new Error("No Firebase config; using local session mode.");
        const firebaseConfig = typeof configStr === 'string' ? JSON.parse(configStr) : configStr;
        const fbApp = initializeApp(firebaseConfig);
        auth = getAuth(fbApp);
        db = getFirestore(fbApp);

        // RULE 3: Authenticate FIRST before any Firestore query
        const initialToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
        if (initialToken) {
          const cred = await signInWithCustomToken(auth, initialToken);
          currentUser = cred.user;
        } else {
          const cred = await signInAnonymously(auth);
          currentUser = cred.user;
        }

        useCloud = true;
        await seedDatabaseIfEmpty();
        await loadPrivateSessionAndProgress();
        attachFirestoreListeners();
      } catch (err) {
        console.warn("Running in local in-memory mode:", err);
        useCloud = false;
        state.classes = structuredClone(STARTER_CLASSES);
        state.chapters = structuredClone(STARTER_CHAPTERS);
        state.exams = structuredClone(STARTER_EXAMS);
        state.results = [];
        finishLoading();
      }
    }

    async function seedDatabaseIfEmpty() {
      if (!currentUser || !db) return;
      const metaRef = doc(db, 'artifacts', appId, 'public', 'data', 'meta', 'seedV2');

      if (snap.exists()) return;

      await setDoc(metaRef, { seeded: true, seededAt: Date.now() });

      for (const cls of STARTER_CLASSES) {
        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'classes', cls.id), cls);
      }
      for (const ch of STARTER_CHAPTERS) {
        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'chapters', ch.id), ch);
      }
      for (const ex of STARTER_EXAMS) {
        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'exams', ex.id), ex);
      }
    }

    async function loadPrivateSessionAndProgress() {
      if (!currentUser || !db) return;
      try {
        const sessRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'profile', 'studentSession');
        const sessSnap = await getDoc(sessRef);
        if (sessSnap.exists() && sessSnap.data().name && sessSnap.data().className) {
          state.studentSession = {
            name: sessSnap.data().name,
            className: sessSnap.data().className
          };
          state.view = 'student-home';
        }
      } catch (e) {
        console.warn("Could not restore student session:", e);
      }
    }

    function attachFirestoreListeners() {
      if (!currentUser || !db) return;
      const flags = { classes: false, chapters: false, exams: false, results: false };
      const checkReady = () => {
        if (!state.ready && flags.classes && flags.chapters && flags.exams && flags.results) {
          finishLoading();
        } else if (state.ready) {
          // Do not interrupt active typing in modal forms; only re-render main view if no modal open
          const modalOpen = document.getElementById('modal-root')?.innerHTML.trim() !== '';
          if (!modalOpen && state.view !== 'exam-runner') {
            renderApp();
          }
        }
      };

      // 1. Classes
      onSnapshot(
        collection(db, 'artifacts', appId, 'public', 'data', 'classes'),
        (snap) => {
          state.classes = snap.docs
            .map(d => ({ id: d.id, ...d.data() }))
            .sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
          flags.classes = true;
          checkReady();
        },
        (err) => { console.error("Classes sync error:", err); }
      );

      // 2. Chapters
      onSnapshot(
        collection(db, 'artifacts', appId, 'public', 'data', 'chapters'),
        (snap) => {
          state.chapters = snap.docs
            .map(d => ({ id: d.id, ...d.data() }))
            .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
          flags.chapters = true;
          checkReady();
        },
        (err) => { console.error("Chapters sync error:", err); }
      );

      // 3. Exams
      onSnapshot(
        collection(db, 'artifacts', appId, 'public', 'data', 'exams'),
        (snap) => {
          state.exams = snap.docs
            .map(d => ({ id: d.id, ...d.data() }))
            .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
          flags.exams = true;
          checkReady();
        },
        (err) => { console.error("Exams sync error:", err); }
      );

      // 4. Results
      onSnapshot(
        collection(db, 'artifacts', appId, 'public', 'data', 'results'),
        (snap) => {
          state.results = snap.docs
            .map(d => ({ id: d.id, ...d.data() }))
            .sort((a, b) => (b.submittedAt || 0) - (a.submittedAt || 0));
          flags.results = true;
          checkReady();
        },
        (err) => { console.error("Results sync error:", err); }
      );

      // 5. Private Completed Chapters
      onSnapshot(
        doc(db, 'artifacts', appId, 'users', currentUser.uid, 'profile', 'completedChapters'),
        (snap) => {
          if (snap.exists() && Array.isArray(snap.data().ids)) {
            state.completedChapterIds = new Set(snap.data().ids);
          } else {
            state.completedChapterIds = new Set();
          }
          if (state.ready && state.view === 'student-home') renderApp();
        },
        (err) => { console.error("Completed chapters sync error:", err); }
      );

      // 6. Private Saved In-Progress Exams
      onSnapshot(
        collection(db, 'artifacts', appId, 'users', currentUser.uid, 'examProgress'),
        (snap) => {
          const map = {};
          snap.docs.forEach(d => {
            map[d.id] = d.data();
          });
          state.savedProgressMap = map;
          if (state.ready && state.view === 'student-home') renderApp();
        },
        (err) => { console.error("Exam progress sync error:", err); }
      );
    }

    function finishLoading() {
      state.ready = true;
      pushNavState(state.view);
      renderApp();
    }

    // =========================================================================
    // 6. PERSISTENCE HELPERS (FIRESTORE + LOCAL FALLBACK)
    // =========================================================================
    async function persistStudentSession(sessionObj) {
      state.studentSession = sessionObj;
      if (useCloud && currentUser) {
        const ref = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'profile', 'studentSession');
        if (sessionObj) {
          await setDoc(ref, { ...sessionObj, updatedAt: Date.now() });
        } else {
          await deleteDoc(ref);
        }
      }
    }

    async function persistExamProgress(progressKey, payload) {
      state.savedProgressMap[progressKey] = payload;
      if (useCloud && currentUser) {
        try {
          const ref = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'examProgress', progressKey);
          await setDoc(ref, payload);
        } catch (err) {
          console.warn("Progress cloud save warning:", err);
        }
      }
    }

    async function clearExamProgress(progressKey) {
      delete state.savedProgressMap[progressKey];
      if (useCloud && currentUser) {
        try {
          await deleteDoc(doc(db, 'artifacts', appId, 'users', currentUser.uid, 'examProgress', progressKey));
        } catch (err) {
          console.warn("Progress clear warning:", err);
        }
      }
    }

          ...classObj,

        state.classes.push({ id: 'cls-' + Date.now(), ...classObj, createdAt: Date.now() });

      if (useCloud && currentUser) {

    async function deleteClassFromStore(classId) {
      if (useCloud && currentUser) {
        await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'classes', classId));
      } else {
        state.classes = state.classes.filter(x => x.id !== classId);

    async function saveChapterToStore(data, editId = null) {
      if (useCloud && currentUser) {
        if (editId) {
          await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'chapters', editId), data);
        } else {
          await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'chapters'), { ...data, createdAt: Date.now() });
        }
      } else {
        if (editId) {
          const i = state.chapters.findIndex(c => c.id === editId);
          if (i !== -1) state.chapters[i] = { ...state.chapters[i], ...data };
        } else {
          state.chapters.unshift({ id: 'ch-' + Date.now(), ...data, createdAt: Date.now() });
        }
        renderApp();
      }

      if (useCloud && currentUser) {
        await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'chapters', chapterId));
      } else {
        state.chapters = state.chapters.filter(c => c.id !== chapterId);
        renderApp();
      }
    }

    async function saveExamToStore(data, editId = null) {
      if (useCloud && currentUser) {
        if (editId) {
          await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'exams', editId), data);
        } else {
          await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'exams'), {
            ...data,
            questions: data.questions || [],
            createdAt: Date.now()
          });
        }
      } else {
        if (editId) {
          const i = state.exams.findIndex(e => e.id === editId);
          if (i !== -1) state.exams[i] = { ...state.exams[i], ...data };
        } else {
          state.exams.unshift({
            id: 'ex-' + Date.now(),
            ...data,
            questions: data.questions || [],
            createdAt: Date.now()
          });
        }
        renderApp();
      }
    }

    async function updateExamQuestionsInStore(examId, questions, extraFields = {}) {
      if (useCloud && currentUser) {
        await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'exams', examId), {
          questions,
          ...extraFields
        });
      } else {
        const ex = state.exams.find(e => e.id === examId);
        if (ex) {
          ex.questions = questions;
          Object.assign(ex, extraFields);
        }
        renderApp();
      }
    }

    async function deleteExamFromStore(examId) {
      if (useCloud && currentUser) {
        await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'exams', examId));
      } else {
        state.exams = state.exams.filter(e => e.id !== examId);

    async function saveResultToStore(resultObj) {
      if (useCloud && currentUser) {
        await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'results'), resultObj);
      } else {
        state.results.unshift({ id: 'res-' + Date.now(), ...resultObj });

    async function deleteResultFromStore(resultId) {
      if (useCloud && currentUser) {
        await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'results', resultId));
      } else {
        state.results = state.results.filter(r => r.id !== resultId);

    async function toggleChapterCompleted(chapterId) {
      if (state.completedChapterIds.has(chapterId)) {
        state.completedChapterIds.delete(chapterId);
      } else {
        state.completedChapterIds.add(chapterId);
      }
      if (useCloud && currentUser) {
        await setDoc(doc(db, 'artifacts', appId, 'users', currentUser.uid, 'profile', 'completedChapters'), {
          ids: Array.from(state.completedChapterIds),
          updatedAt: Date.now()
        });
      }
      renderApp();

    // =========================================================================
    // 7. MASTER RENDER DISPATCHER
    // =========================================================================
    function renderApp() {
      const root = document.getElementById('app-root');
      if (!root) return;

      switch (state.view) {
        case 'login':
          root.innerHTML = renderLoginView();
          break;
        case 'student-home':
          root.innerHTML = renderStudentHomeView();
          break;
        case 'chapter-reader':
          root.innerHTML = renderChapterReaderView();
          break;
        case 'exam-runner':
          root.innerHTML = renderExamRunnerView();
          break;
        case 'exam-result':
          root.innerHTML = renderExamResultView();
          break;
        case 'master':
          root.innerHTML = renderMasterView();
          break;
        default:
          root.innerHTML = renderLoginView();
      }
    }

    // =========================================================================
    // 11. INTERACTIVE EXAM RUNNER (+4 / -1, RESUME, MOBILE DRAWER, HTML-OMR)
    // =========================================================================
    function clearExamTimer() {
      if (state.timerInterval) {
        clearInterval(state.timerInterval);
        state.timerInterval = null;
      }
    }

    function saveCurrentExamProgressNow() {
      const sess = state.examSession;
      if (!sess || sess.submittedResult) return;
      const payload = {
        examId: sess.exam.id,
        currentIndex: sess.currentIndex,
        answers: sess.answers,
        flaggedArr: Array.from(sess.flagged),
        remainingSeconds: sess.remainingSeconds,
        updatedAt: Date.now()
      };
      persistExamProgress(sess.progressKey, payload);
    }

    function pauseAndReturnHome(fromBackBtn = false) {
      if (state.examSession && !state.examSession.submittedResult) {
        clearExamTimer();
        saveCurrentExamProgressNow();
        state.examSession = null;
        state.mobilePaletteOpen = false;
        state.view = 'student-home';
        renderApp();
        showToast(
          fromBackBtn
            ? "Exam paused & progress saved. You can resume anytime."
            : "Progress saved! Timer paused where you stopped.",
          "info"
        );
      } else {
        state.view = 'student-home';
        renderApp();
      }
    }

    function startOrResumeExam(examId) {
      if (!state.studentSession) return;
      const clsObj = getStudentClassObj();
      if (clsObj && !clsObj.allowMcq) {
        showToast("MCQ Exams are not enabled for your class.", "warning");
        return;
      }
      const exam = state.exams.find(e => e.id === examId);
      if (!exam || !exam.questions || exam.questions.length === 0) {
        showToast("This exam has no questions yet.", "error");
        return;
      }

      clearExamTimer();
      const { name, className } = state.studentSession;
      const progressKey = makeProgressKey(name, className, exam.id);
      const saved = state.savedProgressMap[progressKey];
      const totalSeconds = Math.max(1, Number(exam.durationMinutes) || 10) * 60;

      state.examSession = {
        exam: structuredClone(exam),
        progressKey,
        currentIndex: saved ? Math.min(saved.currentIndex || 0, exam.questions.length - 1) : 0,
        answers: saved && saved.answers ? { ...saved.answers } : {},
        flagged: new Set(saved && Array.isArray(saved.flaggedArr) ? saved.flaggedArr : []),
        remainingSeconds: saved && saved.remainingSeconds > 0 ? saved.remainingSeconds : totalSeconds,
        totalSeconds,
        submittedResult: null
      };

      state.mobilePaletteOpen = false;
      state.view = 'exam-runner';
      pushNavState('exam-runner');

      if (saved) {
        showToast(`Resumed at Question ${state.examSession.currentIndex + 1} (${formatTime(state.examSession.remainingSeconds)} left).`, "info");
      }

      let tickCounter = 0;
      state.timerInterval = setInterval(() => {
        if (!state.examSession || state.examSession.submittedResult) {
          clearExamTimer();
          return;
        }
        state.examSession.remainingSeconds -= 1;
        tickCounter++;
        updateExamTimerDOM();

        // Auto-save to cloud every 5 seconds & keep local map updated every second
        state.savedProgressMap[progressKey] = {
          examId: exam.id,
          currentIndex: state.examSession.currentIndex,
          answers: state.examSession.answers,
          flaggedArr: Array.from(state.examSession.flagged),
          remainingSeconds: state.examSession.remainingSeconds,
          updatedAt: Date.now()
        };
        if (tickCounter % 5 === 0) {
          saveCurrentExamProgressNow();
        }

        if (state.examSession.remainingSeconds <= 0) {
          clearExamTimer();
          showToast("Time is up! Submitting your exam automatically.", "warning");
          finalizeExamSubmission();
        }
      }, 1000);

      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function updateExamTimerDOM() {
      const pill = document.getElementById('runner-timer-pill');
      const txt = document.getElementById('runner-timer-text');
      if (!pill || !txt || !state.examSession) return;
      const rem = state.examSession.remainingSeconds;
      txt.textContent = formatTime(rem);
      if (rem <= 30) {
        pill.className = 'flex items-center gap-1.5 px-3 py-1.5 rounded-xl font-mono-num font-bold text-sm sm:text-base bg-rose-600 text-white timer-critical';
      } else if (rem <= 120) {
        pill.className = 'flex items-center gap-1.5 px-3 py-1.5 rounded-xl font-mono-num font-bold text-sm sm:text-base bg-amber-100 text-amber-900 border border-amber-300';
      } else {
        pill.className = 'flex items-center gap-1.5 px-3 py-1.5 rounded-xl font-mono-num font-bold text-sm sm:text-base bg-slate-900 text-white';
      }
    }

    async function finalizeExamSubmission() {
      clearExamTimer();
      const sess = state.examSession;
      if (!sess || sess.submittedResult) return;

      const questions = sess.exam.questions;
      let correctCount = 0;
      let wrongCount = 0;
      let unansweredCount = 0;

      questions.forEach((q, idx) => {
        const picked = sess.answers[idx];
        if (picked === undefined || picked === null) {
          unansweredCount++;
        } else if (Number(picked) === Number(q.correctIndex)) {
          correctCount++;
        } else {
          wrongCount++;
        }
      });

      const totalQuestions = questions.length;
      const maxMarks = totalQuestions * MARKS_CORRECT;
      const totalScore = (correctCount * MARKS_CORRECT) + (wrongCount * MARKS_WRONG);
      const attempted = correctCount + wrongCount;
      const accuracy = attempted > 0 ? Math.round((correctCount / attempted) * 100) : 0;
      const timeTakenSeconds = Math.max(1, sess.totalSeconds - Math.max(0, sess.remainingSeconds));

      const resultRecord = {
        studentName: state.studentSession.name,
        className: state.studentSession.className,
        examId: sess.exam.id,
        examTitle: sess.exam.title,
        subject: sess.exam.subject,
        totalScore,
        maxMarks,
        correctCount,
        wrongCount,
        unansweredCount,
        totalQuestions,
        accuracy,
        timeTakenSeconds,
        submittedAt: Date.now()
      };

      sess.submittedResult = resultRecord;
      state.lastResultView = {
        exam: sess.exam,
        answers: { ...sess.answers },
        result: resultRecord
      };

      // Clear saved in-progress state
      await clearExamProgress(sess.progressKey);
      state.examSession = null;
      state.mobilePaletteOpen = false;
      state.view = 'exam-result';
      pushNavState('exam-result');
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });

      try {
        await saveResultToStore(resultRecord);
        showToast("Exam submitted and recorded!", "success");
      } catch (err) {
        console.error(err);
        showToast("Exam graded, but cloud save failed.", "warning");
      }
    }

            if (flg) cls = 'bg-amber-100 text-amber-900 border-amber-300';

            if (cur && !isHtmlOmr) cls += ' ring-2 ring-indigo-600 ring-offset-2';

    function renderExamResultView() {
      const data = state.lastResultView;
      if (!data) {
        state.view = 'student-home';
        return renderStudentHomeView();
      }
      const { exam, answers, result } = data;
      const letters = ['A', 'B', 'C', 'D'];
      const pct = result.maxMarks > 0 ? Math.max(0, Math.round((result.totalScore / result.maxMarks) * 100)) : 0;

      return `
        <div class="min-h-screen flex flex-col bg-slate-50">
          <header class="sticky top-0 z-40 bg-white/95 backdrop-blur border-b border-slate-200">
            <div class="max-w-5xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-3">
              <h1 class="text-base font-extrabold text-slate-900">Exam Result Summary</h1>
              <button onclick="window.app.backToStudentHome()"
                class="px-4 py-2 rounded-xl text-xs sm:text-sm font-bold bg-indigo-600 hover:bg-indigo-700 text-white transition">
                &larr; Back to Home
              </button>
            </div>
          </header>

          <main class="flex-1 max-w-5xl w-full mx-auto px-4 sm:px-6 py-6 space-y-6 animate-fade-up">
            <!-- Score Banner -->
            <section class="bg-white rounded-3xl border border-slate-200 shadow-sm p-6 sm:p-8">
              <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-6 border-b border-slate-100">
                <div>
                  <span class="inline-flex px-3 py-1 rounded-full text-xs font-bold bg-indigo-50 text-indigo-700 mb-2">
                    +4 Correct &bull; -1 Wrong &bull; 0 Unattempted
                  </span>
                  <h2 class="text-xl sm:text-2xl font-extrabold text-slate-900">${escapeHtml(result.examTitle)}</h2>
                  <p class="text-sm text-slate-500 mt-1">
                    Student: <strong class="text-slate-900">${escapeHtml(result.studentName)}</strong> &bull;
                    <strong class="text-indigo-700">${escapeHtml(result.className)}</strong> &bull;
                    ${escapeHtml(result.subject)}
                  </p>
                </div>
                <div class="bg-slate-900 text-white rounded-2xl px-6 py-4 text-center shrink-0">
                  <p class="text-[11px] uppercase tracking-wider text-slate-400 font-bold">Final Score</p>
                  <p class="text-3xl font-extrabold font-mono-num mt-0.5">${result.totalScore} <span class="text-lg text-slate-400">/ ${result.maxMarks}</span></p>
                </div>
              </div>

              <!-- 4-Stat Breakdown -->
              <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 sm:gap-4 mt-6">
                <div class="rounded-2xl bg-emerald-50 border border-emerald-100 p-4">
                  <p class="text-xs font-bold text-emerald-700">Correct (+4)</p>
                  <p class="text-2xl font-extrabold text-emerald-950 font-mono-num mt-1">${result.correctCount}</p>
                  <p class="text-[11px] text-emerald-700 font-mono-num">+${result.correctCount * 4} marks</p>
                </div>
                <div class="rounded-2xl bg-rose-50 border border-rose-100 p-4">
                  <p class="text-xs font-bold text-rose-700">Wrong (-1)</p>
                  <p class="text-2xl font-extrabold text-rose-950 font-mono-num mt-1">${result.wrongCount}</p>
                  <p class="text-[11px] text-rose-700 font-mono-num">-${result.wrongCount} marks</p>
                </div>
                <div class="rounded-2xl bg-slate-100 border border-slate-200 p-4">
                  <p class="text-xs font-bold text-slate-600">Unanswered (0)</p>
                  <p class="text-2xl font-extrabold text-slate-900 font-mono-num mt-1">${result.unansweredCount}</p>
                  <p class="text-[11px] text-slate-500">Skipped</p>
                </div>
                <div class="rounded-2xl bg-indigo-50 border border-indigo-100 p-4">
                  <p class="text-xs font-bold text-indigo-700">Accuracy</p>
                  <p class="text-2xl font-extrabold text-indigo-950 font-mono-num mt-1">${result.accuracy}%</p>
                  <p class="text-[11px] text-indigo-700 font-mono-num">Time: ${formatTime(result.timeTakenSeconds)}</p>
                </div>
              </div>
            </section>

            <!-- Question-by-Question Review -->
            <section class="space-y-4">
              <h3 class="text-lg font-extrabold text-slate-900">Detailed Question Review</h3>
              ${exam.questions.map((q, idx) => {
                const picked = answers[idx];
                const isSkipped = picked === undefined || picked === null;
                const isCorrect = !isSkipped && Number(picked) === Number(q.correctIndex);
                const markBadge = isCorrect
                  ? '<span class="px-2.5 py-1 rounded-full text-xs font-bold bg-emerald-100 text-emerald-800 font-mono-num">+4 Correct</span>'
                  : isSkipped
                    ? '<span class="px-2.5 py-1 rounded-full text-xs font-bold bg-slate-200 text-slate-700 font-mono-num">0 Skipped</span>'
                    : '<span class="px-2.5 py-1 rounded-full text-xs font-bold bg-rose-100 text-rose-800 font-mono-num">-1 Wrong</span>';

                return `
                  <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm">
                    <div class="flex items-start justify-between gap-3">
                      <h4 class="text-sm sm:text-base font-bold text-slate-900">Q${idx + 1}. ${escapeHtml(q.text)}</h4>
                      <div class="shrink-0">${markBadge}</div>
                    </div>

                    ${Array.isArray(q.options) && q.options.length > 0 ? `
                      <div class="mt-3.5 grid grid-cols-1 sm:grid-cols-2 gap-2">
                        ${q.options.map((opt, optIdx) => {
                          const rightOpt = optIdx === Number(q.correctIndex);
                          const userPick = !isSkipped && optIdx === Number(picked);
                          let style = 'bg-slate-50 border-slate-200 text-slate-700';
                          if (rightOpt) style = 'bg-emerald-50 border-emerald-400 text-emerald-950 font-semibold';
                          else if (userPick && !rightOpt) style = 'bg-rose-50 border-rose-400 text-rose-950 font-semibold';
                          return `
                            <div class="p-3 rounded-xl border text-xs sm:text-sm flex items-center justify-between gap-2 ${style}">
                              <span><strong>${letters[optIdx]}.</strong> ${escapeHtml(opt)}</span>
                              ${rightOpt ? '<span class="text-[11px] font-bold text-emerald-700 shrink-0">&#10003;</span>' : ''}
                              ${userPick && !rightOpt ? '<span class="text-[11px] font-bold text-rose-700 shrink-0">&#10007;</span>' : ''}
                            </div>
                          `;
                        }).join('')}
                      </div>
                    ` : `
                      <div class="mt-3 text-xs sm:text-sm flex flex-wrap gap-3">
                        <span class="font-semibold text-emerald-700">Correct Answer: Option ${letters[q.correctIndex]}</span>
                        <span class="font-semibold text-slate-600">Your Answer: ${isSkipped ? 'Unattempted' : 'Option ' + letters[picked]}</span>
                      </div>
                    `}

                    ${q.explanation ? `
                      <div class="mt-3.5 p-3.5 rounded-xl bg-indigo-50/70 border border-indigo-100 text-xs sm:text-sm text-indigo-950">
                        <strong class="text-indigo-800">Explanation:</strong> ${escapeHtml(q.explanation)}
                      </div>
                    ` : ''}
                  </div>
                `;
              }).join('')}
            </section>
          </main>
        </div>
      `;
    }

    function openChapterFormModal(editId = null) {
      const existing = editId ? state.chapters.find(c => c.id === editId) : null;
      let contentType = existing?.contentType || 'standard';
      let uploadedHtml = existing?.htmlContent || '';

      const renderFormModal = () => {
        document.getElementById('modal-root').innerHTML = `
          <div class="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-slate-900/60 backdrop-blur-sm animate-fade-up">
            <div class="bg-white rounded-3xl shadow-2xl border border-slate-200 max-w-2xl w-full max-h-[92vh] flex flex-col overflow-hidden">
              <div class="px-5 py-4 border-b border-slate-200 flex items-center justify-between bg-slate-50">
                <h3 class="text-base sm:text-lg font-extrabold text-slate-900">${existing ? 'Edit Chapter' : 'Upload Chapter / Note'}</h3>
                <button onclick="window.app.closeModal()" class="p-1.5 rounded-lg text-slate-400 hover:text-slate-700 font-bold">✕</button>
              </div>

              <form id="chapter-modal-form" class="p-5 overflow-y-auto space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                  <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Class *</label>
                    <select id="ch-cls" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm bg-white outline-none">
                      ${state.classes.map(c => `<option value="${escapeHtml(c.name)}" ${existing?.className === c.name ? 'selected' : ''}>${escapeHtml(c.name)}</option>`).join('')}
                    </select>
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Subject *</label>
                    <select id="ch-sub" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm bg-white outline-none">
                      ${SUBJECTS.map(s => `<option value="${s}" ${existing?.subject === s ? 'selected' : ''}>${s}</option>`).join('')}
                    </select>
                  </div>
                </div>

                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1">Chapter Title *</label>
                  <input id="ch-title" type="text" required value="${escapeHtml(existing?.title || '')}" placeholder="e.g., Wave Optics"
                    class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm outline-none focus:ring-2 focus:ring-indigo-500" />
                </div>

                <!-- Content Mode Toggle -->
                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1.5">Note Format</label>
                  <div class="grid grid-cols-2 gap-2 p-1 rounded-xl bg-slate-100 border border-slate-200">
                    <button type="button" id="btn-ch-mode-std" class="py-2 rounded-lg text-xs font-bold transition ${contentType === 'standard' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-600'}">Standard Text Editor</button>
                    <button type="button" id="btn-ch-mode-html" class="py-2 rounded-lg text-xs font-bold transition ${contentType === 'html' ? 'bg-white text-violet-700 shadow-sm' : 'text-slate-600'}">Upload HTML File (.html)</button>
                  </div>
                </div>

                <div id="ch-std-fields" class="${contentType === 'standard' ? 'space-y-3.5' : 'hidden'}">
                  <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Key Takeaways (one per line)</label>
                    <textarea id="ch-takeaways" rows="3" placeholder="Bullet points..."
                      class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm outline-none">${escapeHtml((existing?.takeaways || []).join('\n'))}</textarea>
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Detailed Notes *</label>
                    <textarea id="ch-content" rows="5" ${contentType === 'standard' ? 'required' : ''} placeholder="Write chapter notes..."
                      class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm outline-none">${escapeHtml(existing?.content || '')}</textarea>
                  </div>
                </div>

                <div id="ch-html-fields" class="${contentType === 'html' ? 'space-y-3' : 'hidden'}">
                  <div class="p-4 rounded-2xl border-2 border-dashed border-violet-300 bg-violet-50/50 text-center space-y-2">
                    <p class="text-xs font-bold text-violet-900">Upload your prepared HTML Note (.html / .htm)</p>
                    <input id="ch-html-file" type="file" accept=".html,.htm" class="block w-full text-xs text-slate-600 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-violet-600 file:text-white hover:file:bg-violet-700 cursor-pointer" />
                    <p id="ch-html-status" class="text-xs font-semibold ${uploadedHtml ? 'text-emerald-700' : 'text-slate-500'}">
                      ${uploadedHtml ? `HTML loaded (${uploadedHtml.length.toLocaleString()} characters ready)` : 'No HTML file selected yet.'}
                    </p>
                  </div>
                  <button type="button" onclick="window.app.downloadSampleNoteHtml()" class="text-xs font-bold text-indigo-600 hover:underline">
                    Need a template? Download Sample Note HTML
                  </button>
                </div>

                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1">Optional Reference / Video URL</label>
                  <input id="ch-video" type="url" value="${escapeHtml(existing?.videoUrl || '')}" placeholder="https://..."
                    class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm outline-none" />
                </div>

                <div class="pt-3 border-t border-slate-100 flex items-center justify-end gap-2">
                  <button type="button" onclick="window.app.closeModal()" class="px-4 py-2.5 rounded-xl text-sm font-semibold text-slate-600 bg-slate-100">Cancel</button>
                  <button type="submit" class="px-5 py-2.5 rounded-xl text-sm font-bold bg-slate-900 text-amber-400">
                    ${existing ? 'Save Changes' : 'Publish Chapter'}
                  </button>
                </div>
              </form>
            </div>
          </div>
        `;

        document.getElementById('btn-ch-mode-std').onclick = () => {
          contentType = 'standard';
          document.getElementById('ch-std-fields').className = 'space-y-3.5';
          document.getElementById('ch-html-fields').className = 'hidden';
          document.getElementById('ch-content').setAttribute('required', 'required');
          document.getElementById('btn-ch-mode-std').className = 'py-2 rounded-lg text-xs font-bold transition bg-white text-indigo-700 shadow-sm';
          document.getElementById('btn-ch-mode-html').className = 'py-2 rounded-lg text-xs font-bold transition text-slate-600';
        };

        document.getElementById('btn-ch-mode-html').onclick = () => {
          contentType = 'html';
          document.getElementById('ch-std-fields').className = 'hidden';
          document.getElementById('ch-html-fields').className = 'space-y-3';
          document.getElementById('ch-content').removeAttribute('required');
          document.getElementById('btn-ch-mode-html').className = 'py-2 rounded-lg text-xs font-bold transition bg-white text-violet-700 shadow-sm';
          document.getElementById('btn-ch-mode-std').className = 'py-2 rounded-lg text-xs font-bold transition text-slate-600';
        };

        document.getElementById('ch-html-file').onchange = (ev) => {
          const file = ev.target.files?.[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => {
            uploadedHtml = String(reader.result || '');
            const st = document.getElementById('ch-html-status');
            if (st) {
              st.className = 'text-xs font-bold text-emerald-700';
              st.textContent = `Loaded "${file.name}" (${uploadedHtml.length.toLocaleString()} chars)`;
            }
          };
          reader.readAsText(file);
        };

        document.getElementById('chapter-modal-form').onsubmit = async (e) => {
          e.preventDefault();
          if (contentType === 'html' && !uploadedHtml.trim()) {
            showToast("Please upload an HTML file first.", "warning");
            return;
          }
          const payload = {
            className: document.getElementById('ch-cls').value,
            subject: document.getElementById('ch-sub').value,
            title: document.getElementById('ch-title').value.trim(),
            contentType,
            takeaways: document.getElementById('ch-takeaways').value.split('\n').map(s => s.trim()).filter(Boolean),
            content: document.getElementById('ch-content').value.trim(),
            htmlContent: contentType === 'html' ? uploadedHtml : '',
            videoUrl: document.getElementById('ch-video').value.trim()
          };
          try {
            await saveChapterToStore(payload, editId);
            closeModal();
            showToast(editId ? "Chapter updated!" : "Chapter published!", "success");
          } catch (err) {
            console.error(err);
            showToast("Could not save chapter (check HTML file size < 900KB).", "error");
          }
        };
      };

      renderFormModal();
    }

    // Smart HTML Question Paper Parser
    function parseHtmlQuestionPaper(htmlString) {
      const parser = new DOMParser();
      const docObj = parser.parseFromString(htmlString, 'text/html');
      const blocks = docObj.querySelectorAll('.mcq-item, .question');
      const parsed = [];
      const letterMap = { A: 0, B: 1, C: 2, D: 3, '0': 0, '1': 1, '2': 2, '3': 3 };

      blocks.forEach((block, i) => {
        const textEl = block.querySelector('.question-text, .q-text, h3, h4, p');
        const text = textEl ? textEl.textContent.trim() : '';
        const optEls = block.querySelectorAll('.option, li');
        const options = Array.from(optEls).slice(0, 4).map(el => el.textContent.trim());
        const rawAns = (block.getAttribute('data-answer') || 'A').trim().toUpperCase();
        const correctIndex = letterMap[rawAns] !== undefined ? letterMap[rawAns] : 0;
        const expEl = block.querySelector('.explanation');
        const explanation = expEl ? expEl.textContent.trim() : '';

        if (text && options.length >= 2) {
          while (options.length < 4) options.push('—');
          parsed.push({
            id: `html-q-${Date.now()}-${i}`,
            text,
            options,
            correctIndex,
            explanation
          });
        }
      });
      return parsed;
    }

                      <th class="px-4 py-3.5">Accuracy</th>
                      <th class="px-4 py-3.5">Date</th>
                      <th class="px-4 py-3.5 text-right">Action</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-100 text-xs sm:text-sm">
                    ${filtered.map(r => `
                      <tr class="hover:bg-slate-50/70">
                        <td class="px-4 py-3.5 font-bold text-slate-900">${escapeHtml(r.studentName)}</td>
                        <td class="px-4 py-3.5"><span class="px-2 py-0.5 rounded-md text-xs font-bold bg-indigo-50 text-indigo-700">${escapeHtml(r.className)}</span></td>
                        <td class="px-4 py-3.5 text-slate-700 font-medium">${escapeHtml(r.examTitle)}</td>
                        <td class="px-4 py-3.5 font-extrabold font-mono-num text-slate-900">${r.totalScore} / ${r.maxMarks}</td>
                        <td class="px-4 py-3.5 font-mono-num text-xs">
                          <span class="text-emerald-700 font-bold">${r.correctCount}</span> /
                          <span class="text-rose-600 font-bold">${r.wrongCount}</span> /
                          <span class="text-slate-500">${r.unansweredCount}</span>
                        </td>
                        <td class="px-4 py-3.5 font-mono-num font-bold text-indigo-700">${r.accuracy}%</td>
                        <td class="px-4 py-3.5 text-xs text-slate-500">${formatDate(r.submittedAt)}</td>
                        <td class="px-4 py-3.5 text-right">
                          <button onclick="window.app.confirmDeleteResult('${r.id}')" class="text-xs font-bold text-rose-600 hover:underline">Remove</button>
                        </td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            `}
          </div>
        </section>
      `;
    }

    // =========================================================================
    // 14. SAMPLE HTML TEMPLATES FOR TEACHER DOWNLOAD
    // =========================================================================
    const SAMPLE_NOTE_HTML = `<!DOCTYPE html>

    const SAMPLE_QUESTION_PAPER_HTML = `<!DOCTYPE html>

    // =========================================================================
    // 15. EXPOSED PUBLIC HANDLERS
    // =========================================================================
    window.app = {
      closeModal,
      openMasterLogin: openMasterLoginModal,

      async handleStudentLogin(e) {
        e.preventDefault();
        const nameInput = document.getElementById('login-student-name').value.trim();
        const classSelect = document.getElementById('login-student-class').value;
        if (!nameInput || !classSelect) {
          showToast("Please enter your name and select a class.", "warning");
          return;
        }
        await persistStudentSession({ name: nameInput, className: classSelect });
        state.studentTab = 'chapters';
        state.studentSubjectFilter = 'All';
        state.studentSearch = '';
        state.view = 'student-home';
        pushNavState('student-home');
        renderApp();
        showToast(`Welcome, ${nameInput}!`, "success");
      },

      handleStudentLogout() {
        showConfirmModal({
          title: "Logout from Student Portal?",
          message: "You will be returned to the Login screen where you can sign in with a different name or class.",
          confirmText: "Logout",
          confirmStyle: "danger",
          onConfirm: async () => {
            clearExamTimer();
            state.examSession = null;
            await persistStudentSession(null);
            state.view = 'login';
            renderApp();
          }
        });
      },

      exitMasterMode() {
        state.view = state.studentSession ? 'student-home' : 'login';
        renderApp();
      },

      setStudentTab(tab) {
        state.studentTab = tab;
        renderApp();
      },

      setStudentSubjectFilter(sub) {
        state.studentSubjectFilter = sub;
        renderApp();
      },

      setStudentSearch(val) {
        state.studentSearch = val;
        renderApp();
        const el = document.getElementById('student-ch-search');
        if (el) {
          el.focus();
          el.setSelectionRange(val.length, val.length);
        }
      },

      openChapterReader(chapterId) {
        state.activeChapterId = chapterId;
        state.view = 'chapter-reader';
        pushNavState('chapter-reader');
        renderApp();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      },

      backToStudentHome() {
        state.activeChapterId = null;
        state.lastResultView = null;
        state.view = state.studentSession ? 'student-home' : 'login';
        renderApp();
      },

      toggleChapterComplete(chapterId) {
        toggleChapterCompleted(chapterId);
      },

      // Exam Runner
      startOrResumeExam,
      pauseAndReturnHome,

      selectExamOption(qIdx, optIdx) {
        if (!state.examSession || state.examSession.submittedResult) return;
        state.examSession.answers[qIdx] = optIdx;
        saveCurrentExamProgressNow();
        renderApp();
      },

      clearExamOption(qIdx) {
        if (!state.examSession || state.examSession.submittedResult) return;
        delete state.examSession.answers[qIdx];
        saveCurrentExamProgressNow();
        renderApp();
      },

      toggleFlagQuestion(qIdx) {
        if (!state.examSession || state.examSession.submittedResult) return;
        if (state.examSession.flagged.has(qIdx)) state.examSession.flagged.delete(qIdx);
        else state.examSession.flagged.add(qIdx);
        saveCurrentExamProgressNow();
        renderApp();
      },

      jumpToExamQuestion(idx) {
        if (!state.examSession) return;
        const max = state.examSession.exam.questions.length - 1;
        state.examSession.currentIndex = Math.max(0, Math.min(max, idx));
        state.mobilePaletteOpen = false;
        saveCurrentExamProgressNow();
        renderApp();
      },

      toggleMobilePalette(open) {
        state.mobilePaletteOpen = Boolean(open);
        renderApp();
      },

      promptSubmitExam() {
        const sess = state.examSession;
        if (!sess) return;
        const total = sess.exam.questions.length;
        const ans = Object.keys(sess.answers).length;
        showConfirmModal({
          title: "Submit Timed Exam?",
          message: `You have answered ${ans} of ${total} questions (${total - ans} unanswered). Marking: +4 Correct, -1 Wrong, 0 Unattempted.`,
          confirmText: "Submit Exam",
          confirmStyle: "primary",
          onConfirm: () => finalizeExamSubmission()
        });
      },

      // Master Panel
      setMasterTab(tab) {
        state.masterTab = tab;
        renderApp();
      },

      async handleAddClass(e) {
        e.preventDefault();
        const name = document.getElementById('new-class-name').value.trim();
        const allowMcq = document.getElementById('new-class-mcq').checked;
        if (!name) return;
        if (state.classes.some(c => c.name.toLowerCase() === name.toLowerCase())) {
          showToast("A class with that name already exists.", "warning");
          return;
        }
        await saveClassToStore({ name, allowMcq });
        showToast(`"${name}" added!`, "success");
      },

      async toggleClassMcq(classId, newVal) {
        await toggleClassMcqInStore(classId, newVal);
        showToast("Class MCQ setting updated.", "info");
      },

      confirmDeleteClass(classId, className) {
        showConfirmModal({
          title: `Delete ${className}?`,
          message: "Students will no longer see this class in the login dropdown.",
          confirmText: "Delete Class",
          confirmStyle: "danger",
          onConfirm: async () => {
            await deleteClassFromStore(classId);
            showToast(`${className} removed.`, "info");
          }
        });
      },

      setMasterChapterClassFilter(val) {
        state.masterChapterClassFilter = val;
        renderApp();
      },

      openChapterFormModal,

      confirmDeleteChapter(chapterId) {
        showConfirmModal({
          title: "Delete Chapter?",
          message: "This chapter will be permanently removed.",
          confirmText: "Delete",
          confirmStyle: "danger",
          onConfirm: async () => {
            await deleteChapterFromStore(chapterId);
            showToast("Chapter deleted.", "info");
          }
        });
      },

      setMasterExamClassFilter(val) {
        state.masterExamClassFilter = val;
        renderApp();
      },

      openExamFormModal,
      openQuestionManagerModal,

      confirmDeleteExam(examId) {
        showConfirmModal({
          title: "Delete MCQ Exam?",
          message: "This exam and all its questions will be permanently removed.",
          confirmText: "Delete Exam",
          confirmStyle: "danger",
          onConfirm: async () => {
            await deleteExamFromStore(examId);
            showToast("Exam deleted.", "info");
          }
        });
      },

      async deleteQuestionFromExam(examId, qIdx) {
        const exam = state.exams.find(e => e.id === examId);
        if (!exam) return;
        const updated = exam.questions.filter((_, i) => i !== qIdx);
        await updateExamQuestionsInStore(examId, updated);
        showToast("Question removed.", "info");
        setTimeout(() => openQuestionManagerModal(examId), 120);
      },

      setMasterResultClassFilter(val) {
        state.masterResultClassFilter = val;
        renderApp();
      },

      setMasterResultExamFilter(val) {
        state.masterResultExamFilter = val;
        renderApp();
      },

      confirmDeleteResult(resultId) {
        showConfirmModal({
          title: "Remove Result?",
          message: "Delete this student's exam attempt from the dashboard?",
          confirmText: "Remove",
          confirmStyle: "danger",
          onConfirm: async () => {
            await deleteResultFromStore(resultId);
            showToast("Result removed.", "info");
          }
        });
      },

      exportResultsCsv() {
        const filtered = state.results.filter(r => {
          const clsOk = state.masterResultClassFilter === 'All' || r.className === state.masterResultClassFilter;
          const exOk = state.masterResultExamFilter === 'All' || r.examTitle === state.masterResultExamFilter;
          return clsOk && exOk;
        });
        if (filtered.length === 0) {
          showToast("No results to export.", "warning");
          return;
        }
        const headers = ["Student Name", "Class", "Exam Title", "Subject", "Score", "Max Marks", "Correct (+4)", "Wrong (-1)", "Unanswered (0)", "Accuracy (%)", "Date"];
        const rows = filtered.map(r => [
          `"${(r.studentName || '').replace(/"/g, '""')}"`,
          `"${(r.className || '').replace(/"/g, '""')}"`,
          `"${(r.examTitle || '').replace(/"/g, '""')}"`,
          `"${(r.subject || '').replace(/"/g, '""')}"`,
          r.totalScore,
          r.maxMarks,
          r.correctCount,
          r.wrongCount,
          r.unansweredCount,
          r.accuracy,
          `"${formatDate(r.submittedAt)}"`
        ]);
        const csv = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
        downloadTextFile(`EduMaster_Results_${new Date().toISOString().slice(0, 10)}.csv`, csv, 'text/csv;charset=utf-8');
        showToast("Results exported to CSV!", "success");
      },

      downloadSampleNoteHtml() {
        downloadTextFile("Sample_Study_Note.html", SAMPLE_NOTE_HTML);
        showToast("Downloaded Sample_Study_Note.html", "info");
      },

      downloadSampleQuestionHtml() {
        downloadTextFile("Sample_MCQ_Question_Paper.html", SAMPLE_QUESTION_PAPER_HTML);
        showToast("Downloaded Sample_MCQ_Question_Paper.html", "info");
      }
    };

    // Boot Application
    initFirebase();
  </script>
</body>
</html>
