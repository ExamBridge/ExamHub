          const handleHtmlInput = async (rawHtml) => {
            if (!rawHtml.trim()) {
              showToast("Please provide HTML code.", "warning");
              return;
            }
            const parsed = parseMcqHtmlDocument(rawHtml);
            if (parsed.length > 0) {
              exam.questions = (exam.questions || []).concat(parsed);
              await pushAllToCloud(true);
              showToast("Imported " + parsed.length + " MCQ(s) from HTML!", "success");
              renderInner();
            } else {
              exam.htmlPaper = rawHtml;
              if (!exam.questions || exam.questions.length === 0) {
                exam.questions = [
                  { id: uid("q"), text: "Question 1 (Refer to HTML Paper above)", options: ["A", "B", "C", "D"], correctIndex: 0, explanation: "" }
                ];
              }
              await pushAllToCloud(true);
              showToast("Attached custom HTML paper with OMR fallback.", "info");
              renderInner();
            }
          };

          document.getElementById("qm-html-file").onchange = (ev) => {
            const file = ev.target.files && ev.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => handleHtmlInput(String(reader.result || ""));
            reader.readAsText(file);

          document.getElementById("qm-load-paste").onclick = () => {
            handleHtmlInput(document.getElementById("qm-html-paste").value || "");
          };

          document.getElementById("qm-add-form").onsubmit = async (e) => {
            e.preventDefault();
            exam.questions = exam.questions || [];
            exam.questions.push({

              options: [

                document.getElementById("qm-o1").value.trim(),
                document.getElementById("qm-o2").value.trim(),

            });

            showToast("Question added!", "success");
            renderInner();
          };

          root.querySelectorAll("[data-del-q]").forEach(btn => {
            btn.onclick = async () => {
              const idx = parseInt(btn.getAttribute("data-del-q"), 10);
              exam.questions.splice(idx, 1);
              await pushAllToCloud(true);
              renderInner();
            };
          });
        };

        renderInner();
      }

      // =======================================================================
      // 11. PUBLIC PORTAL ACTIONS

      window.portal = {
        manualSync() { syncFromCloud(true); },

        openAskDoubtModal,

        openManualExpelModal,

        },

          render();
        },

        setHomeSubject(sub) {
          state.homeSubjectFilter = sub;
          render();
        },

        openChapter(id) {
          navigateToHash("#note/" + id);
        },

        toggleChapterDone(id) {
          state.completedChapters[id] = !state.completedChapters[id];

          render();
        },

        async submitDoubtFromHome() {
          const topic = (document.getElementById("student-doubt-topic").value || "").trim() || "General";
          const q = (document.getElementById("student-doubt-text").value || "").trim();
          if (!q) { showToast("Please type your doubt first.", "warning"); return; }
          state.db.doubts = state.db.doubts || [];
          state.db.doubts.unshift({
            id: uid("dbt"),
            studentName: state.student.name,
            classId: state.student.classId,
            className: state.student.className,
            contextTitle: topic,
            question: q,
            reply: "",
            createdAt: new Date().toISOString(),
            repliedAt: ""
          });
          render();
          await pushAllToCloud(true);
          showToast("Doubt sent to your teacher!", "success");
        },

        startExam(examId) {
          const exam = state.db.exams.find(e => e.id === examId);
          if (!exam) return;
          if (state.student && getExamAttemptStatus(examId, state.student.name).locked) {
            showToast("You have already submitted this exam. Ask Master for retake permission.", "warning");
            return;
          }
          const sched = getExamScheduleStatus(exam);
          if (!sched.allowed) {
            showToast("Exam is scheduled: " + sched.label, "warning");
            return;
          }
          navigateToHash("#exam/" + examId);
        },

        pauseAndGoHome() {
          pauseAndSaveActiveExam(false);
          navigateToHash("#home");
        },

        selectOption(qIdx, origOptIdx) {
          if (!state.activeExam) return;
          state.activeExam.answers[qIdx] = origOptIdx;
          render();
        },

        clearOption(qIdx) {
          if (!state.activeExam) return;
          delete state.activeExam.answers[qIdx];
          render();
        },

        toggleFlag(qIdx) {
          if (!state.activeExam) return;
          state.activeExam.flagged[qIdx] = !state.activeExam.flagged[qIdx];
          render();
        },

        goToQuestion(newIdx) {
          if (!state.activeExam) return;
          const exam = state.db.exams.find(e => e.id === state.activeExam.examId);
          const total = exam && exam.questions ? exam.questions.length : 0;
          if (newIdx >= 0 && newIdx < total) {
            state.activeExam.currentIndex = newIdx;
            render();
          }
        },

        togglePalette() {
          state.paletteOpen = !state.paletteOpen;
          render();
        },

        jumpToQuestion(qIdx) {
          if (!state.activeExam) return;
          state.activeExam.currentIndex = qIdx;
          state.paletteOpen = false;
          render();
        },

        confirmSubmitExam() {
          if (!state.activeExam) return;
          const exam = state.db.exams.find(e => e.id === state.activeExam.examId);
          const total = exam && exam.questions ? exam.questions.length : 0;
          const ans = Object.keys(state.activeExam.answers).length;
          showConfirmModal(
            "Submit Exam?",
            "You have answered " + ans + " of " + total + " questions. Once submitted, you cannot change your answers.",
            "Submit Now",
            submitActiveExam,
            false
          );
        },

          state.student = null;
          saveLocalSession();
          navigateToHash("#login");
        },

        confirmLogout() {
          showConfirmModal(
            "Switch Student / Logout?",
            "You will be returned to the Student Login screen.",
            "Logout",
            () => {
              state.student = null;
              saveLocalSession();
              navigateToHash("#login");
            },
            true
          );

          ex.scheduleEnabled = !ex.scheduleEnabled;

          showConfirmModal("Delete Exam?", "This exam and its questions will be removed.", "Delete", async () => {
            state.db.exams = state.db.exams.filter(e => e.id !== id);
            render();
            await pushAllToCloud(false);
          }, true);
        },

        async grantExamRetakeByResult(resultId) {
          const r = state.db.results.find(x => x.id === resultId);
          if (!r) return;
          const status = getExamAttemptStatus(r.examId, r.studentName);
          const key = getRetakeKey(r.examId, r.studentName);
          state.db.retakePermissions = state.db.retakePermissions || {};
          state.db.retakePermissions[key] = Math.max(Date.now(), status.latestTime + 1000);
          render();
          await pushAllToCloud(true);
          showToast("Retake permission granted to " + r.studentName + ".", "success");
        },

        async revokeExamRetakeByResult(resultId) {
          const r = state.db.results.find(x => x.id === resultId);
          if (!r) return;
          const key = getRetakeKey(r.examId, r.studentName);
          if (state.db.retakePermissions && state.db.retakePermissions[key]) {
            delete state.db.retakePermissions[key];
          }
          render();
          await pushAllToCloud(true);
          showToast("Exam locked again for " + r.studentName + ".", "info");
        },

        async reinstateStudent(normName) {
          if (state.db.expelledStudents && state.db.expelledStudents[normName]) {
            const name = state.db.expelledStudents[normName].name || normName;
            delete state.db.expelledStudents[normName];
            render();
            await pushAllToCloud(true);
            showToast(name + " has been reinstated.", "success");
          }
        },

        async addNotice() {
          const title = (document.getElementById("notice-title").value || "").trim();
          const message = (document.getElementById("notice-msg").value || "").trim();
          const classId = document.getElementById("notice-class").value || "all";
          if (!title || !message) { showToast("Enter notice title and message.", "warning"); return; }
          state.db.notices = state.db.notices || [];
          state.db.notices.unshift({ id: uid("ntc"), title, message, classId, createdAt: new Date().toISOString() });
          render();
          await pushAllToCloud(false);
        },

        async deleteNotice(id) {
          state.db.notices = (state.db.notices || []).filter(n => n.id !== id);
          render();
          await pushAllToCloud(true);
        },

        async replyToDoubt(id) {
          const d = (state.db.doubts || []).find(x => x.id === id);
          const input = document.getElementById("reply-input-" + id);
          if (!d || !input) return;
          d.reply = (input.value || "").trim();
          d.repliedAt = new Date().toISOString();
          render();
          await pushAllToCloud(true);
          showToast("Reply saved!", "success");
        },

        async deleteDoubt(id) {
          state.db.doubts = (state.db.doubts || []).filter(x => x.id !== id);
          render();
          await pushAllToCloud(true);
        },

        async updateMasterPin() {
          const pin = (document.getElementById("settings-new-pin").value || "").trim();
          if (pin.length < 4) { showToast("PIN must be at least 4 characters.", "warning"); return; }
          state.db.settings = state.db.settings || {};
          state.db.settings.masterPin = pin;
          document.getElementById("settings-new-pin").value = "";
          await pushAllToCloud(true);
          showToast("Master PIN updated in cloud!", "success");
        },

        async toggleGlobalLeaderboard() {
          state.db.settings = state.db.settings || {};
          state.db.settings.leaderboardEnabled = !state.db.settings.leaderboardEnabled;
          render();
          await pushAllToCloud(true);
        },

        exportResultsCsv() {
          const rows = [["Date", "Student Name", "Class", "Exam", "Score", "Max Marks", "Correct", "Wrong", "Skipped", "Tab Switches"]];
          state.db.results.forEach(r => {
            rows.push([
              r.submittedAt ? new Date(r.submittedAt).toLocaleString() : "",
              r.studentName || "",
              r.className || "",
              r.examTitle || "",
              r.score,
              r.maxMarks,
              r.correct,
              r.wrong,
              r.unattempted,
              r.tabSwitches || 0
            ]);
          });
          const csv = rows.map(row => row.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(",")).join("\n");
          const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = "edumaster-results.csv";
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
          showToast("Exported CSV!", "success");
        }
      };

      // =======================================================================
      // 12. BOOTSTRAP
      // =======================================================================
      loadSavedTheme();
      loadLocalSession();
      loadCacheDb();
      ensureDefaultClassesIfEmpty();
      reconcileStudentSession();

      if (state.student && (!window.location.hash || window.location.hash === "#login")) {
        try { history.replaceState(null, "", "#home"); } catch (e) {}
      }
      applyRouteFromHash();
      syncFromCloud(false);
    })();
  </script>
</body>
</html>
