<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exam Application</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700;800&display=swap" rel="stylesheet">
<script>window.MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] } };</script>
<script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
    html, body { max-width: 100vw !important; overflow-x: hidden !important; }
    * { box-sizing: border-box !important; }
    .question-text, .option, .explanation-box, p, div, span {
        word-wrap: break-word !important; overflow-wrap: break-word !important; word-break: break-word !important; white-space: pre-wrap !important; max-width: 100% !important; min-width: 0 !important;
    }
    img, table { max-width: 100% !important; height: auto !important; }
    :root {
        --bg-color: #f0f2f5; --card-bg: #ffffff; --card-border: 1px solid #e1e4e8; --card-shadow: 0 10px 25px rgba(0,0,0,0.05);
        --text-main: #1f2937; --text-dim: #6b7280; --primary: #2563eb; --primary-glow: transparent;
        --correct: #10b981; --wrong: #ef4444; --btn-bg: #ffffff; --btn-border: 1px solid #d1d5da; --btn-shadow: 0 2px 4px rgba(0,0,0,0.02);
       --btn-hover-bg: #f8fafc; --backdrop-filter: none;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg-color); color: var(--text-main); margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow-y: auto; transition: background 0.3s ease; }
    #app { width: 100%; max-width: 750px; margin: auto; padding: 20px 0; }
    .card { background: var(--card-bg); border: var(--card-border); border-radius: 16px; padding: 35px; box-shadow: var(--card-shadow); backdrop-filter: var(--backdrop-filter); -webkit-backdrop-filter: var(--backdrop-filter); }
    .status-bar { display: flex; justify-content: space-between; font-size: 0.95rem; color: var(--text-dim); margin-bottom: 25px; border-bottom: var(--card-border); padding-bottom: 15px; font-weight: 600; }
    .timer { color: var(--primary); font-weight: 700; background: rgba(37, 99, 235, 0.1); padding: 4px 10px; border-radius: 8px; }
    .timer.warning { color: #fff; background: var(--wrong); animation: pulse 1s infinite; }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    .question-text { font-size: 1.25rem; margin-top: 0; margin-bottom: 20px; line-height: 1.6; font-weight: 600; color: var(--text-main); }
    .question-img { max-width: 100%; max-height: 400px; border-radius: 12px; margin-bottom: 25px; border: var(--card-border); display: block; margin-left: auto; margin-right: auto; }
    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    @media (max-width: 600px) { .options-grid { grid-template-columns: 1fr; } }
    .option { background: var(--btn-bg); border: var(--btn-border); box-shadow: var(--btn-shadow); color: var(--text-main); padding: 18px 20px; border-radius: 12px; cursor: pointer; transition: all 0.2s; font-size: 1.1rem; text-align: center; font-weight: 600; display: flex; align-items: center; justify-content: center; }
    .option:hover { border-color: var(--primary); background: var(--btn-hover-bg); transform: translateY(-2px); box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .option.correct { background: rgba(16, 185, 129, 0.1); color: var(--correct); border-color: var(--correct); pointer-events: none; transform: none; box-shadow: none; }
    .option.wrong { background: rgba(239, 68, 68, 0.1); color: var(--wrong); border-color: var(--wrong); pointer-events: none; transform: none; box-shadow: none; }
    .option.disabled { pointer-events: none; opacity: 0.6; }
    .option.correct.disabled { opacity: 1; }
    .explanation-box { margin-top: 25px; padding: 20px; background: var(--btn-bg); border: var(--card-border); border-left: 4px solid var(--primary); color: var(--text-main); border-radius: 8px; font-size: 1rem; line-height: 1.6; display: none; animation: slideDown 0.3s ease; box-shadow: var(--btn-shadow); }
    .exp-img { max-width: 100%; border-radius: 8px; margin-bottom: 15px; display: block; border: var(--card-border); }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    .controls { display: flex; justify-content: space-between; gap: 15px; margin-top: 35px; }
    .controls button { flex: 1; background: var(--btn-bg); color: var(--text-dim); border: var(--card-border); padding: 16px; border-radius: 10px; cursor: pointer; text-transform: uppercase; font-weight: 700; transition: 0.2s; letter-spacing: 0.5px; }
    .controls button:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); background: var(--btn-hover-bg); }
    .controls button:disabled { opacity: 0.3; cursor: not-allowed; }
    .results-screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #FFFFFF; z-index: 1000; display: flex; flex-direction: column; font-family: 'Quicksand', sans-serif; }
    .bg-blob-results { position: absolute; top: -50px; right: -50px; width: 300px; height: 300px; background: linear-gradient(135deg, #FF6473 0%, #FFA86A 100%); border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; opacity: 0.15; z-index: -1; transform: rotate(-15deg); }
    .results-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 24px; }
    .results-title { font-size: 32px; font-weight: 800; color: #3A3A3A; margin-bottom: 12px; margin-top: 0; text-align: center; }
    .results-desc { font-size: 15px; color: #8F92A1; font-weight: 500; margin-bottom: 40px; text-align: center; }
    .student-badge-new { display: flex; flex-direction: column; align-items: center; justify-content: center; background: #F8F9FA; border: 2px solid #EEEEEE; border-radius: 16px; padding: 16px 32px; margin: 0 auto 40px auto; width: 100%; max-width: 320px; text-align: center; }
    .badge-label { font-size: 13px; color: #FF7468; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; text-align: center; }
    .badge-name { font-size: 20px; color: #3A3A3A; font-weight: 700; text-align: center; width: 100%; word-break: break-word; }
    .score-box { display: flex; align-items: baseline; justify-content: center; gap: 8px; }
    .score-value { font-size: 80px; font-weight: 800; color: #FF7468; line-height: 1; }
    .score-total { font-size: 30px; font-weight: 700; color: #8F92A1; }
    .bottom-bar-results { background: linear-gradient(135deg, #FF6473 0%, #FFA86A 100%); padding: 20px 24px; display: flex; justify-content: center; align-items: center; border-top-left-radius: 24px; border-top-right-radius: 24px; box-shadow: 0 -4px 15px rgba(255, 116, 104, 0.3); }
    .action-btn-results { background-color: #FFFFFF; color: #FF7468; border: none; border-radius: 50px; padding: 16px 32px; width: 100%; max-width: 400px; font-family: 'Quicksand', sans-serif; font-weight: 800; font-size: 16px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
</style>
</head>
<body>
<div id="app"></div>
<script>
    try {
        window.history.pushState(null, null, window.location.href);
        window.onpopstate = function () { window.history.pushState(null, null, window.location.href); };
    } catch(e) {
        console.log("Offline mode: Back-button block bypassed.");
    }

    const CONFIG = {"theme":"flat","timerType":"question","timerValue":25,"shuffle":false,"exitUrl":"https://exambridge.github.io/ExamHub/"};
    
    const quizData = [
        {"id": 1, "qNum": 1, "qText": "The dimensional formula of Planck's constant is the same as that of:", "qImage": null, "options": ["(a) Linear momentum", "(b) Angular momentum", "(c) Work", "(d) Power"], "correct": "(b) Angular momentum", "expText": "", "expImage": null},
        {"id": 2, "qNum": 2, "qText": "The escape velocity of a body from the surface of the Earth is approximately:", "qImage": null, "options": ["(a) $9.8 \\text{ km/s}$", "(b) $11.2 \\text{ km/s}$", "(c) $3.0 \\times 10^8 \\text{ m/s}$", "(d) $7.9 \\text{ km/s}$"], "correct": "(b) $11.2 \\text{ km/s}$", "expText": "", "expImage": null},
        {"id": 3, "qNum": 3, "qText": "The First Law of Thermodynamics is a statement of:", "qImage": null, "options": ["(a) Conservation of mass", "(b) Conservation of energy", "(c) Conservation of momentum", "(d) Conservation of angular momentum"], "correct": "(b) Conservation of energy", "expText": "", "expImage": null},
        {"id": 4, "qNum": 4, "qText": "The value of acceleration due to gravity ($g$) is maximum at:", "qImage": null, "options": ["(a) The equator", "(b) The poles", "(c) The center of the Earth", "(d) An altitude of 100 km"], "correct": "(b) The poles", "expText": "", "expImage": null},
        {"id": 5, "qNum": 5, "qText": "Work done by a conservative force over a closed path is:", "qImage": null, "options": ["(a) Positive", "(b) Negative", "(c) Zero", "(d) Infinity"], "correct": "(c) Zero", "expText": "", "expImage": null},
        {"id": 6, "qNum": 6, "qText": "The SI unit of magnetic flux is:", "qImage": null, "options": ["(a) Tesla", "(b) Weber", "(c) Henry", "(d) Gauss"], "correct": "(b) Weber", "expText": "", "expImage": null},
        {"id": 7, "qNum": 7, "qText": "Which of the following electromagnetic waves has the highest frequency?", "qImage": null, "options": ["(a) Radio waves", "(b) Visible light", "(c) X-rays", "(d) Gamma rays"], "correct": "(d) Gamma rays", "expText": "", "expImage": null},
        {"id": 8, "qNum": 8, "qText": "The speed of sound is maximum in:", "qImage": null, "options": ["(a) Vacuum", "(b) Gases", "(c) Liquids", "(d) Solids"], "correct": "(d) Solids", "expText": "", "expImage": null},
        {"id": 9, "qNum": 9, "qText": "The device used to measure potential difference in a circuit is called a:", "qImage": null, "options": ["(a) Galvanometer", "(b) Ammeter", "(c) Voltmeter", "(d) Potentiometer"], "correct": "(c) Voltmeter", "expText": "", "expImage": null},
        {"id": 10, "qNum": 10, "qText": "Total internal reflection occurs only when light travels from:", "qImage": null, "options": ["(a) A rarer medium to a denser medium", "(b) A denser medium to a rarer medium", "(c) One medium to another of the same refractive index", "(d) Vacuum to any medium"], "correct": "(b) A denser medium to a rarer medium", "expText": "", "expImage": null},
        {"id": 11, "qNum": 11, "qText": "The oxidation state of oxygen in hydrogen peroxide ($H_2O_2$) is:", "qImage": null, "options": ["(a) -2", "(b) -1", "(c) 0", "(d) +1"], "correct": "(b) -1", "expText": "", "expImage": null},
        {"id": 12, "qNum": 12, "qText": "The maximum number of electrons that can be accommodated in a principal shell with quantum number $n$ is:", "qImage": null, "options": ["(a) $n$", "(b) $n^2$", "(c) $2n$", "(d) $2n^2$"], "correct": "(d) $2n^2$", "expText": "", "expImage": null},
        {"id": 13, "qNum": 13, "qText": "Which of the following is the purest form of commercial iron?", "qImage": null, "options": ["(a) Cast iron", "(b) Pig iron", "(c) Wrought iron", "(d) Steel"], "correct": "(c) Wrought iron", "expText": "", "expImage": null},
        {"id": 14, "qNum": 14, "qText": "The shape of a water ($H_2O$) molecule is:", "qImage": null, "options": ["(a) Linear", "(b) Tetrahedral", "(c) Trigonal planar", "(d) Bent or V-shaped"], "correct": "(d) Bent or V-shaped", "expText": "", "expImage": null},
        {"id": 15, "qNum": 15, "qText": "Which of the following isotopes of hydrogen is radioactive?", "qImage": null, "options": ["(a) Protium", "(b) Deuterium", "(c) Tritium", "(d) None of these"], "correct": "(c) Tritium", "expText": "", "expImage": null},
        {"id": 16, "qNum": 16, "qText": "The Haber process is primarily used for the industrial synthesis of:", "qImage": null, "options": ["(a) Nitric acid", "(b) Sulphuric acid", "(c) Ammonia", "(d) Sodium carbonate"], "correct": "(c) Ammonia", "expText": "", "expImage": null},
        {"id": 17, "qNum": 17, "qText": "The metal present in Vitamin B12 is:", "qImage": null, "options": ["(a) Iron", "(b) Magnesium", "(c) Cobalt", "(d) Zinc"], "correct": "(c) Cobalt", "expText": "", "expImage": null},
        {"id": 18, "qNum": 18, "qText": "The pH of a perfectly neutral solution at 298 K is:", "qImage": null, "options": ["(a) 0", "(b) 7", "(c) 14", "(d) 1"], "correct": "(b) 7", "expText": "", "expImage": null},
        {"id": 19, "qNum": 19, "qText": "The monomer of the polymer Teflon is:", "qImage": null, "options": ["(a) Ethylene", "(b) Vinyl chloride", "(c) Tetrafluoroethylene", "(d) Styrene"], "correct": "(c) Tetrafluoroethylene", "expText": "", "expImage": null},
        {"id": 20, "qNum": 20, "qText": "Which of the following is a noble gas?", "qImage": null, "options": ["(a) Nitrogen", "(b) Chlorine", "(c) Argon", "(d) Fluorine"], "correct": "(c) Argon", "expText": "", "expImage": null},
        {"id": 21, "qNum": 21, "qText": "The value of $\\lim_{x \\to 0} \\frac{\\sin x}{x}$ is:", "qImage": null, "options": ["(a) 0", "(b) 1", "(c) $\\infty$", "(d) -1"], "correct": "(b) 1", "expText": "", "expImage": null},
        {"id": 22, "qNum": 22, "qText": "A square matrix $A$ is said to be symmetric if:", "qImage": null, "options": ["(a) $A^T = -A$", "(b) $A^T = A$", "(c) $A^T = A^{-1}$", "(d) $A^T = 0$"], "correct": "(b) $A^T = A$", "expText": "", "expImage": null},
        {"id": 23, "qNum": 23, "qText": "The sum of the roots of the quadratic equation $ax^2 + bx + c = 0$ is:", "qImage": null, "options": ["(a) $\\frac{c}{a}$", "(b) $-\\frac{c}{a}$", "(c) $\\frac{b}{a}$", "(d) $-\\frac{b}{a}$"], "correct": "(d) $-\\frac{b}{a}$", "expText": "", "expImage": null},
        {"id": 24, "qNum": 24, "qText": "The number of ways to arrange $n$ distinct objects in a straight line is:", "qImage": null, "options": ["(a) $n$", "(b) $n^2$", "(c) $n!$", "(d) $2^n$"], "correct": "(c) $n!$", "expText": "", "expImage": null},
        {"id": 25, "qNum": 25, "qText": "The equation of the x-axis in a 2D coordinate system is:", "qImage": null, "options": ["(a) $x = 0$", "(b) $y = 0$", "(c) $x = y$", "(d) $x + y = 0$"], "correct": "(b) $y = 0$", "expText": "", "expImage": null},
        {"id": 26, "qNum": 26, "qText": "If $i$ is the imaginary unit ($\\sqrt{-1}$), then the value of $i^2$ is:", "qImage": null, "options": ["(a) 1", "(b) -1", "(c) $i$", "(d) $-i$"], "correct": "(b) -1", "expText": "", "expImage": null},
        {"id": 27, "qNum": 27, "qText": "If $A$ and $B$ are independent events, then the probability of both occurring, $P(A \\cap B)$, is:", "qImage": null, "options": ["(a) $P(A) + P(B)$", "(b) $P(A) - P(B)$", "(c) $P(A) \\cdot P(B)$", "(d) $\\frac{P(A)}{P(B)}$"], "correct": "(c) $P(A) \\cdot P(B)$", "expText": "", "expImage": null},
        {"id": 28, "qNum": 28, "qText": "The geometric mean of two positive numbers $a$ and $b$ is:", "qImage": null, "options": ["(a) $\\frac{a+b}{2}$", "(b) $\\sqrt{ab}$", "(c) $\\frac{2ab}{a+b}$", "(d) $a^2 + b^2$"], "correct": "(b) $\\sqrt{ab}$", "expText": "", "expImage": null},
        {"id": 29, "qNum": 29, "qText": "The derivative of $e^x$ with respect to $x$ is:", "qImage": null, "options": ["(a) $x e^{x-1}$", "(b) $e^x$", "(c) $\\ln x$", "(d) $\\frac{e^x}{x}$"], "correct": "(b) $e^x$", "expText": "", "expImage": null},
        {"id": 30, "qNum": 30, "qText": "The angle between two perpendicular lines is:", "qImage": null, "options": ["(a) $0^\\circ$", "(b) $45^\\circ$", "(c) $90^\\circ$", "(d) $180^\\circ$"], "correct": "(c) $90^\\circ$", "expText": "", "expImage": null}
    ];
    
    const studentName = localStorage.getItem('exam_student_name') || 'Guest Student';
    const root = document.documentElement;
    root.style.setProperty('--bg-color', '#f8fafc');
    root.style.setProperty('--card-bg', '#ffffff');
    root.style.setProperty('--primary', '#2563eb');
    root.style.setProperty('--text-main', '#0f172a');

    let currentIndex = 0, score = 0, answered = new Array(quizData.length).fill(false);
    const app = document.getElementById('app');
    let timerInterval, timeRemaining;
    
    if (CONFIG.shuffle) {
      quizData.sort(() => Math.random() - 0.5);
      quizData.forEach(q => q.options.sort(() => Math.random() - 0.5));
    }

    if (CONFIG.timerType === 'global') timeRemaining = CONFIG.timerValue * 60;
    if (CONFIG.timerType === 'question') timeRemaining = CONFIG.timerValue;

    function startTimer() {
        if (CONFIG.timerType === 'none') return;
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeRemaining--; updateTimerDisplay();
            if (timeRemaining <= 0) { clearInterval(timerInterval); handleTimeOut(); }
        }, 1000);
    }
    
    function updateTimerDisplay() {
        const timerEl = document.getElementById('clock'); if(!timerEl) return;
        const m = Math.floor(timeRemaining / 60).toString().padStart(2, '0'), s = (timeRemaining % 60).toString().padStart(2, '0');
        timerEl.innerText = `${m}:${s}`;
        if (timeRemaining <= 10) timerEl.classList.add('warning'); else timerEl.classList.remove('warning');
    }
    
    function handleTimeOut() {
        if (CONFIG.timerType === 'global') { currentIndex = quizData.length; render(); } 
        else if (CONFIG.timerType === 'question' && !answered[currentIndex]) { quizData[currentIndex].userSelected = "TIMED OUT"; answered[currentIndex] = true; render(); }
    }

    function render() {
        if (currentIndex >= quizData.length) { clearInterval(timerInterval); renderResults(); return; }
        const q = quizData[currentIndex], isAnswered = answered[currentIndex];
        
        if (CONFIG.timerType === 'question' && !isAnswered && timeRemaining <= 0) { timeRemaining = CONFIG.timerValue; startTimer(); } 
        else if (CONFIG.timerType === 'global' && !timerInterval && timeRemaining > 0) { startTimer(); }

        let html = `<div class="card"><div class="status-bar"><span>Question ${currentIndex + 1} of ${quizData.length}</span><span class="timer" id="clock">${CONFIG.timerType !== 'none' ? '--:--' : 'UNTIMED'}</span></div>`;
        
        if (q.qImage) html += `<img src="${q.qImage}" class="question-img">`;
        if (q.qText) html += `<div class="question-text">${q.qText}</div>`;
        
        html += `<div class="options-grid">`;
        q.options.forEach((opt, index) => {
            let cssClass = 'option';
            if (isAnswered) {
                cssClass += ' disabled';
                if (opt === q.correct) cssClass += ' correct';
                else if (q.userSelected === opt) cssClass += ' wrong';
            }
            html += `<div class="${cssClass}" onclick="selectAnswer(${index})">${opt}</div>`;
        });
        html += `</div>`;

        if (q.expImage || q.expText) {
            html += `<div class="explanation-box" style="display: ${isAnswered ? 'block' : 'none'}"><strong style="color: var(--primary); text-transform: uppercase; font-size: 0.9rem; letter-spacing: 1px;">Explanation:</strong><br><br>`;
            if (q.expImage) html += `<img src="${q.expImage}" class="exp-img">`;
            if (q.expText) html += `<div>${q.expText}</div>`;
            html += `</div>`;
        }

        html += `<div class="controls"><button onclick="prev()" ${currentIndex === 0 ? 'disabled' : ''}>Back</button><button onclick="next()">${currentIndex === quizData.length - 1 ? 'Finish' : 'Next'}</button></div></div>`;
        app.innerHTML = html;
        if(CONFIG.timerType !== 'none' && !isAnswered) updateTimerDisplay();
        triggerMathJax();
    }

    function renderResults() {
        let html = `
        <div class="results-screen">
            <div class="bg-blob-results"></div>
            <div class="results-content">
                <h2 class="results-title">Exam Completed</h2>
                <p class="results-desc">Your final score assessment is securely recorded.</p>
               <div class="student-badge-new">
                  <span class="badge-label">Candidate Name</span>
                  <strong class="badge-name">${studentName}</strong>
              </div>
               <div class="score-box">
                  <span class="score-value">${score}</span>
                  <span class="score-total">/ ${quizData.length}</span>
              </div>
          </div>
            <div class="bottom-bar-results">
              <button class="action-btn-results" onclick="exitHome()">Exit to Home</button>
          </div>
        </div>`;
        app.innerHTML = html;
    }

    function exitHome() {
        let breakdown = "";
        quizData.forEach((q, index) => {
            let status = "";
            let qNum = index + 1;
            if (q.userSelected === "TIMED OUT") { status = "⏳ (Timed Out)"; } 
            else if (q.userSelected === q.correct) { status = "✅"; } 
            else { status = `❌ (Ans: ${q.userSelected || 'None'})`; }
            breakdown += `Q${qNum}: ${status}\n`;
        });

        const message = `*CANDIDATE NAME* : ${studentName}\n*SCORE*: ${score}/${quizData.length}\n\n*Detailed Report:*\n${breakdown}`;
        const phoneNumber = "919497333886"; 
        const whatsappUrl = `https://wa.me/${phoneNumber}?text=${encodeURIComponent(message)}`;
        
        window.location.href = whatsappUrl;
        setTimeout(() => { if(CONFIG.exitUrl) window.location.href = CONFIG.exitUrl; }, 2000);
    }

    function selectAnswer(optIndex) {
        if (answered[currentIndex]) return;
        const q = quizData[currentIndex];
        q.userSelected = q.options[optIndex]; answered[currentIndex] = true;
        if (q.userSelected === q.correct) score++;
        if(CONFIG.timerType === 'question') clearInterval(timerInterval); 
        render(); 
    }
    
    function next() {
        currentIndex++; if(CONFIG.timerType === 'question' && currentIndex < quizData.length && !answered[currentIndex]) { timeRemaining = CONFIG.timerValue; startTimer(); } render(); 
    }
    
    function prev() {
        if(currentIndex > 0) currentIndex--; if(CONFIG.timerType === 'question') clearInterval(timerInterval); render(); 
    }
    
    function triggerMathJax() { 
        if (window.MathJax) MathJax.typesetPromise([document.getElementById('app')]).catch(e => console.log(e)); 
    }
    
   if(CONFIG.timerType === 'global' || CONFIG.timerType === 'question') startTimer();
    render();
</script>
</body>
</html>
