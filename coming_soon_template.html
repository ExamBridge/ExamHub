<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon...</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            height: 100%;
            background-color: #ffffff;
            overflow: hidden;
            position: relative;
        }

        .bg-gradient {
            position: absolute;
            top: -50px;
            right: -50px;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255, 230, 220, 0.6) 0%, rgba(255, 255, 255, 0) 70%);
            z-index: 1;
        }

        .back-btn {
            position: absolute;
            top: 25px;
            left: 20px;
            width: 45px;
            height: 45px;
            background: #ffffff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            cursor: pointer;
            text-decoration: none;
            z-index: 10;
            transition: transform 0.2s ease;
        }

        .back-btn:active {
            transform: scale(0.95);
        }

        .back-btn svg {
            width: 20px;
            height: 20px;
            fill: #ff6b52;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 20px;
        }

        .icon-box {
            margin-bottom: 25px;
        }

        .title {
            font-size: 26px;
            font-weight: 700;
            color: #ff6b52;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        .subtitle {
            font-size: 15px;
            color: #7f8c8d;
            font-weight: 500;
        }
    </style>
</head>
